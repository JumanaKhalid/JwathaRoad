نعوا صوب القطر، ولا يُحرَموا جَريم الثمار عند بلاغه، والعلاء بن الحضرمي أمين رسول الله على برها وبحرها وحاضرها وسراياها، وما خرج منها، وأهل البحرين خفراؤه من الضيم، وأعوانه على الظالم، وأنصاره في الملاحم، عليهم بذلك عهد الله وميثاقه، لا يبدلوا قولاً، ولا يريدوا فرقة، ولهم على جند المسلمين الشركة في الفيء، والعدل في الحكم، والقصد في السيرة، حكم لا تبديل له في الفريقين كليهما، والله ورسوله يشهد عليهم».", "en": "The Prophet’s ﷺ letter to al-Akbar ibn ‘Abd al-Qays:\n“From Muhammad, the Messenger of God, to al-Akbar ibn ‘Abd al-Qays. They are safe under the protection of God and of His Messenger for the misdeeds they committed in the Jahiliyya, and they must keep what they pledged. They shall not be barred from the road of provisions, nor denied the falling rain, nor deprived of the harvested dates when they ripen. Al-‘Ala’ ibn al-Hadrami is the trustee of the Messenger of God over its land and sea, its settled people and its expeditions, and what comes from it. The people of historical Bahrain are his guards against injustice, his helpers against the oppressor and his supporters in battle; upon them for this is the covenant and pledge of God. They shall not change their word nor seek division. They are owed by the Muslim army a share in the spoils, justice in judgement and moderation in conduct: a ruling that does not change, for both parties, and God and His Messenger are witness over them.”"}, "l": {"ar": "الإسلام يحفظ الأمن الغذائي وطرق التجارة ومصادر الماء، ويجعل العلاقة بين الحاكم والرعية عهداً واضح الحقوق والواجبات.", "en": "Islam protected food security, trade routes and water sources, and made the bond between ruler and ruled a covenant with clear rights and duties."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا. (اعتُمد لفظ الطبقات الكبرى: «ولا يُحرَموا جَريم الثمار عند بلاغه» -والجَريم: التمر المصروم-، وفي تاريخ هجر: «ولا يحرقوا حريم الثمار عند بلوغه»، وهو تصحيف).", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar. (The wording of al-Tabaqat is adopted, “nor deprived of the harvested dates when they ripen”; Tarikh Hajar has a misprint.)"}, "r": {"ar": "أحكام العهود والمواثيق والأمان؛ حقوق الرعية وواجباتها؛ أحكام الفيء؛ العدل في الحكم.", "en": "Rulings on covenants, pledges and protection; the rights and duties of subjects; rulings on spoils (fay’); justice in judgement."}, "cat": "text", "sec": "d"}, {"id": 29, "t": {"ar": "شهادة عبد الرحمن بن عوف", "en": "'Abd al-Rahman ibn 'Awf's testimony"}, "c": {"ar": "عن بجالة قال: أتانا كتاب عمر بن الخطاب قبل موته بسنة: فرّقوا بين كل ذي محرم من المجوس، «ولم يكن عمر أخذ الجزية من المجوس حتى شهد عبد الرحمن بن عوف أن رسول الله صلى الله عليه وسلم أخذها من مجوس هجر».", "en": "Bajala said: A letter from ‘Umar ibn al-Khattab reached us a year before his death: “Separate every Magian from any close relative he has married.” ‘Umar had not taken jizya from the Magians until ‘Abd al-Rahman ibn ‘Awf testified that the Messenger of God ﷺ took it from the Magians of Hajar."}, "l": {"ar": "رجوع عمر رضي الله عنه إلى السنة حين بلغته؛ فالحق أحق أن يُتّبع، والسنة حاكمة على الرأي.", "en": "'Umar returned to the Sunna as soon as it reached him: the truth deserves to be followed, and the Sunna governs opinion."}, "s": {"ar": "صحيح البخاري، كتاب الجزية والموادعة، باب الجزية والموادعة مع أهل الحرب، رقم (3156–3157).", "en": "Sahih al-Bukhari 3156–3157."}, "r": {"ar": "تعريف الجزية وأحكامها؛ حكم أخذ الجزية من المجوس؛ حجية السنة وقبول خبر الواحد العدل.", "en": "The definition and rulings of jizya; taking jizya from Magians; the authority of the Sunna and accepting a single trustworthy report."}, "cat": "text", "sec": "d"}, {"id": 30, "t": {"ar": "سنّوا بهم سنة أهل الكتاب", "en": "\"Treat them as People of the Book\""}, "c": {"ar": "أن عمر بن الخطاب ذكر المجوس فقال: ما أدري كيف أصنع في أمرهم؟ فقال عبد الرحمن بن عوف: أشهد لسمعت رسول الله صلى الله عليه وسلم يقول: «سنّوا بهم سنة أهل الكتاب».", "en": "‘Umar ibn al-Khattab mentioned the Magians and said: “I do not know what to do about them.” ‘Abd al-Rahman ibn ‘Awf said: “I testify that I heard the Messenger of God ﷺ say: ‘Treat them as you treat the People of the Book.’”"}, "l": {"ar": "دقة الشريعة في التفريق بين الأحكام؛ فالمساواة في حكم لا تستلزم المساواة في كل الأحكام.", "en": "The Sharia distinguishes precisely between rulings: equality in one ruling does not mean equality in all."}, "s": {"ar": "موطأ الإمام مالك، كتاب الزكاة، باب جزية أهل الكتاب والمجوس (وفي إسناده انقطاع، ويشهد لأصله حديث البخاري السابق).", "en": "Muwatta' Malik, Book of Zakat (its chain is broken; its core is supported by the Bukhari report)."}, "r": {"ar": "أحكام أهل الذمة: يعامل المجوس معاملة أهل الكتاب في الجزية فقط، ولا تحل ذبائحهم ولا نكاح نسائهم عند جمهور الفقهاء.", "en": "Rulings on protected non-Muslims: Magians are treated like People of the Book in jizya only; most jurists do not permit their slaughtered animals or marriage to their women."}, "cat": "text", "sec": "d"}, {"id": 31, "t": {"ar": "صلح البحرين", "en": "The peace of Bahrain"}, "c": {"ar": "عن عمرو بن عوف الأنصاري: «أن رسول الله صلى الله عليه وسلم بعث أبا عبيدة بن الجراح إلى البحرين يأتي بجزيتها، وكان رسول الله صلى الله عليه وسلم هو صالح أهل البحرين، وأمّر عليهم العلاء بن الحضرمي».", "en": "‘Amr ibn ‘Awf al-Ansari reported that the Messenger of God ﷺ sent Abu ‘Ubayda ibn al-Jarrah to historical Bahrain (the region centred on al-Ahsa) to bring its jizya. The Messenger of God ﷺ had made peace with the people of Bahrain and appointed al-‘Ala’ ibn al-Hadrami over them."}, "l": {"ar": "حرص النبي ﷺ على تنظيم شؤون البلاد التي دخلت في الإسلام وتعيين الأمناء الأكفاء.", "en": "The Prophet ﷺ organised the affairs of lands that entered Islam and appointed capable, trustworthy officials."}, "s": {"ar": "صحيح البخاري، كتاب الجزية والموادعة، باب الجزية والموادعة، رقم (3158) من حديث عمرو بن عوف الأنصاري؛ صحيح مسلم، كتاب الزهد والرقائق، رقم (2961).", "en": "Sahih al-Bukhari 3158; Sahih Muslim 2961."}, "r": {"ar": "أحكام الصلح والمعاهدات؛ تعريف الجزية وأحكامها؛ نظام الولاية وتعيين العمال.", "en": "Rulings on treaties and agreements; the definition and rulings of jizya; governance and appointing officials."}, "cat": "text", "sec": "d"}, {"id": 32, "t": {"ar": "أبشروا وأمّلوا", "en": "\"Rejoice and hope\""}, "c": {"ar": "«فقدم أبو عبيدة بمال من البحرين، فسمعت الأنصار بقدوم أبي عبيدة، فوافت صلاة الصبح مع النبي صلى الله عليه وسلم، فلما صلى بهم الفجر انصرف، فتعرضوا له، فتبسم رسول الله صلى الله عليه وسلم حين رآهم، وقال: أظنكم قد سمعتم أن أبا عبيدة قد جاء بشيء؟ قالوا: أجل يا رسول الله، قال: فأبشروا وأمّلوا ما يسركم، فوالله لا الفقر أخشى عليكم، ولكن أخشى عليكم أن تبسط عليكم الدنيا كما بسطت على من كان قبلكم، فتنافسوها كما تنافسوها وتهلككم كما أهلكتهم».", "en": "“Abu ‘Ubayda arrived with wealth from historical Bahrain. The Ansar heard of his arrival and came to the dawn prayer with the Prophet ﷺ. When he finished the prayer and turned to leave, they approached him. The Messenger of God ﷺ smiled when he saw them and said: ‘I think you have heard that Abu ‘Ubayda has brought something?’ They said: ‘Yes, Messenger of God.’ He said: ‘Then rejoice and hope for what pleases you. By God, it is not poverty I fear for you, but I fear that the world will be spread out for you as it was for those before you, and you will compete for it as they did, and it will destroy you as it destroyed them.’”"}, "l": {"ar": "خطر التنافس على الدنيا على الأمم؛ والغنى فتنة كما أن الفقر فتنة.", "en": "Competing for worldly wealth endangers nations; wealth is a trial just as poverty is."}, "s": {"ar": "صحيح البخاري، كتاب الجزية والموادعة، رقم (3158)؛ صحيح مسلم، كتاب الزهد والرقائق، رقم (2961).", "en": "Sahih al-Bukhari 3158; Sahih Muslim 2961."}, "r": {"ar": "الإيمان باليوم الآخر (أحد أركان الإيمان) ← الزهد وعدم الاغترار بالدنيا؛ علامات النبوة (وقع ما أخبر به ﷺ من الفتوح).", "en": "Belief in the Last Day (a pillar of faith) → detachment from worldly things; signs of prophethood (the conquests he foretold came true)."}, "cat": "text", "sec": "b"}, {"id": 33, "t": {"ar": "مال البحرين في المسجد", "en": "Bahrain's wealth in the mosque"}, "c": {"ar": "عن أنس قال: «أتي النبي صلى الله عليه وسلم بمال من البحرين، فقال: انثروه في المسجد، وكان أكثر مال أتي به رسول الله صلى الله عليه وسلم، فخرج رسول الله صلى الله عليه وسلم إلى الصلاة ولم يلتفت إليه، فلما قضى الصلاة جاء فجلس إليه، فما كان يرى أحداً إلا أعطاه، إذ جاءه العباس فقال: يا رسول الله أعطني، فإني فاديت نفسي وفاديت عقيلاً، فقال له رسول الله صلى الله عليه وسلم: خذ، فحثا في ثوبه، ثم ذهب يقلّه فلم يستطع، فقال: يا رسول الله، اؤمر بعضهم يرفعه إليّ، قال: لا، قال: فارفعه أنت عليّ، قال: لا، فنثر منه، ثم احتمله فألقاه على كاهله، ثم انطلق، فما زال رسول الله صلى الله عليه وسلم يتبعه بصره حتى خفي علينا، عجباً من حرصه، فما قام رسول الله صلى الله عليه وسلم وثَمّ منها درهم».", "en": "Anas said: “Wealth from historical Bahrain was brought to the Prophet ﷺ and he said: ‘Spread it out in the mosque.’ It was the largest sum ever brought to the Messenger of God ﷺ. He went out to the prayer without turning to it. When he had finished the prayer, he came and sat beside it, and gave to everyone he saw. Then al-‘Abbas came and said: ‘Messenger of God, give me, for I ransomed myself and ‘Aqil.’ The Messenger of God ﷺ said: ‘Take.’ He scooped it into his garment, then tried to lift it but could not. He said: ‘Messenger of God, tell someone to lift it onto me.’ He said: ‘No.’ He said: ‘Then lift it onto me yourself.’ He said: ‘No.’ So he poured some of it out, then lifted it onto his shoulders and left. The Messenger of God ﷺ kept watching him until he was out of sight, amazed at his eagerness. The Messenger of God ﷺ did not rise while a single dirham of it remained.”"}, "l": {"ar": "كرم النبي ﷺ وزهده؛ إذ لم يدّخر لنفسه شيئاً، وسرعة إيصال الحقوق إلى أهلها.", "en": "The Prophet's generosity and detachment: he kept nothing for himself and delivered rights quickly to those owed them."}, "s": {"ar": "صحيح البخاري، كتاب الصلاة، باب القسمة وتعليق القنو في المسجد، رقم (421).", "en": "Sahih al-Bukhari, Book of Prayer, chapter on distributing wealth in the mosque, 421."}, "r": {"ar": "أحكام بيت المال وقسمة الفيء؛ جواز قسمة المال في المسجد.", "en": "Rulings on the public treasury and distributing revenue; permission to distribute wealth in the mosque."}, "cat": "item", "sec": "d"}, {"id": 34, "t": {"ar": "أعظم مال أتى النبي ﷺ", "en": "The largest sum the Prophet ﷺ received"}, "c": {"ar": "كان مال البحرين أكبر قدر من المال تسلمه رسول الله ﷺ، فلم ير مالاً أكثر منه لا قبله ولا بعده؛ ورد عليه منها مائة ألف، وبلغ في إحدى السنوات مائة وخمسين ألف دينار. وفي رواية حميد بن هلال: بعث ابن الحضرمي إلى رسول الله ﷺ من البحرين بثمانين ألفاً، ما أتاه مال أكثر منه لا قبل ولا بعد.", "en": "The wealth of historical Bahrain was the largest sum the Messenger of God ﷺ ever received; he saw no greater sum before it or after. A hundred thousand reached him from it, and in one year it came to a hundred and fifty thousand dinars. In the narration of Humayd ibn Hilal: Ibn al-Hadrami sent eighty thousand from Bahrain to the Messenger of God ﷺ; no greater sum ever reached him before or after."}, "l": {"ar": "أسهمت موارد البحرين في بناء اقتصاد الدولة الإسلامية الناشئة.", "en": "The revenues of historical Bahrain (the region centred on al-Ahsa) helped build the economy of the young Islamic state."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا (أثر البحرين في الحياة الإدارية والاقتصادية) نقلاً عن: معجم ما استعجم للبكري، نيل الأوطار للشوكاني، المعرفة والتاريخ ليعقوب بن سفيان الفسوي. (تختلف الأرقام بين المصادر).", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar (the influence of Bahrain on administrative and economic life), citing al-Bakri, Mu‘jam ma Ista‘jam; al-Shawkani, Nayl al-Awtar; al-Fasawi, al-Ma‘rifa wa al-Tarikh. (The figures differ between sources.)"}, "r": {"ar": "أحكام بيت المال والفيء والخراج.", "en": "Rulings on the public treasury, spoils and land tax."}, "cat": "item", "sec": "d"}, {"id": 35, "t": {"ar": "وعد جابر", "en": "The promise to Jabir"}, "c": {"ar": "عن جابر قال: قال النبي صلى الله عليه وسلم: «لو قد جاء مال البحرين قد أعطيتك هكذا وهكذا وهكذا»، فلم يجئ مال البحرين حتى قبض النبي صلى الله عليه وسلم، فلما جاء مال البحرين أمر أبو بكر فنادى: من كان له عند النبي صلى الله عليه وسلم عدة أو دين فليأتنا، فأتيته فقلت: إن النبي صلى الله عليه وسلم قال لي كذا وكذا، فحثى لي حثية، فعددتها فإذا هي خمسمائة، وقال: خذ مثليها.", "en": "Jabir said: The Prophet ﷺ said: “When the wealth of historical Bahrain comes, I will give you this much, and this much, and this much.” The wealth of Bahrain did not come until the Prophet ﷺ had died. When it came, Abu Bakr had it announced: “Whoever was owed a promise or a debt by the Prophet ﷺ, let him come to us.” I came and said: “The Prophet ﷺ told me such and such.” He scooped a handful for me; I counted it and it was five hundred. He said: “Take twice as much again.”"}, "l": {"ar": "الوفاء بالوعد من الإيمان، وحرص الخليفة على إنجاز عهود النبي ﷺ بعد وفاته.", "en": "Keeping promises is part of faith, and the Caliph made sure to fulfil the Prophet's commitments after his death."}, "s": {"ar": "صحيح البخاري، كتاب الكفالة، باب من تكفّل عن ميت دَيناً، رقم (2296).", "en": "Sahih al-Bukhari 2296."}, "r": {"ar": "أحكام الوعد والوفاء به؛ أحكام الكفالة وقضاء ديون الميت وعِداته.", "en": "Rulings on promises and keeping them; guarantees, and settling a deceased person's debts and pledges."}, "cat": "text", "sec": "d"}, {"id": 36, "t": {"ar": "الأشج وابن أخته عمرو", "en": "Al-Ashajj and his nephew ‘Amr"}, "c": {"ar": "قصة لقاء عمرو بن عبد القيس وإسلامه وإسلام خاله الأشج: روى ابن حجر رحمه الله تعالى وغيره عن صُحار بن العباس العبدي، ومزيدة بن مالك العبدي العصري رضي الله عنهما في نفر من عبد القيس، أنهم قالوا: كان الأشج أشج عبد القيس، واسمه المنذر بن عائذ بن المنذر بن الحارث بن النعمان العصري، صديقاً لراهب ينزل بدارين، فكان يلقاه في كل عام، فلقيه عاماً بالزارة فأخبر الأشج أن نبياً يخرج بمكة، يأكل الهدية ولا يأكل الصدقة، بين كتفيه علامة، يظهر على الأديان. ثم مات الراهب، فبعث الأشج ابن أخت له من بني عامر بن عصر يقال له عمرو بن عبد قيس، وهو على بنته أمامة بنت الأشج، وبعث معه تمراً ليبيعه، وملاحف، وضم إليه دليلاً يقال له الأريقط، فأتى مكة عام الهجرة، فأتى النبي ﷺ وأتاه بتمر فقال: هذا صدقة، فلم يقبله، فبعث إليه بغيره وقال: هذا هدية، فقبله، وتلطف حتى نظر إلى ما بين كتفيه، فدعاه النبي ﷺ إلى الإسلام فأسلم، وعلمه الحمد و«اقرأ باسم ربك»، وقال له: «ادع خالك إلى الإسلام». فرجع وأقام دليله بمكة، فقدم البحرين فدخل منزله بتحية الإسلام، فخرجت امرأته إلى أبيها نافرة وقالت: صبأ ورب الكعبة عمرو، فانتهرها أبوها وقال: إني لأبغض المرأة تخالف زوجها، وأتاه الأشج فأخبره الخبر، فأسلم الأشج، وكتم إسلامه حيناً، ثم خرج مكتتماً بإسلامه في سبعة عشر رجلاً وفداً على النبي ﷺ من أهل هجر، وقال بعضهم: كانوا اثني عشر رجلاً، فقدموا على النبي ﷺ فأسلموا.", "en": "The story of ‘Amr ibn ‘Abd Qays, his Islam and that of his uncle al-Ashajj. Ibn Hajar and others narrated from Suhar ibn al-‘Abbas al-‘Abdi and Mazida ibn Malik al-‘Abdi al-‘Asri, among a group of ‘Abd al-Qays, that al-Ashajj of ‘Abd al-Qays, al-Mundhir ibn ‘A’idh, was a friend of a monk who lived at Darin and met him every year. One year he met him at al-Zara, and the monk told him that a prophet would appear in Makkah who eats gifts but not charity, with a sign between his shoulders, and who would prevail over the religions. Then the monk died. Al-Ashajj sent his nephew ‘Amr ibn ‘Abd Qays, who was married to his daughter Umama, with dates and cloaks to sell and a guide called al-Uraiqit. He reached Makkah in the year of the Hijra and came to the Prophet ﷺ with dates, saying: “This is charity,” and he did not accept it. He brought others and said: “This is a gift,” and he accepted it. ‘Amr managed to see what was between his shoulders. The Prophet ﷺ invited him to Islam and he accepted it; he taught him al-Fatiha and “Read in the name of your Lord”, and told him: “Invite your uncle to Islam.” He returned to historical Bahrain and entered his home with the greeting of Islam. His wife ran to her father saying: “By the Lord of the Ka‘ba, ‘Amr has changed his religion!” Her father rebuked her: “I hate a woman who opposes her husband.” Al-Ashajj came, heard the news and embraced Islam, hiding it for a while. Then he set out, still hiding his Islam, with seventeen men (some say twelve) as a delegation of the people of Hajar to the Prophet ﷺ, and they embraced Islam."}, "l": {"ar": "كل إسلام المنطقة الشرقية بدأ من رجل واحد هو المنذر بن عائذ (الأشج)، وسيبقى أجر من أسلم بسببه في صحيفته، وكان لاسمه نصيب من مهمة النبي ﷺ «نذيراً»؛ وطالب الحق يتحرّاه ويسعى إليه؛ والدعوة تبدأ بالأقربين؛ ويربط الخبر دارين والزارة وهجر بأول إسلام عبد القيس.", "en": "The Islam of the whole Eastern Region began with one man, al-Mundhir ibn ‘A’idh (al-Ashajj), and the reward of all who embraced Islam through him remains on his record; his name shares in the Prophet’s ﷺ mission as a “warner” (nadhir). The seeker of truth searches for it; the call begins with one’s nearest; and the story links Darin, al-Zara and Hajar to the first Islam of ‘Abd al-Qays."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ الإصابة في تمييز الصحابة لابن حجر؛ الأنساب للسمعاني (بتصرف)؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; Ibn Hajar, al-Isaba; al-Sam‘ani, al-Ansab (adapted); al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "علامات النبوة: لا يأكل الصدقة ويأكل الهدية، وخاتم النبوة بين كتفيه؛ البشارة بالنبي ﷺ عند أهل الكتاب (الأعراف: 157)؛ تعليم الفاتحة وأوائل العلق.", "en": "Signs of prophethood: he did not eat charity but ate gifts, and the seal of prophethood was between his shoulders; the glad tidings of the Prophet ﷺ among the People of the Book (al-A‘raf 7:157); teaching al-Fatiha and the opening of al-‘Alaq."}, "cat": "figure", "sec": "b"}, {"id": 37, "t": {"ar": "الوفادة الأولى", "en": "The first delegation"}, "c": {"ar": "الوفادة الأولى لعبد القيس: كانت قبل فتح مكة (قيل سنة 5هـ أو قبلها)، وكانوا ثلاثة عشر أو أربعة عشر رجلاً فيهم الأشج، ويدل على تقدّمها قولهم: «وبيننا وبينك هذا الحي من كفار مضر».", "en": "The first delegation of 'Abd al-Qays came before the conquest of Makkah (said to be 5 AH or earlier). They were thirteen or fourteen men, including al-Ashajj. Their words \"between us and you is this tribe of the disbelievers of Mudar\" show that it came early."}, "l": {"ar": "سبق عبد القيس إلى الإسلام قبل كثير من العرب رغم بعد الديار والخطر في الطريق.", "en": "'Abd al-Qays embraced Islam before many Arabs, despite the distance and the dangers of the road."}, "s": {"ar": "فتح الباري لابن حجر، كتاب الإيمان، شرح الحديث رقم (53)، حيث جمع بين الروايات وبيّن أن لعبد القيس وفادتين.", "en": "Ibn Hajar, Fath al-Bari, on hadith 53 (reconciling the reports of two delegations)."}, "r": {"ar": "تعريف الإيمان وأركانه (ما عُلّموه في هذه الوفادة) ← أركان الإسلام والشهادتان.", "en": "The definition and pillars of faith (what they were taught on this visit) → the pillars of Islam and the two testimonies."}, "cat": "text", "sec": "b"}, {"id": 38, "t": {"ar": "مرحباً بالقوم", "en": "\"Welcome to the people\""}, "c": {"ar": "عن ابن عباس: «إن وفد عبد القيس لما أتوا النبي صلى الله عليه وسلم قال: من القوم؟ -أو من الوفد؟- قالوا: ربيعة، قال: مرحباً بالقوم -أو بالوفد- غير خزايا ولا ندامى، فقالوا: يا رسول الله إنا لا نستطيع أن نأتيك إلا في الشهر الحرام، وبيننا وبينك هذا الحي من كفار مضر، فمرنا بأمر فصل نخبر به من وراءنا، وندخل به الجنة، وسألوه عن الأشربة».", "en": "Ibn ‘Abbas reported: “When the delegation of ‘Abd al-Qays came to the Prophet ﷺ, he asked: ‘Who are the people?’ (or ‘Who is the delegation?’). They said: ‘Rabi‘a.’ He said: ‘Welcome to the people (or the delegation), neither disgraced nor regretful.’ They said: ‘Messenger of God, we can only come to you in the sacred month, for between us and you is this tribe of the disbelievers of Mudar. So give us a decisive command that we can tell those behind us and by which we enter Paradise.’ And they asked him about drinks.”"}, "l": {"ar": "حرص الوافدين على العلم الجامع النافع وتبليغه لقومهم؛ وحسن استقبال الداعية للناس.", "en": "The visitors sought comprehensive knowledge to convey to their people, and the Prophet welcomed them warmly."}, "s": {"ar": "صحيح البخاري، كتاب الإيمان، باب أداء الخمس من الإيمان، رقم (53)؛ صحيح مسلم، كتاب الإيمان، رقم (17).", "en": "Sahih al-Bukhari 53; Sahih Muslim 17."}, "r": {"ar": "مفهوم الأشهر الحرم وتعظيمها؛ مشروعية الترحيب بالوفود؛ طلب العلم لتبليغه.", "en": "The sacred months and honouring them; welcoming delegations; seeking knowledge in order to convey it."}, "cat": "text", "sec": "b"}, {"id": 39, "t": {"ar": "الأوامر الأربع", "en": "The four commands"}, "c": {"ar": "«فأمرهم بأربع، ونهاهم عن أربع، أمرهم بالإيمان بالله وحده، قال: أتدرون ما الإيمان بالله وحده؟ قالوا: الله ورسوله أعلم، قال: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وصيام رمضان، وأن تعطوا من المغنم الخمس».", "en": "“He commanded them four things and forbade them four. He commanded them to believe in God alone, and asked: ‘Do you know what belief in God alone is?’ They said: ‘God and His Messenger know best.’ He said: ‘Testifying that there is no god but God and that Muhammad is the Messenger of God, establishing prayer, paying zakat, fasting Ramadan, and giving a fifth of the spoils.’”"}, "l": {"ar": "الإيمان قول وعمل؛ والبدء بالتوحيد ثم الفرائض العملية منهج نبوي في التعليم.", "en": "Faith is word and deed; beginning with God's oneness and then the practical duties is the Prophet's way of teaching."}, "s": {"ar": "صحيح البخاري، كتاب الإيمان، رقم (53)؛ صحيح مسلم، كتاب الإيمان، رقم (17).", "en": "Sahih al-Bukhari 53; Sahih Muslim 17."}, "r": {"ar": "تعريف الإيمان وأن الأعمال داخلة في مسماه؛ أركان الإسلام؛ تعريف الشهادتين؛ تعريف الصلاة وأحكامها؛ تعريف الزكاة وأحكامها؛ أحكام الصيام؛ أحكام الخمس من الغنيمة.", "en": "Faith defined to include deeds; the pillars of Islam; the two testimonies; prayer, zakat and their rulings; fasting; giving a fifth of the spoils."}, "cat": "text", "sec": "b"}, {"id": 40, "t": {"ar": "النهي عن الأوعية", "en": "The four vessels"}, "c": {"ar": "«ونهاهم عن أربع: عن الحنتم والدباء والنقير والمزفت -وربما قال: المقيّر- وقال: احفظوهن وأخبروا بهن من وراءكم». (وهي أوعية يسرع فيها الإسكار إلى النبيذ). ثم نُسخ النهي بقوله ﷺ في حديث بريدة: «ونهيتكم عن النبيذ إلا في سقاء، فاشربوا في الأسقية كلها، ولا تشربوا مسكراً».", "en": "“He forbade them four: al-hantam, al-dubba’, al-naqir and al-muzaffat (perhaps he said al-muqayyar), and said: ‘Remember them and tell those behind you.’” (These are vessels in which a steeped drink quickly turns intoxicating.) The prohibition was later abrogated by his words in the hadith of Burayda: “I forbade you steeped drinks except in a skin; now drink from any vessel, but do not drink anything intoxicating.”"}, "l": {"ar": "الشريعة تسد الطرق الموصلة إلى الحرام، والتدرج في الأحكام من رحمة الله.", "en": "The Sharia closes the paths that lead to the forbidden, and gradual rulings are a mercy from God."}, "s": {"ar": "صحيح البخاري، كتاب الإيمان، باب أداء الخمس من الإيمان، رقم (53)؛ صحيح مسلم، كتاب الإيمان، رقم (17)؛ والنسخ في صحيح مسلم، حديث بريدة، رقم (977).", "en": "Sahih al-Bukhari, Book of Faith, 53; Sahih Muslim, Book of Faith, 17; abrogation: Sahih Muslim 977 (hadith of Burayda)."}, "r": {"ar": "أحكام الأطعمة والأشربة؛ تحريم المسكر؛ قاعدة سد الذرائع؛ الناسخ والمنسوخ.", "en": "Rulings on food and drink; the prohibition of intoxicants; the principle of closing the means to harm; abrogation."}, "cat": "item", "sec": "d"}, {"id": 41, "t": {"ar": "الحلم والأناة", "en": "Forbearance and deliberation"}, "c": {"ar": "عن ابن عباس قال: قال رسول الله صلى الله عليه وسلم للأشج، أشج عبد القيس (المنذر بن عائذ): «إن فيك خصلتين يحبهما الله: الحلم، والأناة».", "en": "Ibn ‘Abbas said: The Messenger of God ﷺ said to al-Ashajj, the Ashajj of ‘Abd al-Qays (al-Mundhir ibn ‘A’idh): “You have two qualities that God loves: forbearance and deliberation.”"}, "l": {"ar": "الحلم والأناة من الأخلاق المحبوبة لله؛ والتثبت وعدم العجلة من صفات العقلاء والقادة.", "en": "Forbearance and deliberation are loved by God; careful thought and avoiding haste are traits of the wise and of leaders."}, "s": {"ar": "صحيح مسلم، كتاب الإيمان، باب الأمر بالإيمان بالله ورسوله وشرائع الدين، رقم (17)؛ وانظر: الإصابة لابن حجر، ترجمة المنذر بن عائذ.", "en": "Sahih Muslim 17; see Ibn Hajar, al-Isaba (al-Mundhir ibn 'A'idh)."}, "r": {"ar": "إثبات صفة المحبة لله تعالى على ما يليق به؛ الأخلاق من ثمرات الإيمان والإحسان.", "en": "Affirming that God loves, in a way befitting Him; good character as a fruit of faith and excellence (ihsan)."}, "cat": "figure", "sec": "b"}, {"id": 42, "t": {"ar": "جبلّة أم تخلّق؟", "en": "Innate or acquired?"}, "c": {"ar": "عن زارع -وكان في وفد عبد القيس- قال: «لما قدمنا المدينة فجعلنا نتبادر من رواحلنا، فنقبل يد رسول الله صلى الله عليه وسلم ورجله، قال: وانتظر المنذر الأشج حتى أتى عيبته فلبس ثوبيه، ثم أتى النبي صلى الله عليه وسلم، فقال له: إن فيك خلتين يحبهما الله: الحلم، والأناة، قال: يا رسول الله أنا أتخلق بهما أم الله جبلني عليهما؟ قال: بل الله جبلك عليهما، قال: الحمد لله الذي جبلني على خلتين يحبهما الله ورسوله».", "en": "Zari‘, who was in the delegation of ‘Abd al-Qays, said: “When we reached Madinah we hurried down from our mounts and kissed the hand and foot of the Messenger of God ﷺ. But al-Mundhir al-Ashajj waited until he had gone to his bag and put on his two garments, then came to the Prophet ﷺ. He said to him: ‘You have two traits that God loves: forbearance and deliberation.’ He said: ‘Messenger of God, did I acquire them, or did God create me with them?’ He said: ‘God created you with them.’ He said: ‘Praise be to God, who created me with two traits that God and His Messenger love.’”"}, "l": {"ar": "الخلق الحسن قد يكون جِبلّة وقد يكون اكتساباً؛ والتاجر والقاضي والقائد أحوج الناس إلى الحلم والأناة.", "en": "Good character may be innate or acquired; traders, judges and leaders need forbearance and deliberation most of all."}, "s": {"ar": "سنن أبي داود، كتاب الأدب، باب في قبلة الرجل، رقم (5225).", "en": "Sunan Abi Dawud, Book of Manners, 5225."}, "r": {"ar": "الحلم (ضبط النفس عند الغضب) والأناة (التثبت وترك العجلة) أصلان في أخلاق المعاملة: في البيع والشراء، والقضاء، والإصلاح بين الناس، ومعاملة الأهل والجيران ← وصلتهما بالإحسان.", "en": "Forbearance (self-control in anger) and deliberation (care and avoiding haste) as foundations of conduct: in trade, judging, reconciling people, and treating family and neighbours → their link to ihsan."}, "cat": "concept", "sec": "d"}, {"id": 43, "t": {"ar": "خير أهل المشرق", "en": "The best of the people of the East"}, "c": {"ar": "أثنى النبي ﷺ على عبد القيس فقال: «خير أهل المشرق عبد القيس، أسلم الناس كَرهاً وأسلموا طائعين»، ودعا لهم: «اللهم اغفر لعبد القيس إذ أسلموا طائعين غير كارهين، غير خزايا ولا موتورين»، ورحّب بهم «غير خزايا ولا ندامى».", "en": "The Prophet ﷺ praised 'Abd al-Qays: \"The best of the people of the East are 'Abd al-Qays; people embraced Islam reluctantly while they embraced it willingly.\" He prayed: \"O God, forgive 'Abd al-Qays, for they embraced Islam willingly, not reluctantly, neither disgraced nor vengeful.\""}, "l": {"ar": "من أقبل على الحق راغباً نال الثناء والدعاء؛ والطاعة عن رغبة أرفع من الطاعة عن رهبة.", "en": "Whoever turns to the truth willingly earns praise and prayers; obedience out of love is higher than obedience out of fear."}, "s": {"ar": "صحيح ابن حبان رقم (7294)؛ مسند أحمد وحديث أبي القموص عن وفد عبد القيس؛ المعجم الأوسط للطبراني من حديث أبي هريرة، قال الهيثمي في مجمع الزوائد: رجاله ثقات؛ وصححه الألباني في السلسلة الصحيحة؛ والترحيب في صحيح البخاري رقم (53).", "en": "Sahih Ibn Hibban 7294; Musnad Ahmad; al-Tabarani, al-Mu'jam al-Awsat (al-Haythami: its narrators are trustworthy); authenticated by al-Albani; the welcome is in Bukhari 53."}, "r": {"ar": "فضائل القبائل والبلدان؛ فضل الإسلام طوعاً؛ الإخلاص في الإيمان؛ مشروعية الدعاء للمؤمنين.", "en": "The merits of tribes and lands; the virtue of embracing Islam willingly; sincerity in faith; praying for believers."}, "cat": "text", "sec": "b"}, {"id": 44, "t": {"ar": "نساء عبد القيس", "en": "The women of ‘Abd al-Qays"}, "c": {"ar": "ثناء النبي ﷺ على نساء عبد القيس: قال ﷺ: «إن خير أهل المشرق نساء عبد القيس». وقد نال نساء أهل عبد القيس هذا الشرف بسبب قوة إيمانهن وطاعتهن لله تعالى وصبرهن في الدين، فمما يُروى من فضائلهن أنه بعد وقعة الجمل جهز الإمام علي رضي الله عنه السيدة عائشة رضي الله عنها، وبعث معها أخاها عبد الرحمن بن أبي بكر وثلاثين رجلاً وعشرين امرأة من ذوات الدين والشرف من نساء عبد القيس وهمدان، وألبسهن العمائم وقلدهن السيوف، وقال: لا تُعلمن عائشة أنكن نسوة، فكنّ هن اللاتي يلين جملها وخدمتها.\nولما حدثت فتنة القرامطة في المنطقة الشرقية، أسروا نساء من عبد القيس وجعلوهن في أحواش النخيل، ثم أضرموا النار فيها فماتت كل النساء حرقاً، فما أشبههن بأصحاب الأخدود، وصبرهن في دين الله تعالى.", "en": "The Prophet’s ﷺ praise of the women of ‘Abd al-Qays: he said ﷺ: “The best of the people of the East are the women of ‘Abd al-Qays.” They earned this honour by the strength of their faith, their obedience to God and their steadfastness in religion. Among their reported merits: after the Battle of the Camel, Imam ‘Ali prepared ‘A’isha’s journey and sent with her her brother ‘Abd al-Rahman ibn Abi Bakr, thirty men and twenty women of religion and standing from ‘Abd al-Qays and Hamdan. He dressed them in turbans and girded them with swords, saying: “Do not let ‘A’isha know that you are women.” They attended her camel and served her.\nWhen the Qarmatian upheaval struck the Eastern Region, the Qarmatians captured women of ‘Abd al-Qays, put them in palm enclosures and set them on fire, and all the women died. How like the People of the Trench they were in their steadfastness in God’s religion."}, "l": {"ar": "صلاح المرأة وإيمانها شرف لها ولقومها؛ وثقة الإمام علي رضي الله عنه بنساء عبد القيس في صحبة أم المؤمنين؛ وثباتهن على الدين حتى الموت.", "en": "A woman’s righteousness and faith honour her and her people; Imam ‘Ali trusted the women of ‘Abd al-Qays to accompany the Mother of the Believers; and they held to their religion until death."}, "s": {"ar": "مسند الإمام أحمد (رقم 17864)؛ سمط النجوم العوالي في أنباء الأوائل والتوالي للعصامي؛ تاج العروس من جواهر القاموس للزبيدي؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Musnad Ahmad (17864); al-‘Isami, Simt al-Nujum al-‘Awali; al-Zabidi, Taj al-‘Arus; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "فضائل القبائل؛ مكانة المرأة المؤمنة وفضل صلاحها؛ محبة آل البيت وأمهات المؤمنين وإكرامهن؛ الصبر على الابتلاء والثبات على الدين (قصة أصحاب الأخدود في سورة البروج).", "en": "The merits of tribes; the standing of the believing woman and the virtue of her righteousness; love and honour for the Prophet’s household and the Mothers of the Believers; patience under trial and steadfastness in religion (the People of the Trench in Surat al-Buruj)."}, "cat": "text", "sec": "b"}, {"id": 45, "t": {"ar": "أسماء قرى هجر", "en": "The villages of Hajar"}, "c": {"ar": "في حديث وفد عبد القيس عند أحمد: «...فرحب به وألطفه، وسأله عن بلاده، وسمى له قرية قرية: الصفا والمشقر، وغير ذلك من قرى هجر، فقال: بأبي وأمي يا رسول الله، لأنت أعلم بأسماء قرانا منا، فقال: إني قد وطئت بلادكم، وفسح لي فيها»، ثم أقبل على الأنصار فقال: «يا معشر الأنصار، أكرموا إخوانكم، فإنهم أشباهكم في الإسلام، أشبه شيء بكم أشعاراً وأبشاراً، أسلموا طائعين غير مكرهين ولا موتورين».", "en": "In the hadith of the ‘Abd al-Qays delegation in Musnad Ahmad: “…He welcomed him warmly and asked him about his land, naming its villages one by one: al-Safa, al-Mushaqqar and other villages of Hajar. He said: ‘May my father and mother be your ransom, Messenger of God, you know the names of our villages better than we do.’ He said: ‘I have trodden your land and it was opened wide for me.’” Then he turned to the Ansar and said: “O Ansar, honour your brothers, for they are most like you in Islam, most like you in hair and skin; they embraced Islam willingly, not compelled or vengeful.”"}, "l": {"ar": "المشقّر والصفا من معالم هجر التي سمّاها النبي ﷺ بأسمائها؛ والأخوة في الدين تجمع الأنصار وعبد القيس.", "en": "Al-Mushaqqar and al-Safa are landmarks of Hajar that the Prophet ﷺ named; brotherhood in faith unites the Ansar and 'Abd al-Qays."}, "s": {"ar": "مسند أحمد، حديث شهاب بن عباد عن بعض وفد عبد القيس (رقم 15559 ط. الرسالة، ويختلف الرقم بين الطبعات)، وقد ضعّف الأرناؤوط إسناده وحسّنه غيره؛ وله شاهد في المستدرك للحاكم من حديث أنس في معرفته ﷺ بألوان تمرهم.", "en": "Musnad Ahmad, hadith of Shihab ibn 'Abbad (al-Arna'ut graded its chain weak, others graded it good); supported by a report in al-Hakim's Mustadrak."}, "r": {"ar": "علامات النبوة (إطلاع الله نبيه على بلادهم)؛ الأخوة الإيمانية وإكرام الضيف والوافد.", "en": "Signs of prophethood (God showing His Prophet their land); brotherhood in faith and honouring guests and visitors."}, "cat": "text", "sec": "b"}, {"id": 46, "t": {"ar": "معبد بن وهب الأضبط", "en": "Ma‘bad ibn Wahb, the two-handed"}, "c": {"ar": "عن مزيدة العصري رضي الله عنه -وكان من الوفد الذين وفدوا إلى رسول الله ﷺ- أنه قال: كان رجل كثير الحج في الجاهلية يقال له: معبد بن وهب العبدي، وإنه تزوج امرأة من قريش يقال لها: هريرة بنت زمعة، وكانت أخت سودة بنت زمعة أم المؤمنين، وإنه قاتل يوم بدر بسيفين، فقال رسول الله ﷺ: «من هذا الأضبط؟» قالوا: معبد بن وهب العبدي. فقال رسول الله ﷺ: «يا لهف نفسي على فتيان عبد القيس ألا يحضرونا في هذا اليوم، أما إنهم أُسد الله في الأرض».\nوقوله ﷺ «الأضبط»: الذي يعمل بيديه جميعاً، يعمل بيساره كما يعمل بيمينه.", "en": "Mazida al-‘Asri, who was among the delegation to the Messenger of God ﷺ, said: There was a man who often made pilgrimage in the Jahiliyya called Ma‘bad ibn Wahb al-‘Abdi. He married a woman of Quraysh, Hurayra bint Zam‘a, the sister of Sawda bint Zam‘a, Mother of the Believers. He fought at Badr with two swords, and the Messenger of God ﷺ asked: “Who is this ambidextrous one (al-adbat)?” They said: “Ma‘bad ibn Wahb al-‘Abdi.” The Messenger of God ﷺ said: “How I wish the young men of ‘Abd al-Qays had been with us on this day! They are the lions of God on earth.”\nAl-adbat is one who works with both hands, using his left as he uses his right."}, "l": {"ar": "شجاعة فتيان عبد القيس ونصرتهم للنبي ﷺ؛ والثناء على أهل البلاء الحسن في سبيل الله.", "en": "The courage of the young men of ‘Abd al-Qays and their support for the Prophet ﷺ; praise for those who strive well for God’s sake."}, "s": {"ar": "المنتقى من كتاب الطبقات لأبي عروبة الحراني؛ معرفة الصحابة لأبي نعيم (رقم 6226)؛ معجم أبي يعلى الموصلي (رقم 327)؛ وفي معنى الأضبط: خزانة الأدب ولب لباب لسان العرب للبغدادي؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Abu ‘Aruba al-Harrani, al-Muntaqa min Kitab al-Tabaqat; Abu Nu‘aym, Ma‘rifat al-Sahaba (6226); Mu‘jam Abi Ya‘la (327); on the meaning of al-adbat: al-Baghdadi, Khizanat al-Adab; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "فضل أهل بدر ومحبة الصحابة من عقيدة أهل السنة؛ فضل الشجاعة في نصرة الدين.", "en": "The virtue of the people of Badr and love for the Companions in Sunni belief; the virtue of courage in supporting the religion."}, "cat": "figure", "sec": "b"}, {"id": 47, "t": {"ar": "الأشهر الحرم", "en": "The sacred months"}, "c": {"ar": "قال النبي ﷺ: «السنة اثنا عشر شهراً، منها أربعة حرم: ثلاث متواليات: ذو القعدة وذو الحجة والمحرم، ورجب مضر الذي بين جمادى وشعبان». وكانت العرب تكف فيها عن القتال؛ ولذلك قال وفد عبد القيس: «إنا لا نستطيع أن نأتيك إلا في الشهر الحرام، وبيننا وبينك هذا الحي من كفار مضر».", "en": "The Prophet ﷺ said: “The year is twelve months, four of them sacred: three in succession, Dhu al-Qa‘da, Dhu al-Hijja and Muharram, and the Rajab of Mudar, which comes between Jumada and Sha‘ban.” The Arabs refrained from fighting in them, which is why the delegation of ‘Abd al-Qays said: “We can only come to you in the sacred month, for between us and you is this tribe of the disbelievers of Mudar.”"}, "l": {"ar": "حرص عبد القيس على لقاء النبي ﷺ رغم مخاطر الطريق، واغتنامهم أمن الأشهر الحرم لطلب العلم.", "en": "'Abd al-Qays were eager to meet the Prophet ﷺ despite the dangers of the road, using the safety of the sacred months to seek knowledge."}, "s": {"ar": "صحيح البخاري، كتاب بدء الخلق، رقم (3197) في تعداد الأشهر الحرم؛ وحديث الوفد في صحيح البخاري رقم (53) ومسلم رقم (17).", "en": "Sahih al-Bukhari 3197; the delegation hadith: Bukhari 53, Muslim 17."}, "r": {"ar": "تعظيم شعائر الله وحرماته؛ ﴿مِنْهَا أَرْبَعَةٌ حُرُمٌ﴾ (التوبة: 36)؛ أحكام القتال في الأشهر الحرم.", "en": "Honouring God's rites and sanctities; \"four of them are sacred\" (al-Tawba 9:36); rulings on fighting in the sacred months."}, "cat": "concept", "sec": "b"}, {"id": 48, "t": {"ar": "ثاني جمعة في الإسلام", "en": "The second Friday prayer in Islam"}, "c": {"ar": "عن ابن عباس قال: «إن أول جمعة جمّعت بعد جمعة في مسجد رسول الله صلى الله عليه وسلم في مسجد عبد القيس بجواثى من البحرين».", "en": "Ibn ‘Abbas said: “The first Friday prayer held after the one in the Mosque of the Messenger of God ﷺ was in the mosque of ‘Abd al-Qays at Jawatha in historical Bahrain (the region centred on al-Ahsa).”"}, "l": {"ar": "سبق أهل البحرين إلى إقامة شعائر الإسلام؛ وأن مسجد جواثى معلم تاريخي يدل على رسوخ الإسلام في هجر مبكراً.", "en": "The people of Bahrain were early to establish the rites of Islam; the Jawatha mosque is a landmark of Islam's early roots in Hajar."}, "s": {"ar": "صحيح البخاري، كتاب الجمعة، باب الجمعة في القرى والمدن، رقم (892).", "en": "Sahih al-Bukhari 892."}, "r": {"ar": "تعريف صلاة الجمعة وأحكامها؛ إقامة الجمعة في القرى؛ فضل المساجد وعمارتها.", "en": "The Friday prayer and its rulings; holding it in villages; the virtue of building and maintaining mosques."}, "cat": "landmark", "sec": "w"}, {"id": 49, "t": {"ar": "جواثى", "en": "Jawatha"}, "c": {"ar": "جُواثى: حصن أو قرية لعبد القيس بالبحرين (في منطقة الأحساء حالياً)، وبها كان المسجد الذي أقيمت فيه ثاني جمعة في الإسلام.", "en": "Jawatha was a fort or village of 'Abd al-Qays in historical Bahrain (in today's al-Ahsa), home to the mosque where the second Friday prayer in Islam was held."}, "l": {"ar": "ارتباط المكان بالعبادة يخلّد أثر أهله، والمساجد مراكز إشعاع الإسلام.", "en": "A place tied to worship keeps its people's legacy alive; mosques are centres from which Islam shines."}, "s": {"ar": "معجم البلدان لياقوت الحموي، مادة (جُواثى)؛ فتح الباري لابن حجر، شرح الحديث رقم (892).", "en": "Mu'jam al-Buldan, entry 'Jawatha'; Fath al-Bari on hadith 892."}, "r": {"ar": "أحكام صلاة الجمعة وشروط إقامتها (الاستيطان والعدد).", "en": "Rulings of the Friday prayer and the conditions for holding it (settled residence and number)."}, "cat": "place", "sec": "w"}, {"id": 50, "t": {"ar": "حصن جواثى", "en": "The fort of Jawatha"}, "c": {"ar": "حصن جُواثى: حصن عبد القيس بالبحرين، فيه مسجدهم الذي أقيمت فيه ثاني جمعة في الإسلام، وتحصّن فيه المسلمون من عبد القيس حين حاصرهم المرتدون.", "en": "The fort of Jawatha was the stronghold of 'Abd al-Qays in historical Bahrain, with the mosque where the second Friday prayer was held. The Muslims of 'Abd al-Qays took refuge in it when the apostates besieged them."}, "l": {"ar": "الحصن حمى الأبدان، والإيمان حمى القلوب.", "en": "The fort protected bodies; faith protected hearts."}, "s": {"ar": "معجم البلدان لياقوت، مادة (جُواثى)؛ صحيح البخاري (892)؛ تاريخ الطبري، حوادث سنة 11هـ.", "en": "Mu'jam al-Buldan; Sahih al-Bukhari 892; al-Tabari, events of 11 AH."}, "r": {"ar": "أحكام الجمعة؛ الثبات عند الفتن؛ فضل المساجد.", "en": "Rulings of Friday; steadfastness in trials; the virtue of mosques."}, "cat": "landmark", "sec": "w"}, {"id": 51, "t": {"ar": "طلق بن علي مؤذن جواثى", "en": "Talq ibn ‘Ali, muezzin of Jawatha"}, "c": {"ar": "طلق بن علي الحنفي اليمامي رضي الله عنه: من فضائل عبد القيس في مسجد جواثى أن مؤذنهم هو طلق بن علي، أحد أمهر البنائين الذين شاركوا في بناء مسجد النبي ﷺ البناء الأول في السنة الأولى للهجرة. قال: «جئت إلى النبي صلى الله عليه وسلم وأصحابه يبنون المسجد، قال: فكأنه لم يعجبه عملهم، قال: فأخذت المسحاة فخلطت بها الطين، فكأنه أعجبه أخذي المسحاة وعملي، فقال: دعوا الحنفي والطين، فإنه أضبطكم للطين». وفي لفظ آخر: «بنيت المسجد مع رسول الله صلى الله عليه وسلم فكان يقول: قرّبوا اليمامي إلى الطين، فإنه أحسنكم له مساً وأشدكم منكباً».", "en": "Talq ibn ‘Ali al-Hanafi al-Yamami: among the honours of ‘Abd al-Qays at the Jawatha mosque is that their muezzin was Talq ibn ‘Ali, one of the most skilled builders who took part in building the Prophet’s ﷺ mosque in its first construction, in the first year of the Hijra. He said: “I came to the Prophet ﷺ while his Companions were building the mosque, and it seemed their work did not please him. I took the spade and mixed the clay, and it seemed my handling of the spade and my work pleased him. He said: ‘Leave the Hanafi to the clay, for he is the most skilled of you with clay.’” In another wording: “I built the mosque with the Messenger of God ﷺ, and he would say: ‘Bring the Yamami close to the clay, for he has the best touch for it and the strongest shoulders.’”"}, "l": {"ar": "إسناد العمل إلى أهل الخبرة، وثناء النبي ﷺ على المتقن؛ وشرف مسجد جواثى بمؤذنه الصحابي.", "en": "Work is given to the skilled, and the Prophet ﷺ praised excellence; the Jawatha mosque was honoured by a Companion as its muezzin."}, "s": {"ar": "الإصابة في تمييز الصحابة لابن حجر؛ مسند الإمام أحمد (رقم 15706)؛ مجمع الزوائد ومنبع الفوائد للهيثمي؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Ibn Hajar, al-Isaba; Musnad Ahmad (15706); al-Haythami, Majma‘ al-Zawa’id; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "فضل الأذان والمؤذنين؛ فضل بناء المساجد؛ إتقان العمل: «إن الله يحب إذا عمل أحدكم عملاً أن يتقنه».", "en": "The virtue of the call to prayer and of muezzins; the virtue of building mosques; doing work with excellence: “God loves that when one of you does a job, he does it well.”"}, "cat": "figure", "sec": "w"}, {"id": 52, "t": {"ar": "عمرو بن تغلب الجواثي", "en": "‘Amr ibn Taghlib of Jawatha"}, "c": {"ar": "عمرو بن تغلب النمري، الجُواثي أو العبدي: من الصحابة الذين نُسبوا إلى جواثى، سكن البصرة، وأثنى النبي ﷺ عليه في إسلامه. قال: «أتى النبي صلى الله عليه وسلم مال، فأعطى قوماً ومنع آخرين، فبلغه أنهم عتبوا، فقال: إني أعطي الرجل وأدع الرجل، والذي أدع أحب إلي من الذي أعطي، أعطي أقواماً لما في قلوبهم من الجزع والهلع، وأكل أقواماً إلى ما جعل الله في قلوبهم من الغنى والخير، منهم عمرو بن تغلب». فقال عمرو: ما أحب أن لي بكلمة رسول الله صلى الله عليه وسلم حمر النعم.", "en": "‘Amr ibn Taghlib al-Namari, called al-Juwathi or al-‘Abdi, was one of the Companions linked to Jawatha. He lived in Basra, and the Prophet ﷺ praised his faith. He said: “Wealth came to the Prophet ﷺ; he gave to some people and not to others. He heard that they were displeased, and said: ‘I give to one man and leave another, and the one I leave is dearer to me than the one I give. I give to some people because of the anxiety and fretfulness in their hearts, and I entrust others to the contentment and goodness God has placed in their hearts, among them ‘Amr ibn Taghlib.’” ‘Amr said: “I would not exchange that word of the Messenger of God ﷺ for red camels.”"}, "l": {"ar": "شهادة النبي ﷺ لعمرو بالغنى والخير في قلبه أعظم من حمر النعم.", "en": "The Prophet’s ﷺ testimony to the contentment and goodness in ‘Amr’s heart was worth more to him than red camels."}, "s": {"ar": "صحيح البخاري، كتاب التوحيد، رقم (7535)؛ معرفة الصحابة لأبي نعيم؛ الإصابة في تمييز الصحابة لابن حجر؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Sahih al-Bukhari, Book of Tawhid (7535); Abu Nu‘aym, Ma‘rifat al-Sahaba; Ibn Hajar, al-Isaba; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "الإيمان يزيد وينقص؛ الغنى غنى النفس؛ حكمة النبي ﷺ في قسمة المال وتأليف القلوب.", "en": "Faith increases and decreases; true wealth is contentment of the soul; the Prophet’s ﷺ wisdom in distributing wealth and winning hearts."}, "cat": "figure", "sec": "b"}, {"id": 53, "t": {"ar": "الوفادة الثانية", "en": "The second delegation"}, "c": {"ar": "الوفادة الثانية لعبد القيس: كانت عام الوفود سنة 9هـ، وكانوا نحو أربعين رجلاً، وفيهم الجارود بن المعلّى.", "en": "The second delegation of 'Abd al-Qays came in the Year of Delegations, 9 AH. They were about forty men, including al-Jarud ibn al-Mu'alla."}, "l": {"ar": "تكرار الوفادة يدل على رسوخ الإسلام في القبيلة واتساعه فيها.", "en": "Repeated visits show Islam taking root and spreading within the tribe."}, "s": {"ar": "فتح الباري لابن حجر، شرح الحديث رقم (53)؛ الطبقات الكبرى لابن سعد، وفد عبد القيس.", "en": "Fath al-Bari on hadith 53; Ibn Sa'd, al-Tabaqat al-Kubra."}, "r": {"ar": "استمرار التعلّم والتثبيت بعد الإسلام؛ أحكام الوفود واستقبالها.", "en": "Continued learning and strengthening after Islam; rulings on receiving delegations."}, "cat": "text", "sec": "b"}, {"id": 54, "t": {"ar": "الجارود بن المعلّى", "en": "Al-Jarud ibn al-Mu'alla"}, "c": {"ar": "الجارود بن المعلّى العبدي (بِشر بن عمرو)، سيد عبد القيس، وفد في الوفادة الثانية وكان نصرانياً، فقال: إني كنت على دين وإني تارك ديني لدينك، أفتضمن لي ديني؟ فقال ﷺ: «نعم، أنا ضامن أن قد هداك الله إلى ما هو خير منه»، فأسلم وأسلم أصحابه. وهو الذي ثبّت قومه عند الردة، واستشهد في فتوح فارس نحو سنة 21هـ.", "en": "Al-Jarud ibn al-Mu'alla al-'Abdi, chief of 'Abd al-Qays, came with the second delegation as a Christian. He said: \"I was on a religion and I am leaving it for yours; will you guarantee my religion for me?\" The Prophet ﷺ said: \"Yes, I guarantee that God has guided you to what is better than it.\" He and his companions embraced Islam. He kept his people steadfast during the apostasy and was martyred in the conquest of Persia around 21 AH."}, "l": {"ar": "طالب الحق إذا تبيّن له قبله؛ والقائد المؤمن يكون سبباً في هداية قومه وثباتهم.", "en": "The seeker of truth accepts it once it is clear; a believing leader can guide his people and keep them steadfast."}, "s": {"ar": "السيرة النبوية لابن هشام، وفد بني عبد القيس؛ الإصابة لابن حجر والاستيعاب لابن عبد البر، ترجمة الجارود.", "en": "Ibn Hisham, al-Sira, the delegation of 'Abd al-Qays; al-Isaba and al-Isti'ab (al-Jarud)."}, "r": {"ar": "تعريف الإسلام وأنه ناسخ لما قبله من الأديان؛ دعوة أهل الكتاب؛ الثبات على الدين.", "en": "Islam as abrogating earlier religions; inviting the People of the Book; holding firm to the religion."}, "cat": "figure", "sec": "b"}, {"id": 55, "t": {"ar": "البشارة في الإنجيل", "en": "The glad tidings in the Gospel"}, "c": {"ar": "لما وفد الجارود قال للنبي ﷺ -فيما يُروى-: والذي بعثك بالحق لقد وجدتُ وصفك في الإنجيل، ولقد بشّر بك ابن البتول (عيسى عليه السلام)، وأنشد بين يديه شعراً في ذلك، وذكر في الخبر قُسّ بن ساعدة.", "en": "It is reported that al-Jarud told the Prophet ﷺ: \"By the One who sent you with the truth, I found your description in the Gospel, and the son of the Virgin (Jesus, peace be upon him) foretold you,\" and recited poetry about it; the report also mentions Quss ibn Sa'ida."}, "l": {"ar": "أصل البشارة ثابت بالقرآن وإن ضعف هذا الخبر بعينه؛ وأهل الكتاب المنصفون عرفوا النبي ﷺ فآمنوا به.", "en": "The glad tidings are established by the Qur'an even though this particular report is weak; fair-minded People of the Book recognised the Prophet ﷺ and believed in him."}, "s": {"ar": "دلائل النبوة لأبي نعيم الأصبهاني؛ البداية والنهاية لابن كثير (ذكر قس بن ساعدة ووفد عبد القيس)؛ وقد نبّه ابن كثير وغيره على ضعف أسانيد هذا الخبر، وأورد ابن الجوزي خبر قسّ الطويل في الموضوعات.", "en": "Abu Nu'aym, Dala'il al-Nubuwwa; Ibn Kathir, al-Bidaya wa al-Nihaya. Ibn Kathir and others noted that its chains are weak, and Ibn al-Jawzi listed the long Quss report among fabrications."}, "r": {"ar": "البشارة بالنبي ﷺ في الكتب السابقة ثابتة بالقرآن: ﴿وَمُبَشِّرًا بِرَسُولٍ يَأْتِي مِن بَعْدِي اسْمُهُ أَحْمَدُ﴾ (الصف: 6)، و﴿يَجِدُونَهُ مَكْتُوبًا عِندَهُمْ فِي التَّوْرَاةِ وَالْإِنجِيلِ﴾ (الأعراف: 157) ← الإيمان بالرسل والكتب من أركان الإيمان.", "en": "The glad tidings of the Prophet ﷺ in earlier scriptures are established by the Qur'an: \"…bringing good news of a messenger after me whose name is Ahmad\" (al-Saff 61:6) and \"…whom they find written in the Torah and the Gospel\" (al-A'raf 7:157) → belief in the messengers and scriptures is a pillar of faith."}, "cat": "text", "sec": "b"}, {"id": 56, "t": {"ar": "ضالة المسلم", "en": "The stray of a Muslim"}, "c": {"ar": "سأل الجارود النبي ﷺ عن الإبل الضالة يجدونها في طريقهم، فقال: «ضالّة المسلم حَرَق النار».", "en": "Al-Jarud asked the Prophet ﷺ about stray camels they found on their road. He said: \"The stray of a Muslim is a flame of fire.\""}, "l": {"ar": "حرمة مال المسلم وأن أخذه بغير حق سبب للعذاب؛ وحرص الصحابة على السؤال عن الحلال والحرام.", "en": "A Muslim's property is inviolable, and taking it wrongfully leads to punishment; the Companions were keen to ask about the lawful and the unlawful."}, "s": {"ar": "السيرة النبوية لابن هشام، وفد بني عبد القيس؛ مسند الإمام أحمد من حديث الجارود.", "en": "Ibn Hisham, al-Sira; Musnad Ahmad (hadith of al-Jarud)."}, "r": {"ar": "أحكام اللُّقطة وضالة الإبل (ويشهد له حديث زيد بن خالد: «ما لك ولها...» صحيح البخاري رقم 91)؛ حرمة أموال المسلمين.", "en": "Rulings on found property and stray camels (supported by the hadith of Zayd ibn Khalid, Bukhari 91); the sanctity of Muslims' property."}, "cat": "text", "sec": "d"}, {"id": 57, "t": {"ar": "البلاغة الإيجاز", "en": "Eloquence is concision"}, "c": {"ar": "سأل معاوية صُحارَ بن عيّاش العبدي عن البلاغة فقال: الإيجاز، قيل: وما الإيجاز؟ قال: أن تجيب فلا تُبطئ، وتقول فلا تُخطئ.", "en": "Mu'awiya asked Suhar ibn 'Ayyash al-'Abdi about eloquence. He said: \"Concision.\" He was asked what concision was, and said: \"That you answer without delay and speak without error.\""}, "l": {"ar": "فصاحة عبد القيس؛ وأن البلاغة في الإصابة مع الإيجاز لا في كثرة الكلام.", "en": "'Abd al-Qays were eloquent; eloquence lies in accuracy with brevity, not in many words."}, "s": {"ar": "البيان والتبيين للجاحظ.", "en": "al-Jahiz, al-Bayan wa al-Tabyin."}, "r": {"ar": "آداب الكلام والتواصل؛ حفظ اللسان؛ «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت» (البخاري 6018).", "en": "Etiquette of speech and communication; guarding the tongue: \"Whoever believes in God and the Last Day, let him speak good or remain silent\" (Bukhari 6018)."}, "cat": "concept", "sec": "d"}, {"id": 58, "t": {"ar": "قلال هجر", "en": "The jars of Hajar"}, "c": {"ar": "في حديث المعراج: «ثم رفعت لي سدرة المنتهى، فإذا نبقها مثل قلال هجر، وإذا ورقها مثل آذان الفيلة».", "en": "In the hadith of the Ascension: “Then the Lote Tree of the Utmost Boundary was raised for me; its fruits were like the jars of Hajar, and its leaves like the ears of elephants.”"}, "l": {"ar": "شهرة صناعة هجر وجرارها في زمن النبوة، وضرب المثل بالمعروف المشاهد لتقريب الغيب؛ وفي تقدير الماء بقلال هجر دلالة على الصلة الاجتماعية والتجارية بين المدينة وهجر.", "en": "Hajar’s craft and jars were famous in the Prophet’s time; a familiar sight is used to bring the unseen closer; and measuring water by the jars of Hajar shows the social and trade ties between Madinah and Hajar."}, "s": {"ar": "صحيح البخاري، كتاب مناقب الأنصار، باب المعراج، رقم (3887)؛ وفي رقم (3207): «فإذا نبقها كأنه قلال هجر».", "en": "Sahih al-Bukhari, Book of the Virtues of the Ansar, chapter on the Ascension, 3887; and in 3207: “its fruits were like the jars of Hajar.”"}, "r": {"ar": "الإيمان بالغيب والإسراء والمعراج (من أركان الإيمان)؛ وفي الطهارة: روى الشافعي أن رسول الله ﷺ قال: «إذا كان الماء قلتين لم يحمل نجساً»، وفي هذا الحديث: «بقلال هجر» (مسند الشافعي رقم 5؛ وانظر مسند أحمد رقم 4803؛ المستدرك على الصحيحين رقم 458) ← أحكام المياه: الماء الكثير لا ينجس بمجرد ملاقاة النجاسة حتى يتغير طعمه أو ريحه أو لونه.", "en": "Belief in the unseen and in the Night Journey and Ascension; in purification, al-Shafi‘i narrated that the Messenger of God ﷺ said: “If water reaches two qullas, it does not carry impurity,” and in this hadith: “by the jars of Hajar” (Musnad al-Shafi‘i 5; see Musnad Ahmad 4803; al-Mustadrak 458) → rulings on water: a large amount of water is not made impure merely by contact with impurity unless its taste, smell or colour changes."}, "cat": "item", "sec": "b"}, {"id": 59, "t": {"ar": "جبل القارة وقلال هجر", "en": "Al-Qara mountain and the jars of Hajar"}, "c": {"ar": "جبل القارة: اسمه القديم الشبعان، ثم أطلق عليه حديثاً جبل القارة نسبة إلى جارته قرية القارة، وهذه القرية اشتهرت بصناعة القلال (الجرار)، فلعل قلال هجر التي ضُرب بها المثل لكبرها وعظمها وتميزها في جمال الصنعة والحجم كان مكان صنعها في قرية القارة. ومقدار القلتين حجماً بحسب التقدير القديم: ذراع وربع طولاً وعرضاً وعمقاً، أي بذراع الآدمي وهو شبران (نحو 60 سم)، ومقدار القلتين نحو 200 لتر.", "en": "Al-Qara mountain was anciently called al-Shab‘an; it was later named after the neighbouring village of al-Qara, which was famous for making jars. Perhaps the jars of Hajar, proverbial for their size and the beauty of their craft, were made in al-Qara. By the old estimate, two qullas measure a cubit and a quarter in length, width and depth, by a man’s cubit of two spans (about 60 cm): about 200 litres for the two."}, "l": {"ar": "صناعة أهل هجر بلغت من الإتقان أن ضرب بها المثل في الحديث النبوي، وصارت معياراً في أحكام الطهارة.", "en": "The craft of Hajar’s people was so fine that it became a proverb in the hadith and a standard in the rulings of purification."}, "s": {"ar": "الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ (وفيه صورة لجرار هجر عند مدخل جبل القارة)؛ نهاية المحتاج إلى شرح المنهاج للرملي في مقدار القلتين؛ والحديث في صحيح البخاري (3887). (نسبة صناعة قلال هجر إلى القارة ذكرها المؤلفان على سبيل الترجيح: «فلعل»).", "en": "al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh (with a photo of Hajar jars at the entrance to al-Qara mountain); al-Ramli, Nihayat al-Muhtaj, on the measure of two qullas; the hadith in Sahih al-Bukhari (3887). (The authors attribute the jars to al-Qara tentatively: “perhaps”.)"}, "r": {"ar": "أحكام المياه: حد الماء الكثير بالقلتين من قلال هجر؛ الإيمان بالإسراء والمعراج (قلال هجر في وصف سدرة المنتهى).", "en": "Rulings on water: two qullas of Hajar as the limit of a large amount of water; belief in the Night Journey and Ascension (the jars of Hajar in describing the Lote Tree)."}, "cat": "place", "sec": "w"}, {"id": 60, "t": {"ar": "بين مكة وهجر", "en": "Between Makkah and Hajar"}, "c": {"ar": "عن أبي هريرة قال: وضعت بين يدي رسول الله صلى الله عليه وسلم قصعة من ثريد ولحم، فتناول الذراع، وكانت أحب الشاة إليه، فنهس نهسة فقال: «أنا سيد الناس يوم القيامة»... وفيه: «والذي نفس محمد بيده، إن ما بين المصراعين من مصاريع الجنة إلى عضادتي الباب لكما بين مكة وهجر، أو هجر ومكة». وفي رواية: «لكما بين مكة وهجر، أو كما بين مكة وبصرى». والمسافة بين مكة وهجر (الأحساء) نحو 1300 كم.", "en": "Abu Hurayra said: A bowl of tharid and meat was placed before the Messenger of God ﷺ. He took the foreleg, the part of the sheep he loved most, bit from it and said: “I am the master of mankind on the Day of Resurrection…” and in it: “By the One in whose hand is Muhammad’s soul, the distance between the two leaves of one of the doors of Paradise, to its doorposts, is like that between Makkah and Hajar, or Hajar and Makkah.” In another narration: “like that between Makkah and Hajar, or between Makkah and Busra.” The distance between Makkah and Hajar (al-Ahsa) is about 1,300 km."}, "l": {"ar": "ضرب النبي ﷺ المثل بما يعرفه الصحابة بين أقصى الشرق (هجر) وأقصى الغرب (مكة)، للدلالة على أن باب الجنة أوسع من ذلك بكثير.", "en": "The Prophet ﷺ gave an example the Companions knew, from the far east (Hajar) to the far west (Makkah), to show that the door of Paradise is far wider still."}, "s": {"ar": "صحيح مسلم، كتاب الإيمان، باب أدنى أهل الجنة منزلة، رقم (194) [ورقمه في ترقيم آخر (502)]؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Sahih Muslim, Book of Faith, chapter on the lowest rank in Paradise, 194 (502 in another numbering); al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "الإيمان باليوم الآخر وصفة الجنة (من أركان الإيمان)؛ الشفاعة العظمى.", "en": "Belief in the Last Day and the description of Paradise; the great intercession."}, "cat": "text", "sec": "b"}, {"id": 61, "t": {"ar": "وفاة المنذر بن ساوى", "en": "The death of al-Mundhir ibn Sawa"}, "c": {"ar": "بقي المنذر بن ساوى والياً على البحرين يدير أمور الحكم، والعلاء بن الحضرمي على الزكاة والخراج، إلى أن ألمّ المرض بالمنذر في الشهر الذي ألمّ فيه المرض برسول الله ﷺ، فتوفي بعد رسول الله ﷺ بأيام قليلة، قبل ردة العرب في البحرين.", "en": "Al-Mundhir ibn Sawa remained governor of historical Bahrain (the region centred on al-Ahsa), running its affairs, with al-‘Ala’ ibn al-Hadrami over zakat and land tax, until al-Mundhir fell ill in the same month the Messenger of God ﷺ fell ill. He died a few days after the Messenger of God ﷺ, before the apostasy of the Arabs of Bahrain."}, "l": {"ar": "المنذر من أكثر عمال النبي ﷺ مراسلة معه، وكانت له اليد الكبرى في توطيد أحكام الشرع في المنطقة.", "en": "Al-Mundhir was among the Prophet’s ﷺ officials who corresponded with him most, and he did much to establish the rulings of the Sharia in the region."}, "s": {"ar": "تاريخ الطبري؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "al-Tabari, Tarikh; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "أحكام الولاية؛ الثبات على الإسلام حتى الممات.", "en": "Rulings on governorship; holding to Islam until death."}, "cat": "figure", "sec": "d"}, {"id": 62, "t": {"ar": "الثبات بعد الردة", "en": "Steadfast after the apostasy"}, "c": {"ar": "لما توفي رسول الله ﷺ، وتوفي المنذر بن ساوى بعده بقليل، ارتد بعض أهل البحرين، وثبتت عبد القيس على الإسلام بعد أن خطبهم الجارود وأعلن شهادة الحق.", "en": "When the Messenger of God ﷺ died, and al-Mundhir ibn Sawa died shortly after, some people of historical Bahrain apostatised. 'Abd al-Qays held firm to Islam after al-Jarud addressed them and declared the testimony of truth."}, "l": {"ar": "أثر القائد الصادق في تثبيت قومه وقت الفتن؛ والثبات على الدين عند الشدائد.", "en": "A sincere leader steadies his people in times of trial; holding to faith in hardship."}, "s": {"ar": "تاريخ الطبري (تاريخ الرسل والملوك)، حوادث سنة 11هـ، ذكر ردة أهل البحرين؛ البداية والنهاية لابن كثير.", "en": "al-Tabari, Tarikh al-Rusul wa al-Muluk, events of 11 AH; Ibn Kathir, al-Bidaya wa al-Nihaya."}, "r": {"ar": "تعريف الردة وحكمها؛ الشهادتان وأثرهما في الثبات؛ تعريف الإيمان وزيادته ونقصه.", "en": "The definition and ruling of apostasy; the two testimonies and their role in steadfastness; faith increasing and decreasing."}, "cat": "text", "sec": "b"}, {"id": 63, "t": {"ar": "قصيدة الحصار", "en": "The poem of the siege"}, "c": {"ar": "لما حاصر المرتدون مع الحُطم بن ضُبيعة المسلمين من عبد القيس في حصن جواثى حتى اشتد عليهم الجوع، قال عبد الله بن حذف الكلابي -وكان من المحصورين- يستنجد بأبي بكر الصديق:\nألا أبلغْ أبا بكرٍ رسولاً ... وفتيانَ المدينةِ أجمعينا\nفهل لكمُ إلى قومٍ كرامٍ ... قعودٍ في جُواثى مُحاصَرينا\nكأنّ دماءَهم في كلِّ فجٍّ ... شعاعُ الشمسِ يغشى الناظرينا\nتوكّلنا على الرحمنِ إنّا ... وجدنا الصبرَ للمتوكّلينا", "en": "When the apostates under al-Hutam ibn Dubay‘a besieged the Muslims of ‘Abd al-Qays in the fort of Jawatha until hunger grew severe, ‘Abdullah ibn Hadhf al-Kilabi, one of the besieged, appealed to Abu Bakr al-Siddiq in verse:\n“Carry a message to Abu Bakr, and to all the young men of Madinah:\nWill you come to a noble people, sitting besieged in Jawatha?\nAs if their blood in every pass were sunbeams dazzling the eye.\nWe have put our trust in the Most Merciful; we found patience belongs to those who trust.”"}, "l": {"ar": "الصبر والتوكل سبيل النصر؛ وثبات عبد القيس في الحصار مع الجوع دليل صدق إيمانهم؛ والشعر كان وسيلة لنقل الأخبار وطلب النجدة.", "en": "Patience and trust lead to victory; the steadfastness of 'Abd al-Qays under siege and hunger shows their sincere faith; poetry carried news and calls for help."}, "s": {"ar": "تاريخ الطبري، حوادث سنة 11هـ، ذكر ردة أهل البحرين؛ معجم البلدان لياقوت الحموي، مادة (جُواثى)؛ البداية والنهاية لابن كثير.", "en": "al-Tabari, events of 11 AH, the apostasy of Bahrain; Yaqut, Mu‘jam al-Buldan, entry ‘Jawatha’; Ibn Kathir, al-Bidaya wa al-Nihaya. Some wording varies slightly between sources."}, "r": {"ar": "التوكل على الله والصبر من أعمال القلوب ومقامات الإيمان والإحسان؛ الثبات على الدين عند الفتن؛ نصرة المسلمين بعضهم لبعض (الولاء بين المؤمنين).", "en": "Trust in God and patience as acts of the heart and stations of faith; steadfastness in trials; Muslims supporting one another."}, "cat": "text", "sec": "b"}, {"id": 64, "t": {"ar": "بعث العلاء", "en": "Al-'Ala' sent to Bahrain"}, "c": {"ar": "بعث أبو بكر الصديق العلاء بن الحضرمي لقتال المرتدين بالبحرين، وكانوا قد اجتمعوا على الحُطم بن ضُبيعة وحاصروا المسلمين بجواثى، فنصر الله المسلمين.", "en": "Abu Bakr al-Siddiq sent al-'Ala' ibn al-Hadrami to fight the apostates in historical Bahrain, who had rallied around al-Hutam ibn Dubay'a and besieged the Muslims at Jawatha, and God gave the Muslims victory."}, "l": {"ar": "حزم أبي بكر في حفظ الدين وجماعة المسلمين، وأن النصر من عند الله.", "en": "Abu Bakr was resolute in protecting the religion and the community; victory comes from God."}, "s": {"ar": "تاريخ الطبري، حوادث سنة 11هـ؛ البداية والنهاية لابن كثير، ذكر ردة أهل البحرين.", "en": "al-Tabari, events of 11 AH; al-Bidaya wa al-Nihaya."}, "r": {"ar": "أحكام قتال المرتدين ومانعي الزكاة؛ أحكام الإمامة وحفظ الدين.", "en": "Rulings on fighting apostates and those who withheld zakat; leadership and protecting the religion."}, "cat": "text", "sec": "d"}, {"id": 65, "t": {"ar": "عبور الخليج", "en": "Crossing the Gulf"}, "c": {"ar": "خاض العلاء بن الحضرمي بالمسلمين الخليج إلى دارين حيث تحصّن فلول المرتدين، بعد أن دعا الله، فعبروا الماء، وهي من كرامات الأولياء المروية في كتب التاريخ.", "en": "After praying to God, al-'Ala' ibn al-Hadrami led the Muslims through the waters of the Gulf to Darin, where the remaining apostates had fortified themselves, and they crossed. It is counted among the wonders granted to the righteous in history books."}, "l": {"ar": "من صدق مع الله أيّده؛ والدعاء سلاح المؤمن. (خبر تاريخي يُذكر بإسناده في كتب التاريخ، لا في الصحاح).", "en": "Whoever is true with God is supported by Him; prayer is the believer's weapon. (A historical report transmitted in history books, not in the Sahih collections.)"}, "s": {"ar": "تاريخ الطبري، حوادث سنة 11هـ؛ البداية والنهاية لابن كثير، ذكر ردة أهل البحرين.", "en": "al-Tabari, events of 11 AH; al-Bidaya wa al-Nihaya."}, "r": {"ar": "إثبات كرامات الأولياء في عقيدة أهل السنة والجماعة؛ فضل الدعاء واليقين.", "en": "Affirming wonders granted to the righteous in Sunni belief; the virtue of prayer and certainty."}, "cat": "place", "sec": "b"}, {"id": 66, "t": {"ar": "دارين", "en": "Darin"}, "c": {"ar": "دارين: جزيرة في ساحل القطيف (تاروت اليوم)، عبر إليها العلاء بن الحضرمي بالمسلمين خلف فلول المرتدين بعد رفع الحصار عن جواثى؛ فالموضعان من إقليم البحرين موطن عبد القيس.", "en": "Darin is an island off the coast of Qatif (today's Tarut), to which al-'Ala' crossed with the Muslims after the remaining apostates once the siege of Jawatha was lifted. Both places lay in the Bahrain region, homeland of 'Abd al-Qays."}, "l": {"ar": "ارتباط مواضع هجر بعضها ببعض في أحداث الردة؛ واليقين بالله يذلل الصعاب.", "en": "The places of Hajar are linked in the events of the apostasy; certainty in God makes hardship easy."}, "s": {"ar": "معجم البلدان لياقوت، مادة (دارين)؛ تاريخ الطبري، حوادث سنة 11هـ؛ البداية والنهاية.", "en": "Mu'jam al-Buldan, entry 'Darin'; al-Tabari, events of 11 AH; al-Bidaya wa al-Nihaya."}, "r": {"ar": "كرامات الأولياء؛ قتال المرتدين.", "en": "Wonders granted to the righteous; fighting the apostates."}, "cat": "place", "sec": "b"}, {"id": 67, "t": {"ar": "إسلام الراهب", "en": "The monk who embraced Islam"}, "c": {"ar": "أسلم راهب من أهل هجر لما رأى الآيات التي أظهرها الله مع العلاء بن الحضرمي في حرب الردة، وذكر أنه سمع دعاءً في السَّحَر فيه الثناء على الله بالوحدانية والحياة والعلم بكل شيء.", "en": "A monk of Hajar embraced Islam when he saw the signs God showed with al-'Ala' during the wars of apostasy, and said he had heard a pre-dawn supplication praising God's oneness, His life and His knowledge of all things."}, "l": {"ar": "الآيات تهدي القلوب الصادقة؛ ودعاء السحر من أرجى الدعاء.", "en": "Signs guide sincere hearts; the pre-dawn supplication is among the most hopeful."}, "s": {"ar": "تاريخ الطبري، حوادث سنة 11هـ؛ البداية والنهاية لابن كثير.", "en": "al-Tabari, events of 11 AH; al-Bidaya wa al-Nihaya."}, "r": {"ar": "توحيد الأسماء والصفات؛ الكرامات؛ فضل الدعاء في السحر.", "en": "The oneness of God's names and attributes; wonders of the righteous; the virtue of pre-dawn supplication."}, "cat": "figure", "sec": "b"}, {"id": 68, "t": {"ar": "العلاء بن الحضرمي", "en": "Al-'Ala' ibn al-Hadrami"}, "c": {"ar": "العلاء بن الحضرمي صحابي جليل، حليف بني عبد شمس، ولّاه النبي ﷺ البحرين، وولّاه أبو بكر ثم عمر، وهو راوي حديث: «يقيم المهاجر بمكة بعد قضاء نسكه ثلاثاً» (لفظ مسلم)، وفي البخاري: «ثلاث للمهاجر بعد الصَّدَر».", "en": "Al-‘Ala’ ibn al-Hadrami was a noble Companion, an ally of Banu ‘Abd Shams. The Prophet ﷺ appointed him over historical Bahrain (the region centred on al-Ahsa), and Abu Bakr and then ‘Umar kept him in office. He narrated the hadith: “The emigrant may stay in Makkah three days after completing his rites” (Muslim’s wording); in al-Bukhari: “Three days for the emigrant after the departure.”"}, "l": {"ar": "حسن اختيار الولاة الأمناء واستمرار الخلفاء على اختيار النبي ﷺ.", "en": "Choosing trustworthy governors, and the Caliphs keeping to the Prophet's choices."}, "s": {"ar": "الإصابة لابن حجر والاستيعاب لابن عبد البر، ترجمة العلاء؛ والحديث في صحيح البخاري رقم (3933) وصحيح مسلم رقم (1352).", "en": "al-Isaba and al-Isti'ab (al-'Ala'); the hadith in Bukhari 3933 and Muslim 1352."}, "r": {"ar": "أحكام الحج (مدة إقامة المهاجر بمكة بعد النسك)؛ أحكام الولاية.", "en": "Rulings of Hajj (how long the emigrant may stay in Makkah after the rites); rulings on governorship."}, "cat": "figure", "sec": "w"}, {"id": 69, "t": {"ar": "عزل العلاء وتولية أبان", "en": "Al-‘Ala’ replaced by Aban"}, "c": {"ar": "ظل العلاء بن الحضرمي يمارس واجباته حتى عزله الرسول ﷺ في العام التاسع للهجرة (630م)، وجعل مكانه أبان بن سعيد بن العاص بن أمية، وقيل: إن العلاء كان على ناحية من البحرين وأبان على ناحية أخرى، والقول الأول أثبت.", "en": "Al-‘Ala’ ibn al-Hadrami carried out his duties until the Messenger of God ﷺ removed him in 9 AH (630 CE) and appointed Aban ibn Sa‘id ibn al-‘As ibn Umayya in his place. It is also said that al-‘Ala’ governed one part of historical Bahrain and Aban another; the first account is more firmly established."}, "l": {"ar": "الولاية أمانة وتكليف، وتداولها بحسب المصلحة.", "en": "Office is a trust and a duty, passed on as the public good requires."}, "s": {"ar": "فتوح البلدان للبلاذري؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "al-Baladhuri, Futuh al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "أحكام الولاية: حق الإمام في تولية العمال وعزلهم.", "en": "Rulings on governorship: the ruler’s right to appoint and remove officials."}, "cat": "figure", "sec": "d"}, {"id": 70, "t": {"ar": "ولاة البحرين في صدر الإسلام", "en": "Governors of Bahrain in early Islam"}, "c": {"ar": "ولاة البحرين في صدر الإسلام:\n• في عهد النبي ﷺ: المنذر بن ساوى، العلاء بن الحضرمي، أبان بن سعيد.\n• في عهد أبي بكر رضي الله عنه: العلاء بن الحضرمي.\n• في عهد عمر رضي الله عنه: العلاء بن الحضرمي، عياش بن أبي ثور، قدامة بن مظعون، أبو هريرة الدوسي، الربيع بن زياد الحارثي، عثمان بن أبي العاص.\n• في عهد عثمان رضي الله عنه: عثمان بن أبي العاص، عبد الله بن سوار العبدي، مروان بن الحكم.\n• في عهد علي رضي الله عنه: عمر بن أبي سلمة، عمر بن أبي قتادة، النعمان بن العجلان الأنصاري، قدامة بن العجلان، عبيد الله بن العباس.", "en": "Governors of historical Bahrain (the region centred on al-Ahsa) in early Islam:\n• In the time of the Prophet ﷺ: al-Mundhir ibn Sawa, al-‘Ala’ ibn al-Hadrami, Aban ibn Sa‘id.\n• In the time of Abu Bakr: al-‘Ala’ ibn al-Hadrami.\n• In the time of ‘Umar: al-‘Ala’ ibn al-Hadrami, ‘Ayyash ibn Abi Thawr, Qudama ibn Maz‘un, Abu Hurayra al-Dawsi, al-Rabi‘ ibn Ziyad al-Harithi, ‘Uthman ibn Abi al-‘As.\n• In the time of ‘Uthman: ‘Uthman ibn Abi al-‘As, ‘Abdullah ibn Sawwar al-‘Abdi, Marwan ibn al-Hakam.\n• In the time of ‘Ali: ‘Umar ibn Abi Salama, ‘Umar ibn Abi Qatada, al-Nu‘man ibn al-‘Ajlan al-Ansari, Qudama ibn al-‘Ajlan, ‘Ubaydullah ibn al-‘Abbas."}, "l": {"ar": "عناية الخلفاء بالبحرين واختيار كبار الصحابة لولايتها.", "en": "The Caliphs cared for Bahrain and chose senior Companions to govern it."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا (جدول ولاة البحرين في صدر الإسلام). وانظر ورقة «ولاة البحرين» في هذا الملف.", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar (table of the governors of Bahrain in early Islam)."}, "r": {"ar": "أحكام الولاية والإمارة؛ محاسبة العمال.", "en": "Rulings on governorship and command; holding officials to account."}, "cat": "figure", "sec": "d"}, {"id": 71, "t": {"ar": "أبو هريرة والياً", "en": "Abu Hurayra as governor"}, "c": {"ar": "استعمل عمر بن الخطاب أبا هريرة رضي الله عنه على البحرين، ثم حاسبه على ما قدم به من مال.", "en": "'Umar ibn al-Khattab appointed Abu Hurayra over historical Bahrain, then held him to account for the wealth he brought back."}, "l": {"ar": "مبدأ المحاسبة والشفافية في المال العام من سنن الخلفاء الراشدين.", "en": "Accountability and transparency over public funds were practices of the Rightly Guided Caliphs."}, "s": {"ar": "الطبقات الكبرى لابن سعد، ترجمة أبي هريرة؛ سير أعلام النبلاء للذهبي، ترجمة أبي هريرة.", "en": "Ibn Sa'd, al-Tabaqat al-Kubra; al-Dhahabi, Siyar A'lam al-Nubala' (Abu Hurayra)."}, "r": {"ar": "أحكام الولاية ومحاسبة العمال؛ أحكام بيت المال.", "en": "Rulings on governorship and holding officials accountable; the public treasury."}, "cat": "figure", "sec": "d"}, {"id": 72, "t": {"ar": "كمستبضع التمر إلى هجر", "en": "Like carrying dates to Hajar"}, "c": {"ar": "اشتهرت هجر بكثرة التمر حتى ضُرب بها المثل: «كمُستبضِع التمر إلى هجر» لمن يحمل الشيء إلى موضع كثرته.", "en": "Hajar was so famous for its abundant dates that a proverb arose: \"Like one carrying dates to Hajar,\" said of someone who brings a thing to where it is plentiful."}, "l": {"ar": "نعمة الله على هجر بالنخيل، ووجوب شكرها بأداء حقها من الزكاة.", "en": "God blessed Hajar with palms, and gratitude for that means paying their due zakat."}, "s": {"ar": "مجمع الأمثال للميداني؛ معجم البلدان لياقوت الحموي، مادة (هجر).", "en": "al-Maydani, Majma' al-Amthal; Mu'jam al-Buldan, entry 'Hajar'."}, "r": {"ar": "أحكام البيوع والتجارة في الثمار؛ زكاة الزروع والثمار ومنها التمر.", "en": "Rulings on trading fruit; zakat on crops and fruit, including dates."}, "cat": "item", "sec": "d"}, {"id": 73, "t": {"ar": "التعضوض", "en": "Ta'dud dates"}, "c": {"ar": "التَّعْضوض: ضرب من التمر أسود شديد الحلاوة، ومعدنه هجر.", "en": "Al-Ta'dud is a black, very sweet kind of date whose home is Hajar."}, "l": {"ar": "تنوع ثمار هجر من نعم الله عليها.", "en": "The variety of Hajar's fruits is one of God's blessings upon it."}, "s": {"ar": "لسان العرب لابن منظور، مادة (عضض)؛ وورد اسمه في حديث وفد عبد القيس في مسند أحمد.", "en": "Ibn Manzur, Lisan al-'Arab (root '-d-d); named in the 'Abd al-Qays delegation hadith in Musnad Ahmad."}, "r": {"ar": "أحكام البيوع في التمور؛ زكاة الثمار.", "en": "Rulings on trading dates; zakat on fruit."}, "cat": "item", "sec": "d"}, {"id": 74, "t": {"ar": "الصرفان", "en": "Sarafan dates"}, "c": {"ar": "الصَّرَفان: ضرب من التمر أحمر، صُلب المَمضغة، ثقيل.", "en": "Al-Sarafan is a red kind of date, firm to chew and heavy."}, "l": {"ar": "معرفة أسماء الأصناف تعين على فهم الأحاديث وأحكام البيوع.", "en": "Knowing the names of varieties helps in understanding hadiths and the rulings of trade."}, "s": {"ar": "لسان العرب لابن منظور، مادة (صرف)؛ وورد في حديث وفد عبد القيس في مسند أحمد.", "en": "Lisan al-'Arab (root s-r-f); named in the delegation hadith in Musnad Ahmad."}, "r": {"ar": "أحكام بيع التمر بالتمر (الربا في الأصناف الربوية).", "en": "Rulings on exchanging dates for dates (riba in like-for-like goods)."}, "cat": "item", "sec": "d"}, {"id": 75, "t": {"ar": "البرني", "en": "Barni dates"}, "c": {"ar": "البَرْني: ضرب من أجود التمر، أصفر مُشرب بحمرة، كثير اللحاء عذب الحلاوة.", "en": "Al-Barni is one of the finest dates, yellow tinged with red, thick-fleshed and pleasantly sweet."}, "l": {"ar": "البرني من مفاخر هجر، وقد ورد ذكره في السنة.", "en": "Al-Barni is a pride of Hajar and is mentioned in the Sunna."}, "s": {"ar": "لسان العرب لابن منظور، مادة (برن).", "en": "Lisan al-'Arab (root b-r-n)."}, "r": {"ar": "أحكام الأطعمة؛ زكاة الثمار؛ الربا في الأصناف (حديث بلال في التمر البرني، صحيح البخاري رقم 2312).", "en": "Rulings on food; zakat on fruit; riba in like-for-like goods (hadith of Bilal on Barni dates, Bukhari 2312)."}, "cat": "item", "sec": "d"}, {"id": 76, "t": {"ar": "خير تمركم", "en": "\"The best of your dates\""}, "c": {"ar": "في حديث وفد عبد القيس عند أحمد: «ثم أومأ النبي ﷺ إلى صبرة فقال: أتسمون هذا البرني؟ قلنا: نعم، فقال: أما إنه خير تمركم وأنفعه لكم». قال: فرجعنا من وفادتنا تلك فأكثرنا الغرز منه، وعظمت رغبتنا فيه حتى صار عُظم نخلنا وتمرنا البرني. (وورد ذكر التعضوض والصرفان في سياق تسمية النبي ﷺ ألوان تمرهم).", "en": "In the hadith of the ‘Abd al-Qays delegation in Musnad Ahmad: “Then the Prophet ﷺ pointed to a heap of dates and said: ‘Do you call this al-Barni?’ We said: ‘Yes.’ He said: ‘It is the best of your dates and the most beneficial for you.’” He said: We returned from that visit and planted it widely, and our liking for it grew until most of our palms and dates were Barni. (Al-Ta‘dud and al-Sarafan are mentioned as he named the kinds of their dates.)"}, "l": {"ar": "استجابة الصحابة لتوجيه النبي ﷺ حتى في الزراعة والاقتصاد.", "en": "The Companions followed the Prophet's guidance even in farming and economy."}, "s": {"ar": "مسند أحمد، حديث شهاب بن عباد (رقم 15559 ط. الرسالة)، وحسّنه بعض المحققين وضعّفه الأرناؤوط؛ أما لفظ «خير تمركم البرني يُذهب الداء ولا داء فيه» فضعيف (السلسلة الضعيفة).", "en": "Musnad Ahmad, hadith of Shihab ibn 'Abbad (graded good by some, weak by al-Arna'ut); the wording \"the best of your dates is al-Barni; it removes disease\" is weak (al-Silsila al-Da'ifa)."}, "r": {"ar": "أحكام الزراعة والغرس؛ الأطعمة؛ الطب النبوي.", "en": "Rulings on farming and planting; food; Prophetic medicine."}, "cat": "text", "sec": "d"}, {"id": 77, "t": {"ar": "سوق هجر", "en": "The market of Hajar"}, "c": {"ar": "من أسواق العرب قبل الإسلام: سوق هجر بالمشقّر، وكانت تُقام في موسم معلوم من السنة يؤمّها التجار من أنحاء الجزيرة، وتختلف كتب الأسواق في تحديد موعدها.", "en": "Among the Arab markets before Islam was the market of Hajar at al-Mushaqqar, held in a known season each year and visited by traders from across the Peninsula; books on the markets differ on its exact date."}, "l": {"ar": "مكانة هجر التجارية قديماً، وأن الأسواق كانت ملتقى الناس ونقل الأخبار.", "en": "Hajar's old commercial standing; markets were where people met and news travelled."}, "s": {"ar": "المحبّر لابن حبيب؛ الأزمنة والأمكنة للمرزوقي؛ تاريخ اليعقوبي (ذكر أسواق العرب).", "en": "Ibn Habib, al-Muhabbar; al-Marzuqi, al-Azmina wa al-Amkina; Tarikh al-Ya'qubi."}, "r": {"ar": "أحكام الأسواق والبيوع؛ آداب التجارة.", "en": "Rulings on markets and trade; etiquette of commerce."}, "cat": "landmark", "sec": "d"}, {"id": 78, "t": {"ar": "ثياب البحرين المعقّدة", "en": "The mu‘aqqada cloth of Bahrain"}, "c": {"ar": "اختيار كسوة المنطقة الشرقية (الظهران) للمناسبات وفي كفارة اليمين: إن مما يؤكد الصلة بين مجتمع المدينة المنورة والمنطقة الشرقية أو البحرين كما كانت تسمى قديماً، اختيار بعض الصحابة في لباسهم منسوجات المنطقة الشرقية للمناسبات كالجمعة وغيرها، وخاصة مما يأتي من الظهران، فعندما أمر النبي ﷺ بأخذ الزينة لصلاة الجمعة اختاروا البُرُد، وكانوا يسمونها المُعقَّدة. واختار بعض السلف منهم أبو موسى الأشعري رضي الله عنه أثواب المنطقة الشرقية في كفارة يمين له، وهذا كان من اختيارات بعض التابعين كالحسن البصري وابن سيرين رحمهم الله تعالى. وكانت الظهران من قرى عبد القيس ذات نخيل وزروع.\n• روى عبد الرزاق عن محمد بن يحيى بن حبان أن النبي ﷺ قال: «أما يتخذ أحدكم ثوبين ليوم جمعته سوى ثوبي مهنته». قال: وكانوا يلبسون النمر، قال عبد الله بن سلام: فبعت نمرة كانت لي، واشتريت معقدة، يعني ثياب البحرين.\n• وروى عبد الرزاق عن ابن سيرين في كفارة اليمين أنه قال: ثوبين ثوبين، وكذلك كسا الأشعري أبو موسى ثوبين ثوبين من معقدة البحرين، وعن الحسن البصري رحمه الله تعالى أنه قال: إزار ورداء ظهراني معقدة.", "en": "Choosing the cloth of the Eastern Region (al-Zahran) for occasions and for the expiation of oaths. One sign of the bond between the society of Madinah and the Eastern Region, or historical Bahrain (the region centred on al-Ahsa) as it was once called, is that some Companions chose its textiles for occasions such as Friday, especially cloth from al-Zahran. When the Prophet ﷺ commanded adornment for the Friday prayer, they chose striped cloaks, which they called al-mu‘aqqada. Some of the early Muslims, among them Abu Musa al-Ash‘ari, chose garments of the Eastern Region to expiate an oath, as did some of the Successors, such as al-Hasan al-Basri and Ibn Sirin. Al-Zahran was one of the villages of ‘Abd al-Qays, with palms and crops.\n• ‘Abd al-Razzaq narrated from Muhammad ibn Yahya ibn Habban that the Prophet ﷺ said: “Should not one of you keep two garments for his Friday, besides his work clothes?” He said: They used to wear striped woollen cloaks. ‘Abdullah ibn Salam said: “I sold a cloak of mine and bought a mu‘aqqada,” meaning the cloth of Bahrain.\n• ‘Abd al-Razzaq narrated that Ibn Sirin said of the expiation for an oath: “two garments each,” and that Abu Musa al-Ash‘ari clothed people with two garments each of the mu‘aqqada of Bahrain; and al-Hasan al-Basri said: “a wrap and a cloak of Zahrani mu‘aqqada.”"}, "l": {"ar": "الصلة بين مجتمع المدينة والمنطقة الشرقية؛ وفضل التجمل للجمعة بلبس أحسن الثياب.", "en": "The bond between Madinah and the Eastern Region; the merit of dressing in one’s best for Friday."}, "s": {"ar": "مصنف عبد الرزاق الصنعاني (رقم 5329، 16093، وانظر رقم 16092)؛ معجم البلدان لياقوت الحموي؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Musannaf ‘Abd al-Razzaq al-San‘ani (5329, 16093; see 16092); Yaqut, Mu‘jam al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "أحكام صلاة الجمعة: استحباب التجمل لها؛ كفارة اليمين: الكسوة.", "en": "Rulings of the Friday prayer: the merit of dressing well for it; the expiation of oaths: clothing."}, "cat": "item", "sec": "w"}, {"id": 79, "t": {"ar": "ما تعلّموه في العقيدة", "en": "What they learned of belief"}, "c": {"ar": "ما تعلّمه عبد القيس من العقيدة: توحيد الله والشهادتان، وأن الإيمان قول وعمل، والإيمان بالرسل والكتب، وأن الله يحب الأخلاق الفاضلة.", "en": "What 'Abd al-Qays learned of belief: God's oneness and the two testimonies, that faith is word and deed, belief in the messengers and scriptures, and that God loves noble character."}, "l": {"ar": "البدء بتصحيح المعتقد أساس التعليم.", "en": "Correcting belief first is the foundation of teaching."}, "s": {"ar": "خلاصة من: صحيح البخاري (53)، صحيح مسلم (17)، سيرة ابن هشام (خبر الجارود).", "en": "Summary of Bukhari 53, Muslim 17, and Ibn Hisham (report of al-Jarud)."}, "r": {"ar": "تعريف الإيمان؛ أركان الإيمان؛ الشهادتان.", "en": "The definition of faith; the pillars of faith; the two testimonies."}, "cat": "text", "sec": "b"}, {"id": 80, "t": {"ar": "ما تعلّموه في العبادات", "en": "What they learned of worship"}, "c": {"ar": "ما تعلّمه عبد القيس من العبادات: الصلاة، والزكاة، وصيام رمضان، وأداء الخمس من المغنم، ثم أقاموا الجمعة بجواثى، وتعلّموا الدعاء: «اللهم اجعلنا من عبادك المنتخبين، الغُرّ المحجّلين، الوفد المتقبَّلين».", "en": "What 'Abd al-Qays learned of worship: prayer, zakat, fasting Ramadan and giving a fifth of the spoils. Then they held the Friday prayer at Jawatha, and learned the supplication: \"O God, make us among Your chosen servants, the radiant ones, the accepted delegation.\""}, "l": {"ar": "المبادرة إلى تطبيق العلم؛ فعبد القيس نقلوا ما
