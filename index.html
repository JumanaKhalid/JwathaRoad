تعلّموه إلى بلادهم عملاً.", "en": "They hastened to apply what they learned and carried it home as practice."}, "s": {"ar": "صحيح البخاري (53، 892)؛ مسند أحمد، حديث أبي القموص عن وفد عبد القيس (الدعاء).", "en": "Sahih al-Bukhari 53 and 892; Musnad Ahmad (the supplication)."}, "r": {"ar": "تعريف الصلاة وأحكامها؛ الزكاة وأحكامها؛ الصيام؛ الجمعة؛ الوضوء (الغر المحجلون من أثر الطهور).", "en": "Prayer and its rulings; zakat; fasting; Friday; ablution (\"the radiant ones\" bear the marks of purification)."}, "cat": "text", "sec": "w"}, {"id": 81, "t": {"ar": "ما تعلّموه في المعاملات", "en": "What they learned of dealings"}, "c": {"ar": "ما تعلّمه عبد القيس من المعاملات: تحريم المسكر وأوعيته، وحرمة مال المسلم (ضالة المسلم حرق النار)، والحلم والأناة، والأخوة مع الأنصار وإكرام بعضهم بعضاً.", "en": "What 'Abd al-Qays learned of dealings: the prohibition of intoxicants and their vessels, the sanctity of a Muslim's property (\"the stray of a Muslim is a flame of fire\"), forbearance and deliberation, and brotherhood with the Ansar, honouring one another."}, "l": {"ar": "الإسلام منهج شامل للعقيدة والعبادة والمعاملة.", "en": "Islam is a complete way covering belief, worship and dealings."}, "s": {"ar": "صحيح البخاري (53)؛ صحيح مسلم (17)؛ سنن أبي داود (5225)؛ سيرة ابن هشام؛ مسند أحمد.", "en": "Bukhari 53; Muslim 17; Abu Dawud 5225; Ibn Hisham; Musnad Ahmad."}, "r": {"ar": "أحكام الأشربة؛ اللقطة؛ الأخلاق؛ الأخوة الإيمانية.", "en": "Rulings on drinks; found property; character; brotherhood in faith."}, "cat": "text", "sec": "d"}];

let drag=null, justDragged=false, sel=null, lastRect=null;
const dragAttr=(kind,id)=>`data-drag="${id}" data-kind="${kind}" data-act="sel" data-arg="${kind}|${id}"`;
const dropAttr=zone=>`data-drop="${zone}" data-act="dropAt" data-arg="${zone}"`;
const isSel=id=>sel&&sel.id===id?'selected':'';
document.addEventListener('pointerdown',e=>{ const el=e.target.closest('[data-drag]'); if(!el||e.button>0||el.disabled) return; drag={el,kind:el.dataset.kind,id:el.dataset.drag,x:e.clientX,y:e.clientY,moved:false}; });
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return; drag.moved=true;
    const g=drag.el.cloneNode(true); g.classList.add('dragghost'); g.style.width=drag.el.offsetWidth+'px'; document.body.appendChild(g); drag.g=g; drag.el.style.opacity=.35; }
  drag.g.style.left=(e.clientX-drag.el.offsetWidth/2)+'px'; drag.g.style.top=(e.clientY-24)+'px';
  document.querySelectorAll('.dz-hover').forEach(x=>x.classList.remove('dz-hover'));
  const t=document.elementFromPoint(e.clientX,e.clientY); const z=t&&t.closest('[data-drop]'); z&&z.classList.add('dz-hover');
});
function endDrag(e,cancel){
  if(!drag) return; const d=drag; drag=null; if(!d.moved) return;
  d.g.remove(); d.el.style.opacity=''; document.querySelectorAll('.dz-hover').forEach(x=>x.classList.remove('dz-hover'));
  justDragged=true; setTimeout(()=>justDragged=false,60);
  if(cancel) return; const t=document.elementFromPoint(e.clientX,e.clientY); const z=t&&t.closest('[data-drop]'); if(z) onDrop(d.kind,d.id,z.dataset.drop);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
function onDrop(kind,id,zone){

  if(kind==='letter'&&z==='tl') return placeLetter(id,+arg,zone);
  if(kind==='verse'&&z==='ps') return placeVerse(id,+arg,zone);
  if(kind==='basket'&&z==='palm') return pickPalm(arg);
  shakeZone(zone); refresh();
}

function usefulNow(){
  const s=st.screen,c=st.ch,out=[];
  if((s==='ch1'&&!c.done&&(c.running||c.failed))||(s==='ch2'&&c.adjust&&!c.pass)||(s==='palms'&&c.running)) out.push('timer');
  if((s==='night'&&c.phase==='choose')||(s==='ch2'&&!c.anah&&!c.pass)||(s==='ch3'&&!c.anah&&c.step!=='arrive')||(s==='cross'&&!st.gates[st.stage]&&!c.anah)||(s==='diwan'&&!c.anah)||(s==='palms'&&!c.anah&&!c.done)) out.push('anah');
  if(st.frags.length||((s==='diwan'||s==='poem'))) out.push('glue');
  if(st.trapped) out.push('master','chance');
  if(s==='over'&&!c.final) out.push('chance');
  if((s==='ch3'&&c.step==='ambush')||(s==='night'&&c.phase==='wolves')) out.push('swords');
  return out;
}

/* ---- wheel ---- */
SCREENS.wheel=()=>{
  const n=ORDER.length,R=200,seg=360/n; let g='';
  ORDER.forEach((k,i)=>{
    const a0=(i*seg-90-seg/2)*Math.PI/180,a1=((i+1)*seg-90-seg/2)*Math.PI/180;
    g+=`<path d="M${R} ${R} L${R+R*Math.cos(a0)} ${R+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R+R*Math.cos(a1)} ${R+R*Math.sin(a1)}Z" fill="${owned(k)?'#5E9070':['#263A63','#1B2A4C'][i%2]}" stroke="#D2B87F" stroke-width="1.5"/>`;
    const am=(i*seg-90)*Math.PI/180, ix=R+R*.8*Math.cos(am), iy=R+R*.8*Math.sin(am), tx=R+R*.58*Math.cos(am), ty=R+R*.58*Math.sin(am);
    const rot=-((st.ch.rot||0)%360), words=tr(ABIL[k].n).split(' ');
    g+=`<g transform="translate(${ix-13} ${iy-13})" color="#E7D4A8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg></g>
      <text x="${tx}" y="${ty}" fill="#EEF1F6" font-size="12.5" font-family="IBM Plex Sans Arabic, IBM Plex Sans, sans-serif" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rot} ${tx} ${ty})">${words.map((w,j)=>`<tspan x="${tx}" dy="${j===0?-(words.length-1)*7:14}">${w}</tspan>`).join('')}</text>`;
  });
  const last=st.ch.last, got=ORDER.filter(owned);
  return `<div class="wheel-wrap">
    <div class="wheel"><div class="ptr"></div><svg class="disc" id="disc" viewBox="0 0 400 400" style="transform:rotate(${st.ch.rot||0}deg)">${g}</svg>
      <div class="hub">${st.spins>0?T('دوّر','Spin'):T('اكتمل','Done')}</div></div>
    <div>
      <h2 class="scene-title">${T('عجلة الخصائص','The Wheel of Abilities')}</h2>
      <p class="narr">${T('قبل أن يشدّ ساوى الرحال، تدور العجلة ثلاث مرات، فينال ثلاث خصائص مجاناً. وما فاته منها يشتريه لاحقاً من سوق الخصائص بالعملات المعرفية التي يكسبها من قراءة خزانة المعرفة.',
        'Before Sawa sets out, the wheel spins three times and grants three free abilities. Anything it misses can be bought later in the Ability Market with knowledge coins, earned by reading in the Knowledge Vault.')}</p>
      <div class="dots">${[0,1,2].map(i=>`<i class="${i<3-st.spins?'u':''}"></i>`).join('')}</div>
      ${last?`<div class="won"><span class="bigic">${ic(last)}</span><div><b style="font-size:19px;color:var(--parch)">${tr(ABIL[last].n)}</b><p class="narr" style="font-size:16.5px;margin:4px 0 0">${tr(ABIL[last].d)}</p></div></div>`:''}
      <div class="row mt">${st.spins>0?`<button class="btn" id="spinBtn" data-act="spin">${T('دوّر العجلة','Spin the wheel')} (${num(st.spins)})</button>`:`<button class="btn" data-act="toCross">${T('شُدّ الرحال','Set out')}</button>`}</div>
      ${got.length?`<p class="scene-sub mt">${T('في حوزتك: ','You hold: ')}${got.map(k=>tr(ABIL[k].n)).join(T('، ',', '))}</p>`:''}
    </div></div>`;
};
function spin(){
  if(st.spins<=0||st.ch.spinning) return;
  const pool=ORDER.filter(k=>!owned(k)); const k=pool[Math.floor(Math.random()*pool.length)], i=ORDER.indexOf(k), seg=360/ORDER.length;
  const base=st.ch.rot||0; const target=base+360*5+((360-i*seg)-(base%360)+360)%360;
  st.ch.spinning=true; $('#spinBtn').disabled=true; $('#disc').style.transform=`rotate(${target}deg)`;
  if(SND.ctx){ let t=0,gap=.04; while(t<4){ tone(1700,.025,'square',.025,SND.ctx.currentTime+t); t+=gap; gap*=1.09; } }
  const fin=()=>{ st.ch.rot=target; st.ch.spinning=false; st.spins--; st.ab[k]=ABIL[k].uses; st.ch.last=k; render(); sfx('key'); toast(T('نلتَ: ','You won: ')+tr(ABIL[k].n)); };
  matchMedia('(prefers-reduced-motion: reduce)').matches ? fin() : timers.push(setTimeout(fin,4300));
}

    dubba:'<path d="M60 14c4 0 6 6 6 14 0 6 26 20 26 56 0 30-14 50-32 50s-32-20-32-50c0-36 26-50 26-56 0-8 2-14 6-14z" fill="#c9a35a" stroke="#6e4a2c" stroke-width="2.5"/><path d="M60 8c3-4 9-4 12 0" stroke="#6e4a2c" stroke-width="3" fill="none"/>',
    naqir:'<rect x="22" y="40" width="76" height="94" rx="10" fill="#7a5233" stroke="#3B2414" stroke-width="2.5"/><ellipse cx="60" cy="40" rx="38" ry="10" fill="#3a2414" stroke="#3B2414" stroke-width="2.5"/><path d="M30 60v60M44 56v70M76 56v70M90 60v60" stroke="#3B241477" stroke-width="2"/>',
    muzaffat:'<path d="M42 16h36v14c16 8 24 24 24 46 0 32-18 56-42 58-24-2-42-26-42-58 0-22 8-38 24-46z" fill="#26201c" stroke="#000" stroke-width="2.5"/><path d="M30 60c16-6 30 4 60-4" stroke="#6b5a4a" stroke-width="3" fill="none"/>'};
  return `<svg viewBox="0 0 120 140" aria-hidden="true">${s[k]}</svg>`;
}
SCREENS.ch2=()=>{
  const c=st.ch; if(!c.init){Object.assign(c,{init:1,choice:{},anah:0,adjust:0,t:30}); if(st.armed.anah){c.anah=1;st.armed.anah=0;toast(T('عملت الأناة: انكشفت الحقائق','Deliberation took effect: the facts are revealed'));}}

  return `<div style="position:relative">
    ${hint(P('فكّر في العاقبة… ثم اختر قبولاً أو رفضاً','Think of the consequence… then accept or refuse'),'1%','2%')}
    ${fragsHere('ch2')}
    <h2 class="scene-title">${T('التحدي الثاني: رفوف الأوعية','Challenge two: the vessel shelves')}</h2>
    <p class="scene-sub">${T('سوق هجر · أوعية ورد ذكرها في حديث وفد عبد القيس','Hajar market · vessels named in the hadith of the \'Abd al-Qays delegation')}</p>
    <p class="narr">${T('يعرض عليك بائع في السوق أوعية قديمة كان أهل هجر ينبذون فيها. اقبل ما تراه صالحاً، وارفض ما تخشى عاقبته.','A trader offers old vessels in which the people of Hajar used to steep drinks. Accept what you find sound, and refuse what you fear the consequence of.')}</p>
    ${c.adjust&&!c.pass?`<div class="trap" style="margin:0 0 16px"><h4>${T('بقي في اختيارك ما تُخشى عاقبته','Your choice still holds something you should fear')}</h4><div class="row"><span class="clock ${c.t<=10?'low':''}" id="clock2">${num(c.t)}</span><span style="font-size:15px">${T('عدّل اختيارك ثم احسمه قبل انتهاء الوقت.','Adjust your choice and confirm before time runs out.')}</span>${rescue(c.anah?['timer']:['timer','anah'])}</div></div>`:''}
    <div class="shelf">${POTS.map(p=>`<div class="pot">${potSVG(p.k)}<span class="nm">${W(p.k)}</span>${c.anah?`<span class="fact">${tr(p.f)}</span>`:''}
      <div class="yn"><button class="${c.choice[p.k]==='a'?'on acc':''}" data-act="potSet" data-arg="${p.k}:a" aria-pressed="${c.choice[p.k]==='a'}" ${c.pass?'disabled':''}>${T('قبول','Accept')}</button><button class="${c.choice[p.k]==='r'?'on rej':''}" data-act="potSet" data-arg="${p.k}:r" aria-pressed="${c.choice[p.k]==='r'}" ${c.pass?'disabled':''}>${T('رفض','Refuse')}</button></div></div>`).join('')}</div>
    ${c.anah?`<p class="narr mt anahfx" style="color:var(--parch)">${T('تأنّيتَ فانكشف لك: هذه الأوعية يُسرع فيها الشراب إلى الإسكار دون أن يشعر صاحبه.','You paused, and it became clear: drinks in these vessels turn intoxicating without their owner noticing.')}</p>`:''}
    ${c.pass?`<div class="scroll mt"><h3>${T('أصبتَ','Well judged')}</h3>${T(`نهى النبي ﷺ وفد عبد القيس عن أربع: ${W('hantam')} و${W('dubba')} و${W('naqir')} و${W('muzaffat')}، سدّاً للطريق إلى المسكر. ثم نُسخ النهي عن الأوعية بقوله ﷺ: «ولا تشربوا مسكراً»، فبقي تحريم المسكر.`,`The Prophet ﷺ forbade the 'Abd al-Qays delegation four vessels: ${W('hantam')}, ${W('dubba')}, ${W('naqir')} and ${W('muzaffat')}, to close the path to intoxicants. The ban on the vessels was later lifted with his words "Do not drink anything intoxicating," while intoxicants stayed forbidden.`)}
      <div class="src">${T('صحيح البخاري (53)؛ صحيح مسلم (17)؛ والنسخ في صحيح مسلم (977).','Sahih al-Bukhari 53; Sahih Muslim 17; abrogation in Sahih Muslim 977.')}</div>
      <div class="row mt"><button class="btn" data-act="toCross">${T('تابع الطريق','Continue')}</button></div></div>`
    :`<div class="row mt"><button class="btn" data-act="ch2submit" ${decided?'':'disabled'}>${T('احسم اختيارك','Confirm your choice')}</button>${decided?'':`<span class="scene-sub" style="margin:0">${T('قرّر في كل وعاء أولاً','Decide on every vessel first')}</span>`}</div>`}
  </div>`;
};
SCREENS.ch2.after=()=>{ if(st.ch.adjust&&!st.ch.pass) timers.push(setInterval(()=>{ if(paused()) return; const c=st.ch; c.t--; const e=$('#clock2'); if(e){e.textContent=num(c.t);e.classList.toggle('low',c.t<=10);} if(c.t<=10&&c.t>0) sfx('tick'); if(c.t<=0){clearTimers();ch2Eval(true);} },1000)); };
function ch2Eval(timeout){
  const c=st.ch, acc=POTS.filter(p=>c.choice[p.k]==='a').length;
  if(acc===0){ c.pass=1; c.adjust=0; sfx('win'); render(); return; }
  if(acc===POTS.length) return gameOver(T('قبلتَ الأوعية كلها، فغفلتَ عن العاقبة. هذه الأوعية نهى عنها النبي ﷺ وفد عبد القيس لأن ما يُنبذ فيها يسرع إليه الإسكار.','You accepted every vessel and ignored the consequence. The Prophet ﷺ forbade these to the \'Abd al-Qays delegation because drinks in them quickly turn intoxicating.'));
  if(timeout) return gameOver(T('انقضى وقت التعديل وفي اختيارك ما تُخشى عاقبته.','Time ran out while your choice still held something harmful.'));
  if(c.adjust){ sfx('wrong'); toast(T('ما زال في اختيارك ما تُخشى عاقبته','Your choice still holds something harmful')); return; }
  c.adjust=1; c.t=30; st.log.ch2Adjust=1;
  if(st.armed.timer){ c.t+=30; st.armed.timer=0; toast(T('عمل المؤقت: أُضيفت 30 ثانية','Time Keeper took effect: +30 seconds')); }
  sfx('wrong'); render();
}

/* ---- files: classify pieces into document folders ---- */
const FOLDERS=['L1','L2','L3','P'];
function classify(id,doc,zone){
  if(fragDoc(id)!==doc){ shakeZone(zone); toast(T('ليست من هذه الوثيقة','It does not belong to this document')); return refresh(); }
  st.frags=st.frags.filter(x=>x!==id); st.files.push(id); sfx('paper');
  const n=DOCS[doc].parts.length, have=DOCS[doc].parts.filter((_,i)=>st.files.includes(doc+i)).length;
  toast(have===n?T('اكتمل ملف: ','File complete: ')+tr(DOCS[doc].t):T('حُفظت القطعة في ملفها، وفرغ مكانها في الجراب','Piece filed; its space in the satchel is free'));
  if(have===n) sfx('win'); refresh();
}
function classifyAll(){ const n=st.frags.length; st.files.push(...st.frags); st.frags=[]; return n; }
function openFiles(){
  const arch=owned('archive');
  modal(`<div class="panel"><div class="lib-top"><div><h3>${T('الجراب والملفات','Satchel & document files')}</h3>
      <p class="sub" style="margin:0">${T('اسحب كل قطعة إلى ملف وثيقتها، أو انقرها ثم انقر الملف. ما يُحفظ في الملفات يفرّغ مكانه في الجراب.','Drag each piece into its document\'s file, or tap it and then tap the file. Filed pieces free up space in the satchel.')}</p></div>
      <span class="chip">${ic('frag')} ${num(st.frags.length)}${arch?'':'/'+num(CAP)}</span></div>
    <div class="files">
      <div><h4 style="margin:0 0 8px;color:var(--parch)">${arch?T('السجل المعرفي','Knowledge Ledger'):T('الجراب','Satchel')}</h4>
        <div class="tray">${st.frags.length?st.frags.map(id=>`<div class="piecewrap"><button class="piece dragit ${isSel(id)}" ${dragAttr('piece',id)}>${fragText(id)}<span class="pt hid">${tr(DOCS[fragDoc(id)].t)}</span></button>${arch?'':`<button class="btn sm ghost dropbtn" data-act="drop" data-arg="${id}">${T('اترك','Drop')}</button>`}</div>`).join('')
          :`<p class="sub">${T('الجراب فارغ. القصاصات المتوهجة تنتظرك في الشاشات.','The satchel is empty. Glowing scraps await you on the screens.')}</p>`}
        ${st.frags.length?`<div class="row">${rescue(['glue'])}</div>`:''}</div></div>
      <div class="folders">${FOLDERS.map(d=>{const D=DOCS[d],n=D.parts.length,have=D.parts.filter((_,i)=>st.files.includes(d+i)).length;
        return `<div class="folder dzone ${have===n?'ok':''}" ${dropAttr('folder:'+d)}><div class="fh">${ic('folder')}<b>${tr(D.t)}</b><span>${num(have)}/${num(n)}</span></div>
          ${have?`<div class="fparts doc">${D.parts.map((p,i)=>st.files.includes(d+i)?`<p>${tr(p)}</p>`:`<p class="gap">${T('[جزء لم يُعثر عليه بعد]','[part not found yet]')}</p>`).join('')}</div>`:''}</div>`;}).join('')}</div>
    </div>
    <div class="row mt"><button class="btn" data-act="close">${T('عُد إلى الرحلة','Back to the journey')}</button></div></div>`,true,'files');
}

/* ---- round 2: letters hall (drag to timeline) ---- */
const TLORDER=['L1','L2','L3'];
function placeLetter(id,i,zone){ if(TLORDER[i]===id){ st.timeline[i]=id; sfx('paper'); if(st.timeline.every(Boolean)){ sfx('win'); toast(T('رُتّبت الرسائل','The letters are in order')); } render(); } else { shakeZone(zone); toast(T('ليس هذا موضعها في التسلسل','That is not its place in the sequence')); refresh(); } }
SCREENS.diwan=()=>{
  const c=st.ch; if(!c.init){c.init=1; if(st.armed.anah){c.anah=1;st.armed.anah=0;} if(st.armed.glue){st.armed.glue=0; classifyAll(); st.timeline=[...TLORDER]; toast(T('عمل الغراء: رُتّبت الرسائل','Glue took effect: letters ordered'));}}
  const done=st.timeline.every(Boolean);
  const card=d=>{const have=[0,1,2].filter(i=>st.files.includes(d+i)).length;
    return `<b>${tr(DOCS[d].t)}</b><span class="doc">${have?tr(DOCS[d].parts[[0,1,2].find(i=>st.files.includes(d+i))]):T('لم تحفظ منه قطعة بعد','No piece filed yet')}</span><small>${T('في الملف: ','Filed: ')}${num(have)}/${num(3)}</small>`;};
  return `<div style="position:relative">
    ${hint(P('الدعوة أولاً، ثم الجواب، ثم الكتاب الثاني','The invitation first, then the reply, then the second letter'),'0%','2%')}
    ${done?keyGlint('mushaqqar','40%','2%'):''}
    <h2 class="scene-title">${T('الجولة المعرفية: ديوان الرسائل','Knowledge round: the Letters Hall')}</h2>
    <p class="narr">${T('على جدار الديوان ثلاث فجوات لثلاث رسائل. اسحب كل رسالة إلى موضعها في التسلسل الزمني، من أول ما كُتب إلى آخره.','Three niches on the hall\'s wall await three letters. Drag each letter to its place in time, from the first written to the last.')}</p>
    ${c.anah?`<p class="narr anahfx" style="color:var(--parch)">${T('تأنّيتَ فتذكّرت: بعث النبي ﷺ بالدعوة، فأجاب المنذر وسأل، فجاءه الكتاب الثاني بالجواب.','You paused and remembered: the Prophet ﷺ sent the invitation, al-Mundhir replied and asked, and the second letter answered him.')}</p>`:''}
    <div class="tray" style="flex-direction:row;flex-wrap:wrap;margin-bottom:16px">${TLORDER.filter(d=>!st.timeline.includes(d)).sort().reverse().map(d=>`<button class="lcard dragit ${isSel(d)}" ${dragAttr('letter',d)}>${card(d)}</button>`).join('')}</div>
    <div class="tl">${[0,1,2].map(i=>st.timeline[i]?`<div class="tlslot ok"><span class="tln">${num(i+1)}</span><div class="lcard">${card(st.timeline[i])}</div></div>`
      :`<div class="tlslot dzone" ${dropAttr('tl:'+i)}><span class="tln">${num(i+1)}</span>${[T('أولاً','First'),T('ثانياً','Second'),T('ثالثاً','Third')][i]}</div>`).join('')}</div>
    <div class="row mt"><button class="btn ghost" data-act="files">${ic('folder')} ${T('افتح الجراب والملفات','Open satchel & files')}</button>${!done?rescue(['glue']):''}
      ${done?`<button class="btn" data-act="toCross">${T('اخرج من الديوان','Leave the hall')}</button>`:''}</div>
  </div>`;
};

const ROUTE_PTS={start:0,mid:.5,camel:.68,end:1};

      <rect x="250" y="20" width="300" height="180" rx="14" fill="#d4644f1f" stroke="#d4644f66" stroke-dasharray="6 6"/>

    ${c.anah?`<div class="scroll anahfx" style="margin-bottom:14px;font-size:17px">${T(`تأنّيتَ فانكشف لك: كانت العرب تكفّ عن القتال في ${W('hurum')}، ولذلك قال وفد عبد القيس للنبي ﷺ: «إنا لا نستطيع أن نأتيك إلا في الشهر الحرام، وبيننا وبينك هذا الحي من كفار مضر».`,`You paused, and it became clear: the Arabs refrained from fighting in the ${W('hurum')}, which is why the delegation said to the Prophet ﷺ: "We can only come to you in the sacred month, for between us and you is this tribe of the disbelievers of Mudar."`)}<div class="src">${T('صحيح البخاري (53)؛ صحيح مسلم (17). وهذا القول في الوفادة الأولى بحسب ابن حجر.','Sahih al-Bukhari 53; Sahih Muslim 17. Per Ibn Hajar, these words belong to the first delegation.')}</div></div>`:''}

SCREENS.ch3.after=()=>placeCaravan(st.ch.pos||0);
function placeCaravan(p){ const path=$('#rt'),cv=$('#cv'); if(!path||!cv) return; const pt=path.getPointAtLength(path.getTotalLength()*p); cv.setAttribute('transform',`translate(${pt.x} ${pt.y})`); }
function moveCaravan(to,cb){
  const c=st.ch, from=c.pos||0, dur=matchMedia('(prefers-reduced-motion: reduce)').matches?10:2600, t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; placeCaravan(from+(to-from)*e); if(k<1) requestAnimationFrame(step); else { c.pos=to; cb&&cb(); } };
  requestAnimationFrame(step);
}
function chooseMonth(i){
  const c=st.ch; if(c.step!=='month') return; c.m=i; c.step='travel'; c.retreat=0; render();
  if(SACRED.includes(i)){ st.log.month=i; moveCaravan(ROUTE_PTS.camel,()=>{ c.step='camel'; render(); }); }
  else moveCaravan(ROUTE_PTS.mid,()=>{ c.step='ambush'; sfx('gate'); if(st.armed.swords){ fight(); } else render(); });
}
function fight(){
  const c=st.ch; if(c.step!=='ambush') return; if(!usable('swords')) return;
  spend('swords'); st.armed.swords=0; st.log.swords=1; sfx('sword'); setTimeout(()=>sfx('sword'),260);
  c.step='month'; c.retreat=1; c.pos=0; render(); toast(T('قاتل ساوى بالسيفين ونجا','Sawa fought with both swords and survived'));
}

/* =================== activation =================== */
function activate(k){
  closeModal();
  const c=st.ch,s=st.screen;
  if(!owned(k)) return openAbility(k);
  if(k==='lamp'){ document.body.classList.toggle('lamp-on'); renderBar(); lampUpdate(lastPt.x,lastPt.y); sfx('click'); toast(document.body.classList.contains('lamp-on')?T('أُضيء المصباح: مرّره على الشاشة','Lamp lit: move it across the screen'):T('أُطفئ المصباح','Lamp off')); return; }
  if(k==='archive'){ openFiles(); return; }
  if(k==='dict'){ if(!usable('dict')) return openAbility(k); document.body.classList.toggle('dict-on'); renderBar(); toast(document.body.classList.contains('dict-on')?T('القاموس مفعّل: انقر أي كلمة مضاءة','Dictionary on: tap any highlighted word'):T('أُوقف القاموس','Dictionary off')); return; }
  if(!usable(k)) return openAbility(k);
  if(k==='chance'){
    if(!snap){ toast(T('لا محطة محفوظة بعد','No saved station yet')); return; }
    if(s==='over'||st.trapped||(s==='ch3'&&c.step==='ambush')||(s==='night'&&c.phase==='wolves')) return useChance();
    modal(`<div class="panel"><h3>${tr(ABIL.chance.n)}</h3><p>${T('ستعود إلى آخر محطة توقفت عندها، ويضيع ما فعلته بعدها من تقدّم، وتحتفظ بعملاتك وخصائصك.','You will return to your last station. Progress since then is lost; your coins and abilities stay.')}</p>
      <div class="row mt"><button class="btn" data-act="confirmChance">${T('عُد إلى آخر محطة','Return to last station')}</button><button class="btn ghost" data-act="close">${T('إلغاء','Cancel')}</button></div></div>`); return;
  }
  if(k==='swords'){
    if(s==='ch3'&&c.step==='ambush') return fight();
    if(s==='night'&&c.phase==='wolves') return wolfFight();
    if(st.armed.swords){ toast(T('السيفان مستلّان بالفعل','The swords are already drawn')); return; }
    st.armed.swords=1; sfx('sword'); renderBar(); toast(T('استُلّ السيفان: يقاتل بهما ساوى عند أول مواجهة','Swords drawn: Sawa will fight at the first confrontation')); return;
  }
  if(k==='timer'){
    const live=(s==='ch1'&&!c.done&&(c.running||c.failed))||(s==='ch2'&&c.adjust&&!c.pass)||(s==='palms'&&c.running);
    if(live){ spend('timer'); c.t+=30; if(s==='ch1'&&c.failed){c.failed=0;c.running=1;} sfx('coin'); render(); toast(T('أُضيفت 30 ثانية','30 seconds added')); return; }
    if(st.armed.timer){ toast(T('المؤقت مفعّل وينتظر','Time Keeper is already waiting')); return; }
    spend('timer'); st.armed.timer=1; renderBar(); toast(T('فُعّل المؤقت: تُضاف 30 ثانية عند بدء التحدي الموقوت القادم','Time Keeper active: +30 seconds when the next timer starts')); return;
  }
  if(k==='anah'){
    const now=(s==='night'&&c.phase==='choose')?false:(s==='ch2'&&!c.pass)||(s==='ch3'&&c.step&&c.step!=='arrive')||(s==='cross'&&!st.gates[st.stage])||s==='diwan'||(s==='palms'&&!c.done);
    if(now&&st.armed.anah&&!c.anah){ st.armed.anah=0; c.anah=1; startAnah(); render(); toast(T('تأنّيتَ فانكشفت لك حقائق','You paused and facts were revealed')); return; }
    if(now){ if(c.anah){ toast(T('انكشفت الحقائق بالفعل','The facts are already revealed')); return; } spend('anah'); c.anah=1; startAnah(); render(); toast(T('تأنّيتَ فانكشفت لك حقائق','You paused and facts were revealed')); return; }
    if(st.armed.anah){ toast(T('الأناة مفعّلة وتنتظر','Deliberation is already waiting')); return; }
    spend('anah'); st.armed.anah=1; startAnah(); renderBar(); toast(T('فُعّلت الأناة: تنكشف الحقائق في التحدي القادم','Deliberation active: facts revealed in the next challenge')); return;
  }
  if(k==='glue'){
    const v=versesHeld();
    if(st.frags.length||(s==='diwan'&&!st.timeline.every(Boolean))||(s==='poem'&&v.length)){
      spend('glue'); const n=classifyAll();
      if(s==='diwan') st.timeline=[...TLORDER];
      if(s==='poem') versesHeld().forEach(id=>st.poem[fragIdx(id)]=id);
      sfx('paper'); refresh(); toast(T(`عمل الغراء${n?`: صُنّفت ${num(n)} قطع في ملفاتها`:''}`,`Glue worked${n?`: ${n} pieces filed`:''}`)); return;
    }

  }
  if(k==='master'){
    if(st.trapped){ spend('master'); st.trapped=false; if(!st.doorsSeen.includes(st.cur)) st.doorsSeen.push(st.cur); if(!st.keys.includes(st.cur)&&!st.keySubs.includes(st.cur)) st.keySubs.push(st.cur); sfx('open'); render(); toast(T('فتح المفتاح البوابة','The Master Key opened the gate')); return; }

    spend('master'); st.armed.master=1; renderBar(); toast(T('فُعّل المفتاح: يفتح لك الباب الجانبي القادم','Master Key active: it will open your next side gate')); return;

/* lamp */
const lastPt={x:-999,y:-999};
function lampUpdate(x,y){
  const on=document.body.classList.contains('lamp-on'); const g=$('#glow'); if(on){g.style.left=x+'px';g.style.top=y+'px';}
  document.querySelectorAll('.hid').forEach(el=>{ if(!on){el.style.opacity='';return;} const r=el.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom); el.style.opacity=Math.max(.025,1-Math.hypot(dx,dy)/130).toFixed(2); });
}
['pointermove','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{lastPt.x=e.clientX;lastPt.y=e.clientY;if(document.body.classList.contains('lamp-on'))lampUpdate(e.clientX,e.clientY);},{passive:true}));
window.addEventListener('scroll',()=>lampUpdate(lastPt.x,lastPt.y),{passive:true});




/* =================== 20-minute journey clock =================== */
let clockWarned={};
function clockEl(){
  let el=$('#gclock');
  if(!el){ el=document.createElement('div'); el.id='gclock'; el.setAttribute('role','timer'); document.body.appendChild(el); el.addEventListener('click',()=>{ if(st.freeze>0) return; openAbility('anah'); }); }
  return el;
}
const fmt=sec=>{ sec=Math.max(0,sec); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); };
function clockRender(){
  const el=clockEl(), live=!['intro','win','rwheel','reader'].includes(st.screen);
  el.style.display=live?'':'none'; if(!live) return;
  const frac=Math.max(0,st.clock)/CLOCK_TOTAL, C2=2*Math.PI*17, fz=st.freeze>0;
  el.className=(fz?'frozen ':'')+(st.clock<=180?'low ':'')+(st.screen==='over'?'stopped':'');
  el.innerHTML=`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" class="rb"/><circle cx="20" cy="20" r="17" class="rf" style="stroke-dasharray:${C2};stroke-dashoffset:${C2*(1-frac)}"/>
      ${fz?`<circle cx="20" cy="20" r="12.5" class="ra" style="stroke-dasharray:${2*Math.PI*12.5};stroke-dashoffset:${2*Math.PI*12.5*(1-st.freeze/ANAH_FREEZE)}"/>`:''}</svg>
    <div class="gt"><small>${fz?T('الأناة: الوقت متوقف','Deliberation: time paused'):T('حتى تبلغ جواثى','Until Jawatha')}</small><b>${fz?ic('anah')+' '+num(st.freeze)+T(' ث',' s'):fmt(st.clock)}</b>${fz?`<span>${fmt(st.clock)}</span>`:''}</div>`;
  el.setAttribute('aria-label',T('الوقت المتبقي ','Time left ')+fmt(st.clock));
}
function clockTick(){
  if(['intro','win','over','rwheel','reader'].includes(st.screen)||!snap){ clockRender(); return; }
  if(st.freeze>0){ st.freeze--; if(st.freeze===0){ document.body.classList.remove('anah'); toast(T('انقضت لحظة الأناة، وعادت الساعة تدور','The moment of deliberation is over; the clock runs again')); } }
  else st.clock--;
  if(st.clock===300&&!clockWarned[300]){ clockWarned[300]=1; toast(T('بقيت خمس دقائق على بلوغ جواثى','Five minutes left to reach Jawatha'),3500); sfx('tick'); }
  if(st.clock===60&&!clockWarned[60]){ clockWarned[60]=1; toast(T('دقيقة واحدة! أسرع يا ساوى','One minute left! Hurry, Sawa'),3500); }
  if(st.clock<=30&&st.clock>0&&!st.freeze) sfx('tick');
  if(st.clock<=0){ st.clock=0; closeModal(); clearSaved(); snap=null; document.body.classList.remove('anah');
    gameOver(T('انقضت العشرون دقيقة، وأظلم الطريق قبل أن يبلغ ساوى جواثى. الرحلة سباق مع الوقت: اقرأ بقدر، وتأنَّ حين ينفعك التأني، ولا تُطل الوقوف حيث لا حاجة.','The twenty minutes have run out and the road fell dark before Sawa reached Jawatha. The journey races the clock: read in measure, deliberate when it helps, and do not linger where there is no need.'),{final:1,title:T('انقضى الوقت','Time is up')}); }
  clockRender(); if(st.clock%5===0) persist();
}
setInterval(clockTick,1000);

/* =================== Deliberation: freeze time, slow the world, reveal step by step =================== */
const ANAH_FREEZE=20;
function startAnah(){
  st.freeze=ANAH_FREEZE; document.body.classList.add('anah'); clockRender();
  const el=$('#gclock'); if(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  if(SND.ctx){ const t=SND.ctx.currentTime; [587.33,440,392,293.66].forEach((f,i)=>pluck(f,t+i*.35,.09,2.6)); }
}

  if(k==='ch3') return L.month!=null?T(`خرج في شهر ${tr(MONTHS[L.month])}${L.camel==='take'?'، وأخذ الإبل الضالة':L.camel==='leave'?'، وترك الإبل الضالة':''}`,`Set out in ${tr(MONTHS[L.month])}${L.camel==='take'?', took the stray camels':L.camel==='leave'?', left the stray camels':''}`):'';

      ${K.on?`<button class="btn" data-act="kFull">${T('ملء الشاشة','Full screen')}</button><button class="btn ghost" data-act="kReset">${T('ابدأ لزائر جديد','Reset for a new visitor')}</button><button class="btn danger" data-act="kOff">${T('أوقف وضع الكشك','Turn kiosk mode off')}</button>`
        :`<button class="btn" data-act="kOn">${T('فعّل وضع الكشك','Turn kiosk mode on')}</button>`}
      <button class="btn ghost" data-act="kStats">${T('صفّر الإحصاءات','Clear statistics')}</button>
      <button class="btn ghost" data-act="close">${T('إغلاق','Close')}</button></div></div>`,true,'admin');
}
ACT.kIdle=v=>{ K.idle=+v; kSave(); openAdmin(); };
ACT.kLang=v=>{ K.lang=v; kSave(); openAdmin(); };
ACT.kpinSet=()=>{ const v=(($('#knewpin')||{}).value||'').trim(); if(!/^\d{4,8}$/.test(v)){ toast(T('الرمز من 4 إلى 8 أرقام','The PIN must be 4 to 8 digits')); return; } K.pin=v; kSave(); toast(T('حُفظ الرمز الجديد','New PIN saved')); openAdmin(); };
ACT.kOn=()=>{ K.on=true; kSave(); kioskApply(); goFull(); resetVisitor(); toast(T('فُعّل وضع الكشك. للخروج: اضغط مطوّلاً على الساعة أو سطر الحقوق 3 ثوانٍ.','Kiosk mode on. To exit, press and hold the clock or the credit line for 3 seconds.'),5000); };
ACT.kOff=()=>{ K.on=false; kSave(); kioskApply(); hideIdle(); closeModal(); try{ document.fullscreenElement&&document.exitFullscreen(); }catch(e){} render(); toast(T('أُوقف وضع الكشك','Kiosk mode off')); };
ACT.kFull=()=>{ goFull(); closeModal(); };
ACT.kReset=()=>resetVisitor();
ACT.kStats=()=>{ K.started=0; K.completed=0; K.totalSec=0; kSave(); openAdmin(); };
ACT.kiosk=()=>openAdmin();
ACT.fullscreen=()=>{ try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else goFull(); }catch(e){} };

/* count visitors, enter full screen on start, show a touch prompt on the welcome screen */
const _kStart=ACT.start;
ACT.start=()=>{ if(K.on){ goFull(); K.started++; kSave(); } visitStart=Date.now(); _kStart(); };
const _kFinish=ACT.finish;
ACT.finish=()=>{ _kFinish(); if(K.on&&st.screen==='win'){ K.completed++; K.totalSec+=Math.round((CLOCK_TOTAL-st.clock)); kSave(); } };
const _kIntro=SCREENS.intro;
SCREENS.intro=()=>{
  let h=_kIntro();
  if(K.on) h=h.replace('<div class="row mt choose">',`<p class="ktouch">${T('اختر طريقك: اقرأ أو عِش','Choose your way: read it or live it')}</p><div class="row mt choose">`);
  else h=h.replace('<div class="introtools">',`<div class="introtools"><button class="chip btn2" data-act="fullscreen" title="${T('ملء الشاشة','Full screen')}" aria-label="${T('ملء الشاشة','Full screen')}">${ic('expand')}</button>`);
  return h;
};
/* in kiosk mode, a tap anywhere on the welcome image starts the journey */

kioskApply();


/* =================== reading path: the numbered wheel and the opened facts =================== */
const RNUMS=[1,5,10,15,20,25,30,35,40,45,50,55];
SCREENS.rwheel=()=>{
  const n=RNUMS.length,R=200,seg=360/n, c=st.ch; let g='';
  RNUMS.forEach((v,i)=>{
    const a0=(i*seg-90-seg/2)*Math.PI/180,a1=((i+1)*seg-90-seg/2)*Math.PI/180;
    g+=`<path d="M${R} ${R} L${R+R*Math.cos(a0)} ${R+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R+R*Math.cos(a1)} ${R+R*Math.sin(a1)}Z" fill="${c.res===v?'#EFA548':['#263A63','#1B2A4C'][i%2]}" stroke="#D2B87F" stroke-width="1.5"/>`;
    const am=(i*seg-90)*Math.PI/180, tx=R+R*.72*Math.cos(am), ty=R+R*.72*Math.sin(am), rot=-((c.rot||0)%360);
    g+=`<text x="${tx}" y="${ty}" fill="${c.res===v?'#2b1a06':'#E7D4A8'}" font-size="30" font-weight="700" font-family="IBM Plex Sans, IBM Plex Sans Arabic, sans-serif" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot} ${tx} ${ty})">${v}</text>`;
  });
  const cap=Math.min(c.res||0,KB.length);
  return `<div class="rtop"><button class="tbtn" data-act="home">${ic('back')} ${T('البداية','Home')}</button><button class="tbtn langb" data-act="lang">${lang==='ar'?'English':'العربية'}</button></div>
  <div class="wheel-wrap">
    <div class="wheel"><div class="ptr"></div><svg class="disc" id="disc" viewBox="0 0 400 400" style="transform:rotate(${c.rot||0}deg)">${g}</svg>
      <div class="hub">${c.res?`<span class="hubn">${c.res}</span>`:T('دوّر','Spin')}</div></div>
    <div>
      <p class="kicker">${T('من هنا تقرأ المعلومة','Here, you read it')}</p>
      <h2 class="scene-title">${T('عجلة المعرفة','The Wheel of Knowledge')}</h2>
      <p class="narr">${T('دوّر العجلة، فالرقم الذي تقف عنده هو عدد المعلومات التي تُفتح لك من خزانة المعرفة، تُختار لك من قصة دخول الإسلام إلى هجر.','Spin the wheel. The number it stops on is how many facts open for you from the Knowledge Vault, chosen for you from the story of Islam reaching Hajar.')}</p>
      ${c.res?`<div class="rres"><b>${num(cap)}</b><span>${cap===1?T('معلومة واحدة فُتحت لك','fact opened for you'):T('معلومة فُتحت لك','facts opened for you')}</span></div>
        <div class="row mt"><button class="btn big" data-act="rshow">${ic('books')} ${T('افتح خزانة المعرفة','Open the Knowledge Vault')}</button></div>`
      :`<div class="row mt"><button class="btn big" id="spinBtn" data-act="rspin">${T('دوّر العجلة','Spin the wheel')}</button></div>`}
    </div></div>`;
};
function rspin(){
  const c=st.ch; if(c.res||c.spinning) return;
  const i=Math.floor(Math.random()*RNUMS.length), seg=360/RNUMS.length, base=c.rot||0;
  const target=base+360*5+((360-i*seg)-(base%360)+360)%360;
  c.spinning=1; const b=$('#spinBtn'); if(b) b.disabled=true; $('#disc').style.transform=`rotate(${target}deg)`;
  if(SND.ctx){ let t=0,gap=.04; while(t<4){ tone(1700,.025,'square',.025,SND.ctx.currentTime+t); t+=gap; gap*=1.09; } }
  const fin=()=>{ c.spinning=0; c.rot=target; c.res=RNUMS[i];
    const ids=KB.map(k=>k.id); for(let j=ids.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [ids[j],ids[r]]=[ids[r],ids[j]]; }
    st.rd={ids:ids.slice(0,Math.min(c.res,KB.length)),seen:[]}; sfx('win'); render(); };
  matchMedia('(prefers-reduced-motion: reduce)').matches ? fin() : timers.push(setTimeout(fin,4300));
}
SCREENS.reader=()=>{
  const rd=st.rd||{ids:[],seen:[]};
  return `<div class="rtop"><button class="tbtn" data-act="home">${ic('back')} ${T('البداية','Home')}</button><button class="tbtn langb" data-act="lang">${lang==='ar'?'English':'العربية'}</button></div>
    <p class="kicker">${T('من هنا تقرأ المعلومة','Here, you read it')}</p>
    <h2 class="scene-title">${T('خزانة المعرفة','The Knowledge Vault')}</h2>
    <p class="scene-sub">${T(`فُتحت لك ${num(rd.ids.length)} من ${num(KB.length)} معلومة. قرأتَ منها ${num(rd.seen.length)}.`,`${rd.ids.length} of ${KB.length} facts opened for you. You have read ${rd.seen.length}.`)}</p>
<p class="bnote">${T('المقصود بـ«البحرين» في هذه المعلومات: الإقليم التاريخي الذي مركزه الأحساء وما حولها (هجر)، لا مملكة البحرين الحالية.','“Bahrain” in these facts means the historical region centred on al-Ahsa and its surroundings (Hajar), not the present-day Kingdom of Bahrain.')}</p>
    <div class="cards">${rd.ids.map(id=>{const k=KB[id],r=rd.seen.includes(id);return `<button class="kcard ${r?'read':''}" style="--c:var(--sec-${k.sec})" data-act="ropen" data-arg="${id}"><b>${tr(k.t)}</b><span>${tr(k.c)}</span>
      <span class="ft"><span>${tr(CAT[k.cat])} · ${tr(SEC[k.sec])}</span>${r?`<span class="got">${T('قُرئت','Read')}</span>`:''}</span></button>`;}).join('')}</div>
    <div class="rend"><p>${T('قرأتَها؟ والآن عِشها.','You have read it. Now live it.')}</p>
      <div class="row"><button class="btn big" data-act="start">${ic('compass')} ${T('وهنا تعيشها: ابدأ رحلة ساوى','And here, you live it: begin Sawa\'s journey')}</button><button class="btn ghost" data-act="home">${T('العودة إلى البداية','Back to the start')}</button></div></div>`;
};
function ropen(id){
  const rd=st.rd; if(!rd) return; id=+id; if(!rd.seen.includes(id)){ rd.seen.push(id); }
  const k=KB[id], pos=rd.ids.indexOf(id), prev=rd.ids[pos-1], next=rd.ids[pos+1];
  modal(`<div class="panel kread"><div class="row" style="justify-content:space-between"><span class="tag" style="background:var(--sec-${k.sec});color:#fff">${tr(SEC[k.sec])} · ${tr(CAT[k.cat])}</span><span class="sub" style="margin:0">${num(pos+1)} / ${num(rd.ids.length)}</span></div>
    <div class="scroll"><h3>${tr(k.t)}</h3><div>${tr(k.c).replace(/\n/g,'<br>')}</div>${k.r?`<div class="rel">${tr(k.r)}</div>`:''}<div class="src">${tr(k.s)}</div></div>
    <div class="row mt">${prev!=null?`<button class="btn ghost" data-act="ropen" data-arg="${prev}">${T('السابقة','Previous')}</button>`:''}${next!=null?`<button class="btn" data-act="ropen" data-arg="${next}">${T('التالية','Next')}</button>`:''}
      <button class="btn ghost" data-act="rclose">${T('عُد إلى القائمة','Back to the list')}</button></div></div>`,false,'reader');
  sfx('paper');
}
ACT.readStart=()=>{ audioInit(); clearSaved(); st=fresh(); snap=null; st.screen='rwheel'; st.ch={}; render(); window.scrollTo({top:0}); };
ACT.rspin=()=>rspin();
ACT.rshow=()=>{ st.screen='reader'; st.ch={}; render(); window.scrollTo({top:0}); };
ACT.ropen=id=>ropen(id);
ACT.rclose=()=>{ closeModal(); render(); };
ACT.home=()=>{ closeModal(); st=fresh(); snap=null; render(); window.scrollTo({top:0}); };

render();

</script>
</body>
