<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطريق إلى جواثى · The Road to Jawatha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#121E3A; --night2:#1B2A4C; --night3:#263A63; --line:#ffffff1f;
  --moon:#EEF1F6; --moon-dim:#AEB9CE;
  --parch:#E7D4A8; --parch2:#D2B87F; --ink:#3B2414; --ink-soft:#6E4A2C;
  --date:#7A4524; --palm:#5E9070; --ember:#EFA548; --danger:#D4644F;
  --sec-b:#5E9070; --sec-w:#4F86C6; --sec-d:#E39A55;
  --ui:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --doc:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="en"]{ --ui:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",sans-serif; --doc:"IBM Plex Serif",Georgia,serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#101B35; } }
:root[data-theme="dark"]{ --night:#101B35; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:#121E3A;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--moon);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff8 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 30%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 88% 40%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 14%,#fff8 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 52%,#fff5 50%,transparent 51%),
    radial-gradient(ellipse at 50% 120%,#2b3f6e 0%,transparent 60%),linear-gradient(180deg,#0e1830 0%,var(--night) 55%,#18264a 100%);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
h1,h2,h3,h4{font-weight:600;letter-spacing:0}
.doc{font-family:var(--doc)}

/* ---------- bar ---------- */
#bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0c162ef7,#121e3aee);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
#bar .top{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
#bar .brand{font-weight:700;font-size:17px;color:var(--parch);white-space:nowrap}
#bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.key{color:#ffffff55;border-style:dashed}
.chip.key.has{color:var(--parch);border-style:solid;border-color:#d2b87f88;background:#d2b87f14}
.chip.coins{color:#2b1a06;background:var(--ember);border-color:var(--ember);font-weight:600}
.chip.btn2:hover{border-color:var(--parch2)}
.keys{display:flex;gap:6px}
#bar .abil{display:flex;gap:4px;padding:2px 12px 8px;overflow-x:auto;scrollbar-width:thin}
.slot-ab{position:relative;flex:none;width:72px;border:none;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.slot-ab .ic{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #ffffff33;background:#ffffff0a;transition:all .2s}
.slot-ab .ic svg{width:21px;height:21px}
.slot-ab .nm{font-size:11.5px;color:var(--moon-dim);line-height:1.2;text-align:center;min-height:2.4em}
.slot-ab .n{position:absolute;bottom:-4px;inset-inline-start:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--parch);color:#2b1a06;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.slot-ab:hover .ic{border-color:var(--parch2)}
.slot-ab.locked .ic{border-style:dashed;opacity:.4}
.slot-ab.locked .nm{opacity:.55}
.slot-ab.empty .ic{opacity:.5}
.slot-ab.armed .ic,.slot-ab.lit .ic{background:var(--ember);color:#2b1a06;border-color:var(--ember);box-shadow:0 0 0 4px #efa54833}
.slot-ab.useful .ic{border-color:var(--ember);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px #efa54833}}

/* ---------- stage ---------- */
#stage{max-width:1180px;margin:0 auto;padding:24px 18px 48px;min-height:70vh;position:relative}
.scene-title{font-size:clamp(25px,3.6vw,36px);font-weight:700;margin:4px 0 4px;color:var(--parch);line-height:1.3}
.scene-sub{color:var(--moon-dim);font-size:14.5px;margin:0 0 18px}
.narr{font-family:var(--doc);font-size:clamp(17.5px,2vw,20px);line-height:1.95;max-width:68ch}
html[lang="en"] .narr{line-height:1.7}
.scroll{background:linear-gradient(170deg,var(--parch) 0%,#dcc590 60%,var(--parch2) 100%);color:var(--ink);border-radius:3px 14px 3px 14px;
  padding:18px 22px;font-family:var(--doc);font-size:18.5px;line-height:1.9;box-shadow:inset 0 0 40px #7a452430,0 6px 22px #0006;position:relative}
html[lang="en"] .scroll{line-height:1.65;font-size:17.5px}
.scroll h3{font-family:var(--ui);margin:0 0 6px;font-size:19px;color:var(--date)}
.src{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
.btn{border:none;border-radius:999px;padding:11px 24px;font-size:16px;font-weight:600;background:var(--ember);color:#2b1a06;transition:transform .15s,filter .15s;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--parch);border:1.5px solid var(--parch2)}
.scroll .btn.ghost,.trap .btn.ghost{color:inherit;border-color:currentColor}
.btn.dark{background:var(--night);color:var(--parch);border:1.5px solid var(--ember)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 14px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:18px}

/* hidden ink */
.hid{opacity:.025;transition:opacity .12s linear;pointer-events:none;font-family:var(--doc);color:var(--ember)}
body.lamp-on .hid{text-shadow:0 0 12px #efa54888}
.hid.wall{position:absolute;font-size:clamp(17px,2vw,21px);max-width:32ch;line-height:1.7;z-index:2}
#glow{position:fixed;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;z-index:25;
  background:radial-gradient(circle,#ffd99a45 0%,#efa5481f 35%,transparent 70%);display:none}
body.lamp-on #glow{display:block}
body.lamp-on #stage::after{content:"";position:fixed;inset:0;background:#05091480;pointer-events:none;z-index:1}

/* glossary words */
.w{border-bottom:1.5px dotted currentColor;cursor:help}
.w.known{border-bottom:1.5px solid var(--palm)}
body.dict-on .w{background:#5e907033;border-radius:3px;border-bottom-style:solid}

/* fragments & keys */
.frag{position:absolute;z-index:3;width:70px;height:56px;border:none;background:none;padding:0;transform:rotate(var(--r,-6deg))}
.frag svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px #0008)}
.frag:hover{transform:rotate(var(--r,-6deg)) scale(1.1)}
.frag::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid #e7d4a866;animation:pulse 2.4s infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
.keydrop{display:inline-flex;align-items:center;gap:10px;background:var(--night);border:1.5px solid var(--ember);color:var(--parch);border-radius:999px;padding:10px 18px;font-size:15.5px;font-weight:600;animation:float 2.6s ease-in-out infinite}
.keydrop svg{width:24px;height:24px}
.keyheld{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:14px;color:var(--palm);font-weight:600}
.keyheld svg{width:18px;height:18px}
@keyframes float{50%{transform:translateY(-4px)}}

/* toast + modal */
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;z-index:80;
  background:var(--parch);color:var(--ink);padding:11px 20px;border-radius:12px;font-size:15px;box-shadow:0 8px 30px #0008;transition:all .3s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#060b18c4;padding:16px}
#modal.show{display:grid}
#modal .box{max-width:600px;width:100%;max-height:88vh;overflow:auto;border-radius:16px}
#modal .box.wide{max-width:1000px}
.panel{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:20px 22px;color:var(--moon)}
.panel h3{margin:0 0 4px;font-size:21px;color:var(--parch)}
.panel .scroll h3{color:var(--date);font-size:19px}
.panel .sub{color:var(--moon-dim);font-size:14px;margin:0 0 14px}
.pop{position:fixed;z-index:70;max-width:300px;background:var(--night2);border:1.5px solid var(--palm);color:var(--moon);padding:12px 14px;border-radius:10px;font-family:var(--doc);font-size:16.5px;line-height:1.75;box-shadow:0 8px 24px #0009}
.pop b{font-family:var(--ui);color:var(--parch)}

/* ability sheet / shop */
.absheet{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start}
.absheet .bigic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ember);color:#2b1a06}
.absheet .bigic svg{width:32px;height:32px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#ffffff12;color:var(--moon-dim)}
.tag.on{background:#efa54833;color:var(--ember)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ware{border:1px solid var(--line);border-radius:12px;padding:14px;background:#ffffff06;display:flex;flex-direction:column;gap:8px}
.ware .hd{display:flex;gap:10px;align-items:center}
.ware .hd .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--parch2);color:var(--parch);flex:none}
.ware .hd .ic svg{width:19px;height:19px}
.ware b{color:var(--parch);display:block;margin-bottom:3px}
.ware p{margin:0;font-size:13.5px;color:var(--moon-dim);line-height:1.6;flex:1}
.price{font-weight:700;color:var(--ember)}

/* library */
.lib-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:transparent;color:var(--moon-dim);border-radius:999px;padding:5px 12px;font-size:13px}
.fbtn.on{background:var(--parch);color:var(--ink);border-color:var(--parch)}
.fbtn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.kcard{text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--c);background:#ffffff07;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.kcard:hover{background:#ffffff10}
.kcard b{color:var(--parch);font-size:15.5px;line-height:1.4}
.kcard span{font-size:13px;color:var(--moon-dim);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--moon-dim);margin-top:auto}
.kcard.read{opacity:.6}
.kcard .got{color:var(--palm);font-weight:600}
.kread .scroll{margin-top:10px}
.kread .rel{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);border-top:1px solid #7a452433;margin-top:10px;padding-top:8px}
.progress{height:6px;border-radius:3px;background:#ffffff18;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--ember);width:0;transition:width 1s linear}

/* intro */
.hero{position:relative;border-radius:8px;overflow:hidden;min-height:min(78vh,640px);display:flex;align-items:flex-end;justify-content:flex-end;
  background:#0d1630 center/cover no-repeat;box-shadow:0 20px 60px #0009}
html[dir="ltr"] .hero{justify-content:flex-start}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0c1530f5 0%,#0c1530cc 32%,transparent 58%),linear-gradient(0deg,#0c1530e6 0%,transparent 40%)}
.hero .in{position:relative;padding:clamp(22px,4vw,48px);max-width:520px}
.hero h1{font-size:clamp(42px,7vw,84px);line-height:1.1;margin:0 0 14px;color:var(--parch);font-weight:700}
.hero h1 small{display:block;font-size:.3em;color:var(--moon-dim);font-weight:400;margin-bottom:10px;letter-spacing:0}
.credit{color:#ffffff70;font-size:12.5px;margin-top:22px}
@media (max-width:700px){.hero::before{background:linear-gradient(0deg,#0c1530fa 0%,#0c1530d9 55%,transparent 85%)}.hero .in{max-width:none}}
.introtools{position:absolute;top:14px;inset-inline-end:14px;z-index:3;display:flex;gap:8px}

/* wheel */
.wheel-wrap{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:34px;align-items:center}
@media (max-width:820px){.wheel-wrap{grid-template-columns:1fr}}
.wheel{position:relative;width:100%;aspect-ratio:1}
.wheel svg.disc{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--ember);filter:drop-shadow(0 3px 4px #0008);z-index:2}
.wheel .hub{position:absolute;inset:40%;border-radius:50%;background:var(--night);border:3px solid var(--parch2);display:grid;place-items:center;text-align:center;font-size:14px;color:var(--parch);font-weight:600}
.dots{display:flex;gap:8px;margin:10px 0 16px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ember)}
.dots i.u{background:#ffffff22}
.won{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.won .bigic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ember);color:#2b1a06;flex:none}
.won .bigic svg{width:26px;height:26px}

/* cross */
.cross{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:860px){.cross{grid-template-columns:1fr}}
.dest{display:flex;flex-direction:column;gap:12px}
.gate{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:start;padding:14px 16px;border-radius:12px 12px 4px 4px;
  border:1.5px solid var(--line);background:#ffffff08;transition:border-color .2s,background .2s}
.gate:hover{border-color:var(--parch2);background:#d2b87f12}
.gate.main{border-color:var(--ember);background:#efa54814}
.gate .arch{width:52px;height:60px}
.gate h4{margin:0 0 2px;font-size:17px;color:var(--parch)}
.gate p{margin:0;font-size:13.5px;color:var(--moon-dim);line-height:1.6}
.st{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.ok{background:#5e907033;color:#a9d6b2}
.st.no{background:#d4644f2e;color:#f3a596}
.st.go{background:var(--ember);color:#2b1a06}

/* ch1 */
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media (max-width:860px){.ch-grid{grid-template-columns:1fr}}
.spring{position:relative;height:300px;border-radius:50% 50% 10px 10px/30% 30% 10px 10px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 72%,#3d7fa2 0%,#1f4f73 30%,#173a5a 46%,#3a2c1c 47%,#5a4026 62%,#2b1f14 100%)}
.spring .rip{position:absolute;left:50%;top:72%;width:60px;height:22px;margin:-11px 0 0 -30px;border:2px solid #9fd2ef88;border-radius:50%;animation:rip 3s infinite}
.spring .rip:nth-child(2){animation-delay:1s}.spring .rip:nth-child(3){animation-delay:2s}
@keyframes rip{to{transform:scale(4.5);opacity:0}}
.spring .lbl{position:absolute;top:16px;inset-inline:0;text-align:center;font-size:20px;color:var(--parch);font-weight:600}
.vessels{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.vessel{flex:1;min-width:110px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#ffffff08;text-align:center}
.vessel.sel{border-color:var(--ember);background:#efa5481c}
.vessel b{display:block;font-size:16px;color:var(--parch)}
.vessel small{color:var(--moon-dim)}
.jars{display:flex;gap:24px;justify-content:center;align-items:flex-end}
.jar{text-align:center}
.jar svg{width:140px;height:186px}
.jar .lv{font-size:14.5px;color:var(--parch);margin-top:4px;font-variant-numeric:tabular-nums}
.clock{font-size:40px;font-weight:700;color:var(--parch);font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--danger)}
.pour{width:100%;justify-content:center;padding:15px;font-size:18px}
.splash{animation:splash .5s}
@keyframes splash{50%{transform:translateY(-6px) scale(1.04)}}

/* ch2 */
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:22px 18px 30px;border-radius:6px;
  background:linear-gradient(180deg,#3b2717 0%,#2d1d11 100%);box-shadow:inset 0 -14px 0 #5a3a20,inset 0 -18px 0 #2a190c}
@media (max-width:820px){.shelf{grid-template-columns:repeat(2,1fr)}}
.pot{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--parch)}
.pot svg{width:100%;max-width:120px;height:130px}
.pot .nm{font-size:18px;font-weight:600}
.pot .fact{font-family:var(--doc);font-size:15px;line-height:1.7;color:#f1dfb7;text-align:center}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid #ffffff30;background:#00000030;border-radius:999px;padding:6px 14px;font-size:14px}
.yn button.on.acc{background:var(--palm);border-color:var(--palm);color:#fff}
.yn button.on.rej{background:var(--danger);border-color:var(--danger);color:#fff}

/* diwan / poem */
.diwan{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.diwan{grid-template-columns:1fr}}
.tray{display:flex;flex-direction:column;gap:10px}
.piece{position:relative;text-align:start;border:none;padding:12px 14px 24px;background:linear-gradient(160deg,var(--parch),var(--parch2));color:var(--ink);
  font-family:var(--doc);font-size:16px;line-height:1.8;box-shadow:0 4px 12px #0007;clip-path:polygon(0 4%,8% 0,30% 3%,55% 0,80% 4%,100% 0,98% 50%,100% 96%,70% 100%,40% 96%,15% 100%,0 95%)}
.piece.sel{outline:3px solid var(--ember);outline-offset:-3px}
.piece .pt{position:absolute;bottom:3px;inset-inline-start:14px;font-family:var(--ui);font-size:12px;color:#b44a12;text-shadow:none}
.letters{display:grid;gap:18px}
.letter h4{margin:0 0 8px;font-size:17px;color:var(--parch)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:700px){.slots{grid-template-columns:1fr}}
.slotd{min-height:88px;border:1.5px dashed #e7d4a855;border-radius:8px;background:#ffffff06;color:var(--moon-dim);font-size:13px;padding:10px;text-align:start}

/* ---------- journey clock ---------- */

#gclock .ra{fill:none;stroke:#8fd3ff;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
#gclock .gt{display:flex;flex-direction:column;line-height:1.15;font-family:var(--ui)}

/* ---------- deliberation: the world slows and facts surface step by step ---------- */
.anahfx,body.anah .fact,body.anah .sacred-r{animation:anahIn 2.6s cubic-bezier(.2,.6,.2,1) both}
.fact:nth-of-type(1){animation-delay:0s}
.pot:nth-child(2) .fact{animation-delay:.6s}.pot:nth-child(3) .fact{animation-delay:1.2s}.pot:nth-child(4) .fact{animation-delay:1.8s}
@keyframes anahIn{0%{opacity:0;filter:blur(10px);clip-path:inset(0 0 100% 0)}45%{opacity:.6;filter:blur(3px)}100%{opacity:1;filter:none;clip-path:inset(0 0 0 0)}}
.anahchoice{border-color:#8fd3ff66!important}
.anahchoice:hover{border-color:#8fd3ff!important}
/* ---------- the dark-night crossing ---------- */
.nightscene{position:relative;height:min(360px,58vw);border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#05070f,#0b1222 60%,#11131a);box-shadow:inset 0 0 60px #000}
.nightscene > *{position:absolute}
.ns-day{inset:0;background:linear-gradient(180deg,#3a5a8c 0%,#c98d6a 62%,#e6b06a 100%);opacity:0;transition:opacity 3s}
.ns-sun{left:50%;bottom:-90px;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0%,#ffcf6b 45%,#f39a4a 70%,transparent 72%);box-shadow:0 0 120px 40px #ffb45a66;opacity:0;transition:bottom 3.2s cubic-bezier(.3,.1,.2,1),opacity 1.5s}
.ns-cloud{border-radius:50%;background:#1a2133;filter:blur(14px);transition:transform 2.6s ease-in,opacity 2.6s;animation:drift 9s ease-in-out infinite alternate}
.c1{width:60%;height:120px;top:-30px;left:-10%}.c2{width:55%;height:110px;top:-20px;right:-8%;animation-delay:-3s}
.c3{width:45%;height:90px;top:40px;left:25%;background:#141a29;animation-delay:-5s}.c4{width:40%;height:80px;top:30px;right:20%;background:#20283b}
@keyframes drift{to{margin-left:30px}}
.ns-rain{inset:0;opacity:0;background:repeating-linear-gradient(104deg,transparent 0 9px,#9fc4ee55 9px 10px,transparent 10px 22px);background-size:120px 120px;animation:rain .35s linear infinite;transition:opacity .8s}
@keyframes rain{to{background-position:-30px 120px}}
.ns-flash{inset:0;background:#dfe9ff;opacity:0}
.ns-wolves{left:0;right:0;bottom:24%;height:60px}
.wolf{position:absolute;width:96px;height:48px;bottom:0;left:-120px;opacity:0}
.wolf svg{width:100%;height:100%}
.w2{bottom:10px;width:84px}.w3{bottom:-6px;width:90px}
.wolf .eye{animation:eye 1.4s ease-in-out infinite}
@keyframes eye{50%{opacity:.2}}
.ns-ground{left:0;right:0;bottom:0;width:100%;height:32%;fill:#06080e;transition:fill 3s}
.ns-sawa{bottom:14%;right:8%;width:130px}
.ns-sawa svg{width:100%;height:auto}
.ns-sawa g{fill:#04060c}
html[dir="rtl"] .ns-sawa svg{transform:scaleX(-1)}
.ns-sawa .leg,.ns-sawa .tail,.ns-sawa .cloak{animation-play-state:paused}
.ns-cap{left:0;right:0;top:14px;text-align:center;color:#f1e3c2;font-family:var(--doc);font-size:clamp(16px,2.2vw,21px);text-shadow:0 2px 8px #000;opacity:0}
.ns-cap.show{animation:capIn 4s ease both}
@keyframes capIn{0%{opacity:0;transform:translateY(8px)}15%,85%{opacity:1;transform:none}100%{opacity:.85}}
/* phases */
.nightscene.p1 .wolf{animation:prowl 4s linear forwards}
.nightscene.p1 .w2{animation-delay:.5s}.nightscene.p1 .w3{animation-delay:1s}
@keyframes prowl{0%{left:-120px;opacity:1}100%{left:calc(100% + 40px);opacity:1}}
.nightscene.p2 .ns-rain{opacity:1}
.nightscene.p2 .ns-flash{animation:lightning 4.4s steps(1) 1}
@keyframes lightning{0%,100%{opacity:0}20%{opacity:.7}22%{opacity:0}24%{opacity:.5}26%{opacity:0}}
.nightscene.p2 .ns-cloud{background:#0e131f}
.nightscene.p3 .ns-cloud,.nightscene.p4 .ns-cloud{transform:translateY(-140px) scale(.8);opacity:0}
.nightscene.p3 .ns-day{opacity:.35}
.nightscene.p4 .ns-day{opacity:1}
.nightscene.p4 .ns-sun{bottom:70px;opacity:1}
.nightscene.p1 .ns-wolves{bottom:36%;transform:scale(.6);transform-origin:left bottom;opacity:.85}

.nightscene.done .ns-sawa .leg,.nightscene.done .ns-sawa .tail,.nightscene.done .ns-sawa .cloak{animation-play-state:running}
.nightscene.attack{animation:shakeS .5s 2}
.nightscene.attack .wolf{opacity:1;animation:pounce 1s cubic-bezier(.3,.1,.2,1) forwards}
.nightscene.attack .w1{--tx:58%}.nightscene.attack .w2{--tx:64%;animation-delay:.15s}.nightscene.attack .w3{--tx:52%;animation-delay:.3s}
@keyframes pounce{from{left:-120px}to{left:var(--tx)}}
.nightscene.attack::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px #c2513f88}
@keyframes shakeS{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#bar .top{display:flex;align-items:center;gap:6px;padding:8px 16px;padding-left:178px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#bar .top::-webkit-scrollbar{display:none}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:7px;flex:none;border:1px solid var(--line);background:#ffffff08;border-radius:12px;padding:8px 12px;font-size:14px;color:var(--moon)}
.tbtn svg{width:19px;height:19px;flex:none}
.tbtn:hover{border-color:var(--parch2);background:#d2b87f14}
.tbtn .bdg{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ffffff1a;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px;color:var(--parch)}
.tbtn .bdg.coin{background:var(--ember);color:#2b1a06}
.tbtn .bdg.coin svg{width:13px;height:13px}
.tbtn.useful{border-color:var(--ember);box-shadow:0 0 0 3px #efa54826}
.tbtn.off{opacity:.45}
.tbtn.warn{border-color:var(--danger)}
.tbtn.langb{font-weight:600;margin-inline-start:auto}

#rail{position:fixed;z-index:31;top:50%;inset-inline-start:10px;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px 7px;border-radius:16px;background:#0b1530ee;border:1px solid var(--line);box-shadow:0 8px 24px #0007}
#rail .tbtn{flex-direction:column;gap:3px;width:62px;padding:9px 4px;font-size:11px;text-align:center;border-radius:12px}
#rail .tbtn .tl{display:block;line-height:1.2}
#rail .tbtn svg{width:22px;height:22px}
#rail .tbtn .bdg{position:absolute;top:-6px;inset-inline-end:-6px;min-width:22px;height:18px;font-size:10.5px;background:var(--night3)}
#rail .rsp{height:4px;border-top:1px solid var(--line);margin:2px 6px}
#stage{padding-inline-start:96px}
#stage.full{max-width:none;margin:0;padding:0}
#stage.full .hero{min-height:100vh;min-height:100dvh;border-radius:0;box-shadow:none}
#stage.full .hero .in{padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
@media (max-width:700px){
  #rail{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;right:auto;inset-inline-start:auto;transform:translateX(-50%);flex-direction:row;padding:6px}
  #rail .tbtn{width:58px;padding:6px 2px}
  #rail .rsp{display:none}
  #stage{padding-inline-start:18px;padding-bottom:110px}
  #bar .top{padding-left:118px}
}
.kicker{margin:0 0 2px;color:var(--ember);font-size:14px;font-weight:600;letter-spacing:.01em}
.guardscene,.lockscene{max-width:860px;margin:0 auto}
.guardscene .gatebox{margin-top:20px;padding:22px 24px 40px;background:#ffffff0a}
.guardscene .gatebox.solved{padding-bottom:20px}
.guardscene .gatebox h4{font-size:19px}
.btn.big{padding:14px 30px;font-size:18px}
.lockscene .mgate svg{width:min(260px,60vw)}
.keyring{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.keypick{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--parch2);background:#ffffff0a;color:var(--parch)}
.keypick svg{width:30px;height:30px}
.keypick b{font-size:15px}
.keypick small{font-size:12px;color:var(--moon-dim);max-width:180px;text-align:center}
.keypick:hover{background:#d2b87f1f;transform:translateY(-2px)}
.keypick.master{border-color:var(--ember)}
.sech{margin:16px 0 8px;color:var(--parch);font-size:15.5px;font-weight:600}
.keys2{display:grid;gap:8px}
.keycard{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#ffffff07}
.keycard .kic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #ffffff33;color:var(--moon-dim)}
.keycard .kic svg{width:20px;height:20px}
.keycard.has .kic{border-color:var(--ember);color:var(--ember)}
.keycard.sub .kic{border-color:var(--palm);color:#a9d6b2}
.keycard b{display:block;color:var(--parch);font-size:15.5px}
.keycard span{display:block;color:var(--moon);font-size:14px;margin-top:2px}
.keycard small{display:block;color:var(--moon-dim);font-size:13px;margin-top:3px}
.keycard.miss{opacity:.8}
.ware.hot{border-color:var(--ember)}
.ware .tag{display:inline-block;margin-top:2px}
/* typography in pop-up windows and document views */
.panel{font-size:16.5px;line-height:1.8}
.panel h3{font-size:22px;font-weight:600;line-height:1.4}
.panel .sub{font-size:15px;line-height:1.75}
.panel .gate p{line-height:1.65}
.fparts{font-family:var(--doc);font-size:18px;line-height:2.05;padding:12px 16px}
.fparts p+p{margin-top:4px}
html[lang="en"] .fparts{font-size:16.5px;line-height:1.7}
.piece{font-size:17px;line-height:1.95}
html[lang="en"] .piece{font-size:16px;line-height:1.6}
.kread .scroll{font-size:19.5px;line-height:2.05;padding:20px 24px}
html[lang="en"] .kread .scroll{font-size:17.5px;line-height:1.7}
.kread .scroll h3{font-size:21px;margin-bottom:10px}
.kread .rel{font-size:14.5px;line-height:1.85}
.lm .scroll{font-size:19.5px;line-height:2.05;padding:20px 24px}
html[lang="en"] .lm .scroll{font-size:17.5px;line-height:1.7}
.lm .scroll h3{font-size:21px}
.src{font-size:13px}
#bar .top .tbtn{flex-direction:column;gap:2px;padding:6px 12px;min-width:76px;font-size:11.5px;line-height:1.2}
#bar .top .tbtn .tl{display:block}
#bar .top .tbtn .bdg{position:absolute;top:-5px;inset-inline-end:-4px;height:18px;font-size:10.5px;background:var(--night3)}
#bar .top .tbtn .bdg.coin{background:var(--ember)}
#bar .top .langb{flex-direction:row;font-size:14px;min-width:0;padding:10px 14px}
@media (max-width:700px){#bar .top .tbtn{min-width:58px;padding:6px 6px}#bar .top .tbtn .tl{font-size:10px}}

.reward .plus{display:inline-block;margin-inline-start:8px;padding:2px 10px;border-radius:999px;background:var(--ember);color:#2b1a06;font-size:15px}
.hero h1{margin-bottom:10px}
.tagline{margin:0;font-family:var(--doc);font-size:clamp(20px,2.4vw,28px);line-height:1.6;color:#f1e3c2}
html[lang="en"] .tagline{font-style:italic}
.hero .choose{gap:14px;margin-top:30px}
.hero .choose .pick{min-width:220px;justify-content:center}
.hero .choose .pick.ghost{background:#0c1530b3;backdrop-filter:blur(4px)}
#stage.bare{padding-inline-start:18px}
#stage.full .hero .in{max-width:640px}
@media (max-width:700px){.hero .choose .pick{min-width:0;flex:1 1 100%}}
.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.rtop .tbtn{padding:9px 14px}
.hubn{font-size:clamp(26px,4vw,40px);color:var(--ember);font-weight:700}
.rres{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.rres b{font-size:64px;line-height:1;color:var(--ember)}
.rres span{font-size:18px;color:var(--parch)}
.rend{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.rend p{margin:0 0 12px;font-family:var(--doc);font-size:20px;color:var(--parch)}

/* ---------- welcome title ---------- */
.htitle{margin:0;font-family:'JHead','JTitle',serif;font-weight:400;font-size:clamp(56px,7.6vw,112px);line-height:1.3;white-space:nowrap;letter-spacing:0;
  background:linear-gradient(180deg,#fff3d1 0%,#f1cf86 48%,#c8913f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 #5a3a1a) drop-shadow(0 10px 24px #000c);animation:tIn 1.3s cubic-bezier(.2,.7,.2,1) both}
html[lang="en"] .htitle{font-size:clamp(46px,6.4vw,92px);line-height:1.15}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}}
.orn{display:flex;align-items:center;gap:12px;width:min(100%,460px);margin:6px 0 12px;animation:tIn 1.3s .3s both}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e7c27a)}
.orn i:last-child{background:linear-gradient(270deg,transparent,#e7c27a)}
.orn svg{width:24px;height:24px;fill:none;stroke:#e7c27a;stroke-width:1.6}
.orn svg circle{fill:#e7c27a;stroke:none}
.hero .tagline{font-family:'JTitle','Amiri',serif;font-weight:400;font-size:clamp(22px,2.4vw,32px);color:#f4e6c4;font-style:normal;animation:tIn 1.3s .45s both}
#stage.full .hero .in{max-width:820px}
.htitle{display:inline-block;width:max-content;max-width:none;padding-inline-end:.08em}
html[lang="en"] .hero .tagline{font-style:normal}
.hlogo{filter:drop-shadow(0 2px 6px #000) drop-shadow(0 0 18px #0009)}
.hlogo{position:absolute;top:18px;inset-inline-start:22px;z-index:3;width:clamp(150px,16vw,230px);height:auto;filter:drop-shadow(0 2px 10px #0009)}
.wlogo{display:block;width:180px;height:auto;margin-top:18px}
@media (max-width:700px){.htitle{font-size:12.4vw;white-space:normal;width:auto;display:block}.orn{margin-inline:auto}.hero .in{text-align:center}.hero .tagline{text-align:center}.hlogo{width:170px;top:58px;inset-inline-start:50%;transform:translateX(50%)}html[dir="ltr"] .hlogo{transform:translateX(-50%)}}

.scene-title,.hero h1:not(.htitle){font-family:'JHead','IBM Plex Sans Arabic',sans-serif;font-weight:400;letter-spacing:0;line-height:1.35}
.scene-title{font-size:clamp(28px,3.8vw,40px)}
.hero h1:not(.htitle) small{font-family:var(--ui);font-weight:400}
.bnote{margin:0 0 12px;padding:8px 12px;border-inline-start:3px solid var(--ember);background:#efa54812;border-radius:6px;font-size:13.5px;color:var(--moon-dim);line-height:1.7}
</style>
</head>

<div id="modal" role="dialog" aria-modal="true"><div class="box"></div></div>

const KB = [{"id": 0, "t": {"ar": "هَجَر", "en": "Hajar"}, "c": {"ar": "هَجَر: اسم لإقليم البحرين في الصدر الأول (ويدخل فيه الأحساء اليوم وما جاورها من الساحل)، وقد يُطلق على قاعدة ذلك الإقليم خاصة.", "en": "Hajar was the name of the Bahrain region in early Islam (it includes today's al-Ahsa and the nearby coast); the name was sometimes used for the region's capital alone."}, "l": {"ar": "انتشار الإسلام في هجر كان بالدعوة والحكمة؛ فالكلمة الصادقة تفتح القلوب قبل البلدان.", "en": "Islam spread in Hajar through invitation and wisdom; a truthful word opens hearts before it opens lands."}, "s": {"ar": "معجم البلدان لياقوت الحموي، مادة (هَجَر) ومادة (البحرين).", "en": "Yaqut al-Hamawi, Mu'jam al-Buldan, entries 'Hajar' and 'al-Bahrain'."}, "r": {"ar": "هي الأرض التي دخلها الإسلام بالدعوة والكتاب دون قتال ← يُنبثق منها: تعريف الإسلام، ومفهوم الدعوة إلى الله.", "en": "The land Islam entered through invitation and letters, without fighting → leads to: the definition of Islam and the concept of calling to God."}, "cat": "place", "sec": "b"}, {"id": 1, "t": {"ar": "المُشقَّر", "en": "Al-Mushaqqar"}, "c": {"ar": "المُشَقَّر: حصن عظيم لعبد القيس بالبحرين قريب من مدينة هجر، وكان من أشهر حصون الإقليم ومراكزه قبل الإسلام وبعده.", "en": "Al-Mushaqqar was a great fortress of 'Abd al-Qays in historical Bahrain near the town of Hajar, one of the region's best-known forts and centres before and after Islam."}, "l": {"ar": "لكل بلد معالمه التي تحفظ تاريخه؛ ومعرفة المعالم تعين على فهم السيرة ووقائعها.", "en": "Every land has landmarks that preserve its history; knowing them helps us understand the Sira and its events."}, "s": {"ar": "معجم البلدان لياقوت الحموي، مادة (المُشَقَّر).", "en": "Mu'jam al-Buldan, entry 'al-Mushaqqar'."}, "r": {"ar": "من معالم موطن عبد القيس الذي خرج منه وفداهم إلى النبي ﷺ ← أحكام الصلح والعهود مع أهل البلاد، وحماية الثغور.", "en": "A landmark of the homeland of 'Abd al-Qays, from which their two delegations set out to the Prophet ﷺ → rulings on treaties and covenants with a land's people, and guarding frontiers."}, "cat": "landmark", "sec": "d"}, {"id": 2, "t": {"ar": "الصفا", "en": "Al-Safa"}, "c": {"ar": "الصَّفا: حصن بهجر بجوار المُشَقَّر، ويُذكران معاً في أخبار البحرين وأشعار العرب، وقيل: هو قصبة هجر.", "en": "Al-Safa was a fortress in Hajar beside al-Mushaqqar; the two are mentioned together in reports about historical Bahrain and in Arabic poetry. Some said it was the capital of Hajar."}, "l": {"ar": "عمران هجر وحصونها يدل على مكانتها، وقد دخلها الإسلام صلحاً فحفظ الله دماء أهلها وعمرانها.", "en": "Hajar's towns and forts show its standing; it entered Islam peacefully, so God preserved its people and its buildings."}, "s": {"ar": "معجم البلدان لياقوت الحموي، مادة (الصَّفا) ومادة (المُشَقَّر).", "en": "Mu'jam al-Buldan, entries 'al-Safa' and 'al-Mushaqqar'."}, "r": {"ar": "من مراكز العمران والتجارة في هجر ← أحكام الأسواق والتجارة.", "en": "A centre of settlement and trade in Hajar → rulings on markets and commerce."}, "cat": "landmark", "sec": "d"}, {"id": 3, "t": {"ar": "الزارة", "en": "Al-Zara"}, "c": {"ar": "الزَّارة: قرية كبيرة بالبحرين (من نواحي القطيف)، ورد ذكرها في أخبار فتوح البحرين وقتال العلاء بن الحضرمي لمن امتنع من أهلها.", "en": "Al-Zara was a large village in historical Bahrain, in the Qatif area, mentioned in accounts of the conquest of Bahrain and al-'Ala' ibn al-Hadrami's fight against those who resisted."}, "l": {"ar": "تنوّع طرق دخول البلاد في الإسلام بين الصلح والفتح، وحكمة العلاء في التعامل مع كل حال بما يناسبها.", "en": "Lands entered Islam in different ways, by treaty or by conquest, and al-'Ala' wisely dealt with each case as it required."}, "s": {"ar": "معجم البلدان لياقوت الحموي، مادة (الزَّارة)؛ فتوح البلدان للبلاذري، فتوح البحرين.", "en": "Mu'jam al-Buldan, entry 'al-Zara'; al-Baladhuri, Futuh al-Buldan, the conquest of Bahrain."}, "r": {"ar": "أحكام الصلح والجزية وقتال الممتنعين.", "en": "Rulings on treaties, jizya, and fighting those who resist."}, "cat": "place", "sec": "d"}, {"id": 4, "t": {"ar": "رؤيا الهجرة", "en": "The dream of the emigration"}, "c": {"ar": "عن أبي موسى عن النبي صلى الله عليه وسلم قال: «رأيت في المنام أني أهاجر من مكة إلى أرض بها نخل، فذهب وهلي إلى أنها اليمامة أو هجر، فإذا هي المدينة يثرب».", "en": "Abu Musa reported that the Prophet ﷺ said: “I saw in a dream that I was emigrating from Makkah to a land of palm trees. I thought it was al-Yamama or Hajar, but it was Madinah, Yathrib.”"}, "l": {"ar": "مكانة هجر وشهرتها بالنخل حتى ظنها النبي ﷺ دار الهجرة؛ وأن تأويل الرؤيا قد يظهر عند وقوعها.", "en": "Hajar was so famous for its palms that the Prophet ﷺ thought it might be the land of emigration; the meaning of a dream may become clear only when it comes true."}, "s": {"ar": "صحيح البخاري، كتاب المناقب، باب علامات النبوة في الإسلام، رقم (3622)؛ صحيح مسلم، كتاب الرؤيا، رقم (2272).", "en": "Sahih al-Bukhari 3622; Sahih Muslim 2272."}, "r": {"ar": "رؤيا الأنبياء وحي؛ علامات النبوة؛ الهجرة وأحكامها؛ اجتهاد النبي ﷺ في تأويل الرؤيا قبل وقوعها.", "en": "Prophets' dreams are revelation; signs of prophethood; emigration and its rulings; the Prophet's reasoning in interpreting a dream before it came true."}, "cat": "text", "sec": "b"}, {"id": 5, "t": {"ar": "المنذر بن ساوى", "en": "Al-Mundhir ibn Sawa"}, "c": {"ar": "المنذر بن ساوى: أحد بني عبد الله بن زيد بن عبد الله بن دارم بن مالك بن حنظلة، التميمي نسبةً إلى تميم (وقيل: من عبد القيس)، الأسبذي، نسبةً إلى قرية في هجر بهذا الاسم، ويقال: نسبةً إلى الأسبذيين، وهم قوم كانوا يعبدون الخيل في البحرين. وكان رئيس البحرين وعلى العرب بها من قِبَل الفرس عند ظهور الإسلام. ولا يُخلط بينه وبين المنذر بن عائذ العصري، وهو الأشج الذي كان في الوفادة الأولى.", "en": "Al-Mundhir ibn Sawa was of Banu ‘Abdullah ibn Zayd ibn ‘Abdullah ibn Darim ibn Malik ibn Hanzala, of Tamim (some say of ‘Abd al-Qays), called al-Asbadhi after a village of that name in Hajar, or, it is said, after the Asbadhiyyun, a people in historical Bahrain (the region centred on al-Ahsa) who worshipped horses. When Islam appeared he was the head of Bahrain and ruled its Arabs on behalf of the Persians. He should not be confused with al-Mundhir ibn ‘A’idh al-‘Asri, al-Ashajj, who came with the first delegation."}, "l": {"ar": "الإسلام حرّر أهل هجر من التبعية للفرس ومن عبادة المخلوقات.", "en": "Islam freed the people of Hajar from subordination to Persia and from worshipping created things."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا، نقلاً عن فتوح البلدان للبلاذري؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar, citing al-Baladhuri, Futuh al-Buldan; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "التوحيد وإبطال عبادة غير الله (الأسبذيون كانوا يعبدون الخيل)؛ تعريف الإسلام.", "en": "God’s oneness and the rejection of worshipping anything besides Him (the Asbadhiyyun worshipped horses); the definition of Islam."}, "cat": "figure", "sec": "b"}, {"id": 6, "t": {"ar": "بداية المراسلات", "en": "The first letters"}, "c": {"ar": "بدأت المراسلات بين النبي ﷺ والمنذر بن ساوى بعد فتح مكة في السنة الثامنة للهجرة (629م)، وقيل: قبلها في السابعة، وقيل: بعدها في التاسعة. فوجّه رسول الله ﷺ العلاء بن الحضرمي، حليف بني عبد شمس، إلى البحرين، وكتب معه كتابين: أحدهما للمنذر بن ساوى، والآخر لأُسيبخت مرزبان هجر، فلما وصل العلاء البحرين عرض على المنذر كتاب الرسول ﷺ. وتُجمع المصادر التاريخية على أن البحرين دخلت في الإسلام دون قتال.", "en": "Correspondence between the Prophet ﷺ and al-Mundhir ibn Sawa began after the conquest of Makkah in 8 AH (629 CE); some say before it, in 7 AH, and others after it, in 9 AH. The Messenger of God ﷺ sent al-‘Ala’ ibn al-Hadrami, an ally of Banu ‘Abd Shams, to historical Bahrain (the region centred on al-Ahsa) with two letters: one to al-Mundhir ibn Sawa and the other to Usaybukht, the Persian governor (marzuban) of Hajar. On reaching Bahrain, al-‘Ala’ presented the Prophet’s letter to al-Mundhir. Historical sources agree that Bahrain entered Islam without fighting."}, "l": {"ar": "دخول الإسلام البحرين سلماً بالدعوة والكتاب؛ واختيار الرسول الأمين الحكيم من أسباب نجاح الدعوة.", "en": "Islam reached Bahrain peacefully, through invitation and letters; choosing a trustworthy, wise envoy is part of a message’s success."}, "s": {"ar": "فتوح البلدان للبلاذري (تاريخ هجر لعبد الرحمن بن عثمان آل ملا)؛ الطبقات الكبرى لابن سعد؛ عيون الأثر لابن سيد الناس (الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ).", "en": "al-Baladhuri, Futuh al-Buldan (via ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar); Ibn Sa‘d, al-Tabaqat al-Kubra; Ibn Sayyid al-Nas, ‘Uyun al-Athar (via al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh)."}, "r": {"ar": "الدعوة إلى الله ومراسلة الملوك؛ تعريف الإسلام؛ الشهادتان.", "en": "Calling to God and writing to rulers; the definition of Islam; the two testimonies."}, "cat": "text", "sec": "b"}, {"id": 7, "t": {"ar": "الكتاب الأول إلى المنذر", "en": "The first letter to al-Mundhir"}, "c": {"ar": "نص كتاب النبي ﷺ الأول إلى المنذر بن ساوى:\n«بسم الله الرحمن الرحيم\nمن محمد رسول الله إلى المنذر بن ساوى، سلام على من اتبع الهدى.\nأما بعد: فإني أدعوك إلى الإسلام، فأسلم تسلم، أسلم يجعل الله لك ما تحت يديك، واعلم أن ديني سيظهر إلى منتهى الخف والحافر».", "en": "The text of the Prophet’s ﷺ first letter to al-Mundhir ibn Sawa:\n“In the name of God, the Most Gracious, the Most Merciful.\nFrom Muhammad, the Messenger of God, to al-Mundhir ibn Sawa. Peace be upon whoever follows guidance.\nI invite you to Islam. Embrace Islam and you will be safe. Embrace Islam and God will leave you what is under your hand. And know that my religion will prevail as far as camel and horse can go.”"}, "l": {"ar": "وضوح الدعوة وإيجازها؛ والإسلام سبب للسلامة في الدنيا والآخرة.", "en": "The invitation is clear and brief; Islam brings safety in this world and the next."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا، نقلاً عن فتوح البلدان للبلاذري؛ ونصب الراية للزيلعي (الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ)، وفيه: «من محمد بن عبد الله إلى المنذر بن ساوى»، و«وأسلم يجعل الله لك ما تحت يديك».", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar, citing al-Baladhuri, Futuh al-Buldan; al-Zayla‘i, Nasb al-Raya (via al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh), with the wording “From Muhammad ibn ‘Abdullah to al-Mundhir ibn Sawa” and “Embrace Islam, and God will leave you what is under your hand.”"}, "r": {"ar": "تعريف الإسلام والدعوة إليه؛ ظهور الدين: ﴿لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ﴾ (التوبة: 33)؛ الأمان والإقرار على الولاية لمن أسلم.", "en": "The definition of Islam and the call to it; the prevailing of the religion: “to make it prevail over all religion” (al-Tawba 9:33); safety and confirmation in office for whoever embraces Islam."}, "cat": "text", "sec": "b"}, {"id": 8, "t": {"ar": "خطاب العلاء للمنذر", "en": "Al-‘Ala’’s address to al-Mundhir"}, "c": {"ar": "خطاب العلاء بن الحضرمي للمنذر بعد فراغه من قراءة الكتاب:\n«يا منذر إنك عظيم العقل في الدنيا فلا يصغرن بك في الآخرة، إن المجوسية شر دين ليس فيها تكرم العرب ولا علم أهل الكتاب، ينكحون من يستحى من نكاحه، ويأكلون ما يتكره من أكله، ويعبدون في الدنيا ناراً تأكلهم يوم القيامة، ولست بعديم رأي، فانظر لمن لا يكذب ألا تصدقه، ولمن لا يخون ألا تأمنه، ولمن لا يخلف ألا تثق به، إن كان أحد هكذا فهو هذا النبي الأمي الذي لا يستطيع ذو عقل أن يقول ليت ما أمر به نهى عنه، أو ليت ما نهى عنه أمر به، أو زاد في عفوه، أو نقص من عقوبته، إن كان ذلك منه إلا على أمنية أهل العقل وفكر أهل البصيرة».", "en": "Al-‘Ala’ ibn al-Hadrami’s words to al-Mundhir after reading him the letter:\n“Mundhir, you are a man of great mind in this world, so do not be small in the next. Magianism is the worst of religions: it has neither the honour of the Arabs nor the knowledge of the People of the Book. They marry those whom one would be ashamed to marry, eat what one would loathe to eat, and in this world worship a fire that will consume them on the Day of Resurrection. You are not without judgement: consider whether you should not believe one who does not lie, trust one who does not betray, and rely on one who does not break his word. If anyone is such, it is this unlettered Prophet, of whom no man of reason can say: I wish what he commanded he had forbidden, or what he forbade he had commanded, or that he had pardoned more or punished less. All of it accords with the hopes of people of reason and the thought of people of insight.”"}, "l": {"ar": "مخاطبة المدعو بما يناسب عقله ومكانته؛ والاستدلال بأخلاق النبي ﷺ على صدق رسالته.", "en": "Address people according to their minds and standing; the Prophet’s ﷺ character is evidence of the truth of his message."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا؛ وأورده ابن القيم في زاد المعاد (فصل في كتابه ﷺ إلى المنذر بن ساوى).", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar; also quoted by Ibn al-Qayyim, Zad al-Ma‘ad (section on his letter ﷺ to al-Mundhir ibn Sawa)."}, "r": {"ar": "دلائل النبوة: الصدق والأمانة والوفاء من صفات النبي ﷺ؛ بطلان المجوسية؛ الإيمان باليوم الآخر.", "en": "Proofs of prophethood: truthfulness, trustworthiness and faithfulness are qualities of the Prophet ﷺ; the falsehood of Magianism; belief in the Last Day."}, "cat": "text", "sec": "b"}, {"id": 9, "t": {"ar": "جواب المنذر للعلاء", "en": "Al-Mundhir’s answer to al-‘Ala’"}, "c": {"ar": "جواب المنذر للعلاء:\n«قد نظرت في هذا الذي بين يدي من الملك فوجدته للدنيا دون الآخرة، ونظرت في دينكم فوجدته للدنيا والآخرة معاً، فما يمنعني من قبول دين فيه أمنية الحياة وراحة الموت». ثم أسلم وأسلم معه جميع العرب وبعض العجم.", "en": "Al-Mundhir’s reply to al-‘Ala’:\n“I have considered the kingship in my hands and found it is for this world, not the next. And I have considered your religion and found it is for this world and the next together. So what prevents me from accepting a religion that holds the hope of life and the rest of death?” Then he embraced Islam, and all the Arabs and some of the Persians embraced it with him."}, "l": {"ar": "العاقل يختار ما يصلح دنياه وآخرته معاً، ولا يغترّ بملك زائل.", "en": "A wise person chooses what is good for both this world and the next, and is not deceived by passing power."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "الإيمان باليوم الآخر؛ الموازنة بين الدنيا والآخرة؛ تعريف الإسلام دين الدنيا والآخرة.", "en": "Belief in the Last Day; weighing this world against the next; Islam as a religion for this world and the next."}, "cat": "text", "sec": "b"}, {"id": 10, "t": {"ar": "إسلام المنذر وأهل البحرين", "en": "Al-Mundhir and Bahrain embrace Islam"}, "c": {"ar": "ثم أسلم المنذر بن ساوى، وأسلم معه جميع العرب وبعض العجم، وفي مقدمتهم أُسيبخت مرزبان هجر. فأبقاه النبي ﷺ في منصبه والياً، وترك له ممارسة الصلاحيات الإدارية والمدنية في البلاد، وجعل العلاء بن الحضرمي على جباية الخراج، فصار العلاء يأخذ الزكاة من أهلها والخراج من أصحابه.", "en": "Al-Mundhir ibn Sawa embraced Islam, and all the Arabs and some of the Persians with him, foremost among them Usaybukht, the governor of Hajar. The Prophet ﷺ kept al-Mundhir in office as governor, leaving him the administrative and civil powers of the land, and placed al-‘Ala’ ibn al-Hadrami in charge of collecting revenue: al-‘Ala’ took zakat from its Muslims and land tax (kharaj) from those who kept their religion."}, "l": {"ar": "من أسلم أُقرّ على ما بيده؛ والإسلام يحفظ لأهل البلاد مكانتهم ونظامهم.", "en": "Whoever embraces Islam keeps what he holds; Islam preserved the standing and order of the land’s people."}, "s": {"ar": "فتوح البلدان للبلاذري؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا؛ الإصابة لابن حجر، ترجمة المنذر بن ساوى.", "en": "al-Baladhuri, Futuh al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar; Ibn Hajar, al-Isaba (al-Mundhir ibn Sawa)."}, "r": {"ar": "تعريف الإسلام وأركانه؛ تعريف الزكاة وأحكامها؛ الفرق بين الزكاة والخراج؛ أحكام الولاية.", "en": "The definition and pillars of Islam; zakat and its rulings; the difference between zakat and kharaj; rulings on governorship."}, "cat": "figure", "sec": "b"}, {"id": 11, "t": {"ar": "كتاب المنذر إلى النبي ﷺ", "en": "Al-Mundhir’s letter to the Prophet ﷺ"}, "c": {"ar": "كتاب المنذر بن ساوى إلى رسول الله ﷺ: أجاب بإسلامه وتصديقه، و«أني قرأت كتابك على أهل هجر، فمنهم من أحب الإسلام وأعجبه ودخل فيه، ومنهم من كرهه، وفي أرضي مجوس ويهود، فأحدث إليّ في ذلك أمرك».", "en": "Al-Mundhir ibn Sawa wrote to the Messenger of God ﷺ announcing his acceptance of Islam and his belief: “I read your letter to the people of Hajar. Some of them loved Islam, admired it and entered it, and some disliked it. In my land there are Magians and Jews, so send me your command concerning them.”"}, "l": {"ar": "أمانة الحاكم في نقل حال رعيته بصدق، وسؤاله عما أشكل عليه.", "en": "A ruler should report his people's condition honestly and ask the knowledgeable about what puzzles him."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ فتوح البلدان للبلاذري؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا. وفي الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ بلفظ: «أما بعد يا رسول الله: فإني قرأت كتابك على أهل البحرين، فمنهم من أحب الإسلام وأعجبه ودخل فيه، ومنهم من كرهه، وبأرضي مجوس ويهود، فأحدث إلي في ذلك أمرك».", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; al-Baladhuri, Futuh al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar. In al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh the wording is: “Messenger of God, I read your letter to the people of Bahrain…”"}, "r": {"ar": "الرجوع إلى الشرع في النوازل؛ أحكام التعامل مع غير المسلمين ← أحكام أهل الذمة.", "en": "Referring to the Sharia in new matters; dealing with non-Muslims → rulings on protected non-Muslims (ahl al-dhimma)."}, "cat": "text", "sec": "b"}, {"id": 12, "t": {"ar": "«من استقبل قبلتنا»", "en": "“Whoever faces our qibla”"}, "c": {"ar": "كتاب النبي ﷺ إلى المنذر بن ساوى في أحكام من أسلم ومن لم يسلم:\n«بسم الله الرحمن الرحيم\nمن محمد رسول الله إلى المنذر بن ساوى\nسلام الله عليك، فإني أحمد إليك الله الذي لا إله إلا هو.\nأما بعد: فمن استقبل قبلتنا وأكل ذبيحتنا فذلك المسلم الذي له ما لنا وعليه ما علينا، ومن لم يفعل فعليه دينار من قيمة المعافري.\nوالسلام ورحمة الله، يغفر الله لك».", "en": "The Prophet’s ﷺ letter to al-Mundhir ibn Sawa on the rulings for those who embraced Islam and those who did not:\n“In the name of God, the Most Gracious, the Most Merciful.\nFrom Muhammad, the Messenger of God, to al-Mundhir ibn Sawa.\nGod’s peace be upon you. I praise to you God, besides whom there is no god.\nWhoever faces our qibla and eats our slaughtered meat is a Muslim: he has what we have and owes what we owe. Whoever does not, owes a dinar, or its value in Ma‘afiri cloth.\nPeace and the mercy of God; may God forgive you.”"}, "l": {"ar": "التيسير في تقدير الجزية بالمال أو ما يقوم مقامه من السلع؛ والعدل بين الناس في الحقوق.", "en": "Jizya could be paid in money or its equivalent in goods, an ease for people; and justice among people in their rights."}, "s": {"ar": "تاريخ هجر لعبد الرحمن بن عثمان آل ملا، نقلاً عن فتوح البلدان للبلاذري والطبقات لابن سعد. (المعافري: نوع من البرود اليمانية منسوب إلى معافر اليمن، قاله الأزهري؛ عن البحرين في صدر الإسلام لعبد الرحمن عبد الكريم النجم).", "en": "‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar, citing al-Baladhuri, Futuh al-Buldan, and Ibn Sa‘d, al-Tabaqat. (Ma‘afiri: a kind of Yemeni cloth named after Ma‘afir in Yemen, per al-Azhari; via ‘Abd al-Rahman ‘Abd al-Karim al-Najm, al-Bahrain fi Sadr al-Islam.)"}, "r": {"ar": "علامات الإسلام الظاهرة، ويشهد له حديث البخاري (391): «من صلى صلاتنا، واستقبل قبلتنا، وأكل ذبيحتنا فذلك المسلم الذي له ذمة الله وذمة رسوله»؛ تقدير الجزية (دينار أو قيمته من الثياب المعافرية)؛ المساواة في الحقوق والواجبات.", "en": "The outward signs of Islam, supported by al-Bukhari 391: “Whoever prays our prayer, faces our qibla and eats our slaughtered meat is a Muslim, under the protection of God and His Messenger”; the amount of jizya (a dinar or its value in Ma‘afiri cloth); equality in rights and duties."}, "cat": "text", "sec": "d"}, {"id": 13, "t": {"ar": "الكتاب الجوابي إلى المنذر", "en": "The reply to al-Mundhir"}, "c": {"ar": "كتاب النبي ﷺ إلى المنذر بن ساوى جواباً لكتابه:\n«بسم الله الرحمن الرحيم\nمن محمد رسول الله إلى المنذر بن ساوى\nسلام عليك، فإني أحمد إليك الله الذي لا إله إلا هو، وأشهد أن لا إله إلا الله وأن محمداً عبده ورسوله.\nأما بعد: فإني أذكرك الله عز وجل، فإنه من ينصح فإنما ينصح لنفسه، وإنه من يطع رسلي ويتبع أمرهم فقد أطاعني، ومن نصح لهم فقد نصح لي، وإن رسلي قد أثنوا عليك خيراً، وإني قد شفعتك في قومك، فاترك للمسلمين ما أسلموا عليه، وعفوت عن أهل الذنوب فاقبل منهم، وإنك مهما تصلح فلن نعزلك عن عملك، ومن أقام على يهوديته أو مجوسيته فعليه الجزية».", "en": "The Prophet’s ﷺ letter to al-Mundhir ibn Sawa in reply to his:\n“In the name of God, the Most Gracious, the Most Merciful.\nFrom Muhammad, the Messenger of God, to al-Mundhir ibn Sawa.\nPeace be upon you. I praise to you God, besides whom there is no god, and I testify that there is no god but God and that Muhammad is His servant and Messenger.\nI remind you of God, Mighty and Majestic: whoever gives sincere counsel does so for himself. Whoever obeys my envoys and follows their command has obeyed me, and whoever counsels them well has counselled me. My envoys have praised you, and I have accepted your intercession for your people. So leave the Muslims what they held when they embraced Islam. I have pardoned the wrongdoers, so accept it from them. As long as you act rightly we will not remove you from your office. And whoever keeps to his Judaism or Magianism owes the jizya.”"}, "l": {"ar": "الإسلام يجُبّ ما قبله؛ والولاية مشروطة بالصلاح؛ وثناء الرسل على المنذر سبب لتشفيعه في قومه.", "en": "Islam erases what came before; office depends on righteousness; the envoys’ praise of al-Mundhir earned him intercession for his people."}, "s": {"ar": "فتوح البلدان للبلاذري؛ عيون الأثر لابن سيد الناس؛ زاد المعاد لابن القيم؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "al-Baladhuri, Futuh al-Buldan; Ibn Sayyid al-Nas, ‘Uyun al-Athar; Ibn al-Qayyim, Zad al-Ma‘ad; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "الشهادتان؛ طاعة الرسول ﷺ ورسله؛ النصيحة؛ العفو عن أهل الذنوب؛ شرط الصلاح في الولاية؛ تعريف الجزية وأحكامها.", "en": "The two testimonies; obeying the Messenger ﷺ and his envoys; sincere counsel; pardoning wrongdoers; righteousness as a condition of office; the definition and rulings of jizya."}, "cat": "text", "sec": "d"}, {"id": 14, "t": {"ar": "كتابه ﷺ إلى الأسبذيين", "en": "The letter to the Asbadhiyyun"}, "c": {"ar": "كتاب النبي ﷺ إلى الأسبذيين، عن عروة بن الزبير قال: كتب رسول الله ﷺ إلى المنذر بن ساوى:\n«من محمد النبي رسول الله لعباد الله الأسبذيين ملوك عمان وأسد عمان، من كان منهم بالبحرين: أنهم إن آمنوا، وأقاموا الصلاة، وآتوا الزكاة، وأطاعوا الله ورسوله، وأعطوا حق النبي صلى الله عليه وسلم، ونسكوا نسك المؤمنين، فإنهم آمنون، وأن لهم ما أسلموا عليه، غير أن مال بيت النار ثنيا لله ورسوله، وأن عشور التمر صدقة، ونصف عشور الحب، وأن للمسلمين نصرهم ونصحهم، وأن لهم على المسلمين مثل ذلك، وأن لهم أرحاءهم يطحنون بها ما شاؤوا».", "en": "The Prophet’s ﷺ letter to the Asbadhiyyun. ‘Urwa ibn al-Zubayr said: The Messenger of God ﷺ wrote to al-Mundhir ibn Sawa:\n“From Muhammad the Prophet, the Messenger of God, to the servants of God, the Asbadhiyyun, kings of Oman and the Asad of Oman, those of them in historical Bahrain: if they believe, establish prayer, pay zakat, obey God and His Messenger, give the Prophet’s ﷺ due and perform the rites of the believers, they are safe, and they keep what they held when they embraced Islam, except that the wealth of the fire-temple is reserved for God and His Messenger. A tenth of dates is due as charity, and a twentieth of grain. The Muslims owe them support and sincere counsel, and they owe the Muslims the same. And they keep their mills, to grind in them whatever they wish.”"}, "l": {"ar": "هذا الكتاب لم يكن في بداية دخول أهل هجر الإسلام، بل كان لتكليف الأسبذيين بالإسلام أو الجزية مقابل الحماية والأمن.", "en": "This letter did not come at the start of Hajar’s Islam; it charged the Asbadhiyyun with Islam, or jizya in return for protection and security."}, "s": {"ar": "الأموال لأبي عبيد القاسم بن سلام (رقم 44)، عن عروة بن الزبير؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Abu ‘Ubayd al-Qasim ibn Sallam, al-Amwal (44), from ‘Urwa ibn al-Zubayr; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "أركان الإسلام: الإيمان والصلاة والزكاة؛ زكاة الثمار والحبوب (العشر ونصف العشر)؛ الولاء والنصرة بين المسلمين؛ حفظ أموال من أسلم ومنافعهم.", "en": "The pillars of Islam: faith, prayer and zakat; zakat on fruit and grain (a tenth and a twentieth); loyalty and support among Muslims; protecting the property and livelihood of those who embrace Islam."}, "cat": "text", "sec": "d"}, {"id": 15, "t": {"ar": "«إن رسلي قد حمدوك»", "en": "“My envoys have praised you”"}, "c": {"ar": "كتاب النبي ﷺ إلى المنذر بن ساوى (عند ابن سعد):\n«أما بعد: فإن رسلي قد حمدوك، وإنك مهما تصلح أصلح إليك، وأثبك على عملك، وتنصح لله ولرسوله، والسلام عليك». وبعث بها مع العلاء بن الحضرمي.", "en": "The Prophet’s ﷺ letter to al-Mundhir ibn Sawa (in Ibn Sa‘d):\n“My envoys have praised you. As long as you act rightly I will do right by you, reward you for your work, and you will be sincere to God and His Messenger. Peace be upon you.” He sent it with al-‘Ala’ ibn al-Hadrami."}, "l": {"ar": "الإحسان يقابل بالإحسان، والثناء على العامل الصالح يعينه على الثبات.", "en": "Good is met with good, and praising a righteous official helps him stay steadfast."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "النصيحة لله ولرسوله؛ الثواب على العمل الصالح؛ أحكام الولاية.", "en": "Sincerity to God and His Messenger; reward for good work; rulings on governorship."}, "cat": "text", "sec": "d"}, {"id": 16, "t": {"ar": "جباية جزية البحرين", "en": "Collecting Bahrain’s jizya"}, "c": {"ar": "كتاب آخر من النبي ﷺ إلى المنذر بن ساوى (عند ابن سعد):\n«أما بعد: فإني قد بعثت إليك قدامة وأبا هريرة، فادفع إليهما ما اجتمع عندك من جزية أرضك، والسلام».", "en": "Another letter from the Prophet ﷺ to al-Mundhir ibn Sawa (in Ibn Sa‘d):\n“I have sent Qudama and Abu Hurayra to you, so hand over to them the jizya of your land that has gathered with you. Peace.”"}, "l": {"ar": "تنظيم الموارد المالية للدولة وإسنادها إلى الأمناء.", "en": "The state’s revenues were organised and entrusted to trustworthy people."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "أحكام الجزية وبيت المال؛ تعيين العمال على جبايتها.", "en": "Rulings on jizya and the public treasury; appointing officials to collect it."}, "cat": "text", "sec": "d"}, {"id": 17, "t": {"ar": "أبو هريرة في البحرين", "en": "Abu Hurayra in Bahrain"}, "c": {"ar": "بعث رسول الله ﷺ أبا هريرة إلى البحرين:\n«وكان رسول الله صلى الله عليه وسلم بعث أبا هريرة مع العلاء بن الحضرمي، وأوصاه به خيراً، وكتب رسول الله صلى الله عليه وسلم للعلاء فرائض الإبل والبقر والغنم والثمار والأموال، فقرأ العلاء كتابه على الناس وأخذ صدقاتهم».", "en": "The Messenger of God ﷺ sent Abu Hurayra to historical Bahrain (the region centred on al-Ahsa):\n“The Messenger of God ﷺ sent Abu Hurayra with al-‘Ala’ ibn al-Hadrami and commended him to his care. The Messenger of God ﷺ wrote for al-‘Ala’ the obligatory dues on camels, cattle, sheep, fruit and wealth. Al-‘Ala’ read his letter to the people and took their charity.”"}, "l": {"ar": "أبو هريرة رضي الله عنه من صحابة البحرين: بُعث إليها مع العلاء، ثم لجباية جزيتها مع قدامة، ثم ولاه عمر عليها.", "en": "Abu Hurayra was one of Bahrain’s Companions: sent there with al-‘Ala’, then to collect its jizya with Qudama, then appointed its governor by ‘Umar."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "تعريف الزكاة وأحكامها: فرائض الإبل والبقر والغنم والثمار والأموال؛ تعليم الناس أحكام الصدقات.", "en": "Zakat and its rulings: the dues on camels, cattle, sheep, fruit and wealth; teaching people the rulings of charity."}, "cat": "figure", "sec": "w"}, {"id": 18, "t": {"ar": "كتابه ﷺ إلى أُسيبخت", "en": "The letter to Usaybukht"}, "c": {"ar": "كتاب النبي ﷺ إلى أُسيبخت صاحب هجر (فيما يرويه ابن سعد):\n«إلى أسيبخت بن عبد الله صاحب هجر. إنه قد جاءني الأقرع بكتابك وشفاعتك لقومك، وإني قد شفعتك وصدقت رسولك الأقرع في قومك، فأبشر فيما سألتني وطلبتني بالذي تحب، ولكني نظرت أن أعلمه وتلقاني، فإن تجئنا أكرمك، وإن تقعد أكرمك.\nأما بعد: فإني لا أستهدي أحداً، وإن تهد إليّ أقبل هديتك، وقد حمد عمالي مكانك، وأوصيك بأحسن الذي أنت عليه من الصلاة والزكاة وقرابة المؤمنين، وإني قد سميت قومك بني عبد الله، فمرهم بالصلاة وبأحسن العمل، وأبشر.\nوالسلام عليك وعلى قومك المؤمنين».", "en": "The Prophet’s ﷺ letter to Usaybukht, ruler of Hajar (as narrated by Ibn Sa‘d):\n“To Usaybukht ibn ‘Abdullah, ruler of Hajar. Al-Aqra‘ has brought me your letter and your intercession for your people. I have accepted your intercession and believed your messenger al-Aqra‘ concerning your people, so rejoice at what you asked of me and sought from me, which you love. But I thought I would let him know that you should come to me: if you come to us I will honour you, and if you stay I will honour you.\nI ask no one for gifts, but if you send me a gift I will accept it. My officials have praised your standing. I commend to you the best of what you hold to: prayer, zakat and kinship with the believers. I have named your people Banu ‘Abdullah, so command them to pray and do their best work, and rejoice.\nPeace be upon you and upon your believing people.”"}, "l": {"ar": "تكريم من أسلم والثناء على حسن عمله؛ والشفاعة للقوم من خلق الكرام.", "en": "Honouring those who embrace Islam and praising their good work; interceding for one’s people is a noble trait."}, "s": {"ar": "الطبقات الكبرى لابن سعد؛ البحرين في صدر الإسلام لعبد الرحمن عبد الكريم النجم؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا. (اعتُمد لفظ الطبقات الكبرى: «وقرابة المؤمنين»، وفي تاريخ هجر: «وقراية»، وهو تصحيف).", "en": "Ibn Sa‘d, al-Tabaqat al-Kubra; ‘Abd al-Rahman ‘Abd al-Karim al-Najm, al-Bahrain fi Sadr al-Islam; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar. (The wording of al-Tabaqat, “kinship with the believers”, is adopted; Tarikh Hajar has a misprint.)"}, "r": {"ar": "الصلاة والزكاة وأحكامهما؛ قبول الهدية؛ استحباب تغيير الأسماء إلى الحسن (سمّى قومه بني عبد الله)؛ الأمر بالمعروف.", "en": "Prayer and zakat and their rulings; accepting gifts; the merit of changing names to good ones (he named his people Banu ‘Abdullah); enjoining good."}, "cat": "text", "sec": "w"}, {"id": 19, "t": {"ar": "كتابه ﷺ إلى عبد القيس", "en": "The letter to ‘Abd al-Qays"}, "c": {"ar": "كتاب النبي ﷺ إلى عبد القيس:\n«بسم الله الرحمن الرحيم\nمن محمد رسول الله لعبد القيس وحاشيتها من البحرين وما حولها.\nإنكم أتيتموني مسلمين مؤمنين بالله ورسوله، وعاهدتم على دينه، فقبلت على أن تطيعوا الله ورسوله فيما أحببتم وكرهتم، وتقيموا الصلاة، وتؤدوا الزكاة، وتحجوا البيت، وتصوموا رمضان، وكونوا قائمين لله بالقسط ولو على أنفسكم، وعلى أن تؤخذ من حواشي أموال أغنيائكم فترد على فقرائكم على فريضة الله ورسوله في أموال المسلمين».", "en": "The Prophet’s ﷺ letter to ‘Abd al-Qays:\n“In the name of God, the Most Gracious, the Most Merciful.\nFrom Muhammad, the Messenger of God, to ‘Abd al-Qays and their dependants from historical Bahrain (the region centred on al-Ahsa) and its surroundings.\nYou came to me as Muslims, believing in God and His Messenger, and pledged yourselves to His religion. I accepted, on condition that you obey God and His Messenger in what you like and dislike, establish prayer, pay zakat, make pilgrimage to the House, fast Ramadan, and stand firm for God in justice even against yourselves; and that a share of your rich people’s wealth be taken and returned to your poor, as God and His Messenger have ordained in the wealth of Muslims.”"}, "l": {"ar": "الإسلام عهد على الطاعة في المنشط والمكره؛ والزكاة تكافل بين أغنياء البلد وفقرائه.", "en": "Islam is a pledge of obedience in ease and hardship; zakat binds a land’s rich and poor together."}, "s": {"ar": "البحرين في صدر الإسلام لعبد الرحمن عبد الكريم النجم؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "‘Abd al-Rahman ‘Abd al-Karim al-Najm, al-Bahrain fi Sadr al-Islam; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "أركان الإسلام: الصلاة والزكاة والصوم والحج؛ تعريف الزكاة: تؤخذ من الأغنياء وترد على الفقراء، ويشهد له حديث معاذ في البخاري (1395): «تؤخذ من أغنيائهم وترد على فقرائهم»؛ العدل: ﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ﴾ (النساء: 135).", "en": "The pillars of Islam: prayer, zakat, fasting and pilgrimage; zakat taken from the rich and returned to the poor, supported by the hadith of Mu‘adh in al-Bukhari 1395: “taken from their rich and returned to their poor”; justice: “stand firm in justice” (al-Nisa’ 4:135)."}, "cat": "text", "sec": "w"}, {"id": 20, "t": {"ar": "بنو الكاتب", "en": "The Banu al-Katib"}, "c": {"ar": "روى ابن حبان عن أنس رضي الله عنه أن النبي ﷺ كتب إلى بكر بن وائل: «من محمد رسول الله إلى بكر بن وائل: أن أسلموا تسلموا». قال: فما قرأه إلا رجل منهم من بني ضبيعة، فهم يسمون بني الكاتب.", "en": "Ibn Hibban narrated from Anas that the Prophet ﷺ wrote to Bakr ibn Wa’il: “From Muhammad, the Messenger of God, to Bakr ibn Wa’il: embrace Islam and you will be safe.” He said: Only one man of them, from Banu Dubay‘a, could read it, so they are called Banu al-Katib, “the sons of the scribe”."}, "l": {"ar": "فضل العلم ورفعة أهله؛ إذ صار قارئ الكتاب لقباً يُعرف به قومه.", "en": "Knowledge raises its people: the man who read the letter gave his clan its name."}, "s": {"ar": "صحيح ابن حبان (رقم 6558)؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "Sahih Ibn Hibban (6558); al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "الدعوة إلى الإسلام؛ فضل تعلم القراءة والكتابة.", "en": "The call to Islam; the merit of learning to read and write."}, "cat": "text", "sec": "b"}, {"id": 21, "t": {"ar": "كتابه ﷺ إلى مجوس هجر", "en": "The letter to the Magians of Hajar"}, "c": {"ar": "كتاب النبي ﷺ إلى مجوس هجر:\n• عن الحسن بن محمد: كتب رسول الله ﷺ إلى مجوس هجر يدعوهم إلى الإسلام، فمن أسلم قبل منه، ومن لا ضربت عليه الجزية، في أن لا تؤكل له ذبيحة، ولا تنكح له امرأة.\n• وعند ابن سعد: «وكتب رسول الله صلى الله عليه وسلم إلى مجوس هجر يعرض عليهم الإسلام، فإن أبوا أخذت منهم الجزية، وبأن لا تنكح نساؤهم ولا تؤكل ذبائحهم».", "en": "The Prophet’s ﷺ letter to the Magians of Hajar:\n• Al-Hasan ibn Muhammad said: The Messenger of God ﷺ wrote to the Magians of Hajar inviting them to Islam. Whoever embraced it was accepted, and whoever did not had jizya imposed, on condition that their slaughtered meat not be eaten and their women not be married.\n• In Ibn Sa‘d: “The Messenger of God ﷺ wrote to the Magians of Hajar offering them Islam; if they refused, jizya would be taken from them, and their women would not be married nor their slaughtered meat eaten.”"}, "l": {"ar": "وضوح الشريعة في بيان الحقوق قبل التعامل، والعدل مع المخالف مع حفظ خصوصية أحكام المسلمين.", "en": "The Sharia makes rights clear before any dealings, and is just to those who differ while preserving the Muslims' own rulings."}, "s": {"ar": "مرسل الحسن بن محمد: مصنف عبد الرزاق، مصنف ابن أبي شيبة، السنن الكبرى للبيهقي، الأموال لأبي عبيد (تاريخ هجر لعبد الرحمن بن عثمان آل ملا)؛ الطبقات الكبرى لابن سعد (الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ).", "en": "The mursal report of al-Hasan ibn Muhammad: Musannaf ‘Abd al-Razzaq, Musannaf Ibn Abi Shayba, al-Bayhaqi’s al-Sunan al-Kubra, Abu ‘Ubayd’s al-Amwal (via ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar); Ibn Sa‘d, al-Tabaqat al-Kubra (via al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh)."}, "r": {"ar": "أحكام أهل الذمة؛ الفرق بين المجوس وأهل الكتاب في الذبائح والنكاح؛ حكم ذبائح الكفار.", "en": "Rulings on protected non-Muslims; the difference between Magians and People of the Book regarding slaughter and marriage; the ruling on non-Muslims' slaughtered animals."}, "cat": "text", "sec": "d"}, {"id": 22, "t": {"ar": "«فله مثل ما لنا»", "en": "“He has what we have”"}, "c": {"ar": "كتاب النبي ﷺ إلى مجوس هجر (عن أبي إياس معاوية بن قرة):\n«أما بعد: من شهد منكم أن لا إله إلا الله وأن محمداً عبده ورسوله، واستقبل قبلتنا، وأكل ذبيحتنا، فله مثل ما لنا، وعليه مثل ما علينا، ومن أبى فعليه الجزية على كل رأس دينار على الذكر والأنثى، ومن أبى فليأذن بحرب من الله ورسوله».", "en": "The Prophet’s ﷺ letter to the Magians of Hajar (from Abu Iyas Mu‘awiya ibn Qurra):\n“Whoever of you testifies that there is no god but God and that Muhammad is His servant and Messenger, faces our qibla and eats our slaughtered meat has what we have and owes what we owe. Whoever refuses owes jizya of a dinar a head, male and female. And whoever refuses that, let him be warned of war from God and His Messenger.”"}, "l": {"ar": "من دخل الإسلام صار له ما للمسلمين وعليه ما عليهم دون تمييز.", "en": "Whoever enters Islam has what the Muslims have and owes what they owe, without distinction."}, "s": {"ar": "فتوح البلدان للبلاذري، بسنده عن هاشم بن القاسم إلى أبي إياس معاوية بن قرة؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "al-Baladhuri, Futuh al-Buldan, with his chain from Hashim ibn al-Qasim to Abu Iyas Mu‘awiya ibn Qurra; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "الشهادتان؛ علامات الإسلام الظاهرة؛ مقدار الجزية؛ المساواة في الحقوق بين المسلمين.", "en": "The two testimonies; the outward signs of Islam; the amount of jizya; equal rights among Muslims."}, "cat": "text", "sec": "d"}, {"id": 23, "t": {"ar": "وصية النبي ﷺ للعلاء", "en": "The Prophet’s charge to al-‘Ala’"}, "c": {"ar": "عن مسلم بن العلاء الحضرمي قال: «شهدت رسول الله صلى الله عليه وسلم فيما عهد إلى العلاء حيث وجهه إلى البحرين، قال: ولا يحل لأحد جهل الفرض والسنن، ويحل له ما سوى ذلك. وكتب للعلاء: أن سنوا بالمجوس سنة أهل الكتاب».", "en": "Muslim ibn al-‘Ala’ al-Hadrami said: “I witnessed the Messenger of God ﷺ in what he charged al-‘Ala’ with when he sent him to historical Bahrain. He said: No one may be ignorant of the obligations and the Sunna, and beyond that what he wishes is permitted. And he wrote to al-‘Ala’: Treat the Magians as you treat the People of the Book.”"}, "l": {"ar": "طلب العلم بالفرائض واجب على كل مسلم؛ ولا إكراه في الدين بعد عرض الإسلام.", "en": "Learning the obligations is a duty on every Muslim; there is no compulsion in religion once Islam has been offered."}, "s": {"ar": "المعجم الكبير للطبراني (رقم 1059)؛ الدليل السياحي لزوار الأحساء والساحل الشرقي للدوغان والشيخ.", "en": "al-Tabarani, al-Mu‘jam al-Kabir (1059); al-Dalil al-Siyahi li-Zuwwar al-Ahsa’ wa al-Sahil al-Sharqi, by al-Dughan and al-Shaykh."}, "r": {"ar": "وجوب تعلم الفرائض والسنن؛ معاملة المجوس معاملة أهل الكتاب في الجزية.", "en": "The duty to learn the obligations and the Sunna; treating Magians like the People of the Book in jizya."}, "cat": "text", "sec": "d"}, {"id": 24, "t": {"ar": "كتابه ﷺ إلى أهل البحرين", "en": "The letter to the people of Bahrain"}, "c": {"ar": "عن ابن عباس قال: كتب رسول الله ﷺ إلى البحرين:\n«فإنكم إذا أقمتم الصلاة، وآتيتم الزكاة، ونصحتم لله ورسوله، وآتيتم عشر النخل ونصف عشر الحب، ولم تمجسوا أولادكم، فلكم ما أسلمتم عليه، غير أن بيت النار لله ورسوله، وإن أبيتم فعليكم الجزية».\nفكره المجوس واليهود الإسلام وأحبوا أداء الجزية، وقال منافقو العرب: زعم محمد أنه لا يقبل الجزية إلا من أهل الكتاب وقد قبلها من مجوس هجر وهم غير أهل كتاب، فنزلت: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا عَلَيْكُمْ أَنفُسَكُمْ لَا يَضُرُّكُم مَّن ضَلَّ إِذَا اهْتَدَيْتُمْ﴾ (المائدة: 105).", "en": "Ibn ‘Abbas said: The Messenger of God ﷺ wrote to historical Bahrain (the region centred on al-Ahsa):\n“If you establish prayer, pay zakat, are sincere to God and His Messenger, give a tenth of your palms and a twentieth of your grain, and do not raise your children as Magians, you keep what you held when you embraced Islam, except that the fire-temple belongs to God and His Messenger. If you refuse, you owe jizya.”\nThe Magians and Jews disliked Islam and preferred to pay jizya. The hypocrites among the Arabs said: “Muhammad claimed he would accept jizya only from the People of the Book, yet he has accepted it from the Magians of Hajar, who are not People of the Book.” Then this was revealed: “O you who believe, you are responsible for yourselves; whoever goes astray cannot harm you if you are guided” (al-Ma’ida 5:105)."}, "l": {"ar": "الإسلام يحفظ لأهل البلاد أموالهم إذا أسلموا؛ والمؤمن مسؤول عن هدايته لا عن ضلال غيره.", "en": "Islam preserved people’s property when they embraced it; the believer answers for his own guidance, not for another’s straying."}, "s": {"ar": "فتوح البلدان للبلاذري؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "al-Baladhuri, Futuh al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "زكاة الزروع والثمار: العشر ونصف العشر، ويشهد له حديث البخاري (1483): «فيما سقت السماء والعيون أو كان عثرياً العشر، وما سقي بالنضح نصف العشر»؛ الصلاة والزكاة؛ أحكام الجزية؛ سبب نزول آية المائدة (كما أورده البلاذري).", "en": "Zakat on crops and fruit: a tenth and a twentieth, supported by al-Bukhari 1483: “On what is watered by rain and springs, or is naturally irrigated, a tenth; on what is watered by irrigation, a twentieth”; prayer and zakat; rulings on jizya; the occasion of the al-Ma’ida verse (as al-Baladhuri reports)."}, "cat": "text", "sec": "d"}, {"id": 25, "t": {"ar": "صلح العلاء", "en": "Al-‘Ala’’s treaty"}, "c": {"ar": "صلح العلاء بن الحضرمي مع أهل الأرض من المجوس واليهود والنصارى:\n«بسم الله الرحمن الرحيم. هذا ما صالح عليه العلاء بن الحضرمي أهل البحرين، صالحهم على أن يكفونا العمل ويقاسمونا التمر، فمن لم يف بهذا فعليه لعنة الله والملائكة والناس أجمعين».\nأما الجزية فقد كانت على كل حالم دينار.", "en": "Al-‘Ala’ ibn al-Hadrami’s treaty with the Magians, Jews and Christians of the land:\n“In the name of God, the Most Gracious, the Most Merciful. This is what al-‘Ala’ ibn al-Hadrami agreed with the people of historical Bahrain: that they spare us the work and share the dates with us. Whoever does not keep this, upon him is the curse of God, the angels and all people.”\nAs for jizya, it was a dinar on every adult."}, "l": {"ar": "العدل في العقود ووضوح شروطها، وتعظيم الوفاء بالعهد.", "en": "Fairness in contracts and clear terms, and the gravity of keeping one’s word."}, "s": {"ar": "البحرين في صدر الإسلام لعبد الرحمن عبد الكريم النجم؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "‘Abd al-Rahman ‘Abd al-Karim al-Najm, al-Bahrain fi Sadr al-Islam; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "أحكام المساقاة والمزارعة، ويشهد له حديث البخاري (2328): أن النبي ﷺ «عامل خيبر بشطر ما يخرج منها من ثمر أو زرع»؛ أحكام الصلح والجزية؛ الوفاء بالعقود.", "en": "Rulings on sharecropping, supported by al-Bukhari 2328: the Prophet ﷺ “dealt with Khaybar for half of what it produced in fruit or crops”; rulings on treaties and jizya; keeping contracts."}, "cat": "text", "sec": "d"}, {"id": 26, "t": {"ar": "العشر والخراج", "en": "The tithe and the land tax"}, "c": {"ar": "عن العلاء بن الحضرمي قال: «بعثني رسول الله ﷺ إلى البحرين -أو قال: هجر- وكنت آتي الحائط بين الإخوة قد أسلم بعضهم، فآخذ من المسلم العشر، ومن المشرك الخراج».", "en": "Al-‘Ala’ ibn al-Hadrami said: “The Messenger of God ﷺ sent me to historical Bahrain (or he said: Hajar). I would come to an orchard shared by brothers, some of whom had embraced Islam, and take a tenth from the Muslim and the land tax from the one who had not.”"}, "l": {"ar": "دقة الإدارة المالية في صدر الإسلام وعدلها حتى في البستان الواحد.", "en": "The precise, fair financial administration of early Islam, even within a single orchard."}, "s": {"ar": "فتوح البلدان للبلاذري (عن محمد بن زيد بن حيان الأعرج)؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "al-Baladhuri, Futuh al-Buldan (from Muhammad ibn Zayd ibn Hayyan al-A‘raj); ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "الفرق بين الزكاة (العشر) على المسلم والخراج على غير المسلم؛ زكاة الثمار.", "en": "The difference between zakat (a tenth) on a Muslim and kharaj on a non-Muslim; zakat on fruit."}, "cat": "text", "sec": "d"}, {"id": 27, "t": {"ar": "بلا قتال", "en": "Without fighting"}, "c": {"ar": "عن قتادة قال: «لم يكن للبحرين أيام رسول الله ﷺ قتال، ولكن بعضهم أسلم وبعضهم صالح العلاء على أنصاف الحب والتمر».", "en": "Qatada said: “There was no fighting in historical Bahrain (the region centred on al-Ahsa) in the days of the Messenger of God ﷺ. Some of its people embraced Islam, and some made a treaty with al-‘Ala’ for half of their grain and dates.”"}, "l": {"ar": "انتشار الإسلام في البحرين سلماً؛ ومن أسباب بروز الصلح وقوف عبد القيس إلى جانب العلاء ومؤازرتهم له.", "en": "Islam spread in Bahrain peacefully; one reason for the treaty was that ‘Abd al-Qays stood with al-‘Ala’ and supported him."}, "s": {"ar": "فتوح البلدان للبلاذري؛ تاريخ هجر لعبد الرحمن بن عثمان آل ملا.", "en": "al-Baladhuri, Futuh al-Buldan; ‘Abd al-Rahman ibn ‘Uthman Al Mulla, Tarikh Hajar."}, "r": {"ar": "أحكام الصلح؛ المزارعة على جزء من الخارج.", "en": "Rulings on treaties; sharecropping for a share of the produce."}, "cat": "text", "sec": "d"}, {"id": 28, "t": {"ar": "كتابه ﷺ إلى الأكبر بن عبد القيس", "en": "The letter to al-Akbar ibn ‘Abd al-Qays"}, "c": {"ar": "كتاب النبي ﷺ إلى الأكبر بن عبد القيس:\n«من محمد رسول الله إلى الأكبر بن عبد القيس. إنهم آمنوا بأمان الله وأمان رسوله على ما أحدثوا في الجاهلية من القحم، وعليهم الوفاء بما عاهدوا، ولهم أن لا يحبسوا عن طريق الميرة، ولا يم
